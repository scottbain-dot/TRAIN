<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HYROX ENGINE</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'bebas': ['Bebas Neue', 'sans-serif'], 'mono': ['JetBrains Mono', 'monospace'] },
                    colors: {
                        'hyrox': { 'bg': '#0a0a0a', 'card': '#1a1a1a', 'elevated': '#222222', 'border': '#2a2a2a', 'red': '#FF3131', 'orange': '#FF6B35' },
                        'zone': { 1: '#3B82F6', 2: '#22C55E', 3: '#EAB308', 4: '#F97316', 5: '#EF4444' }
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #0a0a0a; color: white; margin: 0; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .gradient-red { background: linear-gradient(135deg, #FF3131 0%, #FF6B35 100%); }
        .gradient-text { background: linear-gradient(135deg, #FF3131 0%, #FF6B35 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 5px rgba(255,49,49,0.3); } 50% { box-shadow: 0 0 20px rgba(255,49,49,0.6); } }
        .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 1s linear infinite; }
        .pillar-card { transition: transform 0.2s, box-shadow 0.2s; }
        .pillar-card:active { transform: scale(0.98); }
        input[type="number"], input[type="text"] { background: #222; border: 1px solid #333; border-radius: 8px; padding: 12px; color: white; width: 100%; font-family: 'JetBrains Mono', monospace; }
        input:focus { outline: none; border-color: #FF3131; }
    </style>
</head>
<body class="bg-hyrox-bg min-h-screen">
    <div id="app"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // ============================================
        // CONFIGURATION & TARGETS
        // ============================================
        const SHEETS_CONFIG = {
            sheetId: '1BlGGukORumWb7508lcu-SS0wF8lMwdOJEsOp-vGCKrc',
            sheets: { workouts: 'Workouts', daily: 'DailyMetrics' }
        };

        // Targets reverse-engineered from 1:05:00 goal
        const TARGETS = {
            raceTime: 65, // minutes
            vo2max: 48,
            twoKmTime: 465, // 7:45 in seconds
            thresholdPace: 255, // 4:15/km in seconds
            twentyMinDistance: 5.2, // km
            z2PaceAt140: 320, // 5:20/km in seconds
            weeklyVolume: 50, // km
            stationTotal: 29 * 60, // 29:00 in seconds
            miniSimTotal: 25 * 60 + 40, // 25:40 for 4x(1km+station)
        };

        // Current baselines (will be updated from tests)
        const DEFAULT_BASELINES = {
            vo2max: 43.5,
            twoKmTime: 540, // 9:00
            thresholdPace: 285, // 4:45/km
            twentyMinDistance: 4.5,
            z2PaceAt140: 350, // 5:50/km
        };

        // ============================================
        // LOCAL STORAGE HELPERS
        // ============================================
        const storage = {
            get: (key, defaultVal) => {
                try {
                    const item = localStorage.getItem(`hyrox_${key}`);
                    return item ? JSON.parse(item) : defaultVal;
                } catch { return defaultVal; }
            },
            set: (key, value) => {
                localStorage.setItem(`hyrox_${key}`, JSON.stringify(value));
            }
        };

        // ============================================
        // DATA FETCHING
        // ============================================
        const fetchSheetData = async (sheetName) => {
            if (!SHEETS_CONFIG.sheetId) return [];
            const url = `https://docs.google.com/spreadsheets/d/${SHEETS_CONFIG.sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
            try {
                const response = await fetch(url);
                const text = await response.text();
                const json = JSON.parse(text.substring(47).slice(0, -2));
                if (!json.table || !json.table.rows) return [];
                const headers = json.table.cols.map(col => col.label || '');
                return json.table.rows.map(row => {
                    const obj = {};
                    row.c?.forEach((cell, i) => { if (headers[i]) obj[headers[i]] = cell?.v ?? cell?.f ?? null; });
                    return obj;
                });
            } catch (err) { console.error(`Error fetching ${sheetName}:`, err); return []; }
        };

        const getValue = (row, ...keys) => {
            for (const key of keys) {
                if (row[key] !== undefined && row[key] !== null && row[key] !== '') return row[key];
                for (const rowKey of Object.keys(row)) {
                    if (rowKey.toLowerCase().includes(key.toLowerCase()) && row[rowKey]) return row[rowKey];
                }
            }
            return null;
        };

        const normalizeWorkout = (row) => ({
            date: getValue(row, 'Date'),
            type: getValue(row, 'Workout Type', 'type'),
            duration: parseFloat(getValue(row, 'Duration (min)', 'Duration')) || 0,
            distance: parseFloat(getValue(row, 'Distance (km)', 'Distance')) || 0,
            avgHR: parseFloat(getValue(row, 'Avg HR', 'AvgHR')) || 0,
            maxHR: parseFloat(getValue(row, 'Max HR', 'MaxHR')) || 0,
        });

        const normalizeDailyMetric = (row) => ({
            date: getValue(row, 'Date'),
            restingHR: parseFloat(getValue(row, 'Resting HR')) || 0,
            hrv: parseFloat(getValue(row, 'HRV')) || 0,
            vo2Max: parseFloat(getValue(row, 'VO2 Max', 'VO2')) || 0,
            steps: parseFloat(getValue(row, 'Steps')) || 0,
        });

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        const formatTime = (seconds) => {
            const mins = Math.floor(seconds / 60);
            const secs = Math.round(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        };

        const formatPace = (secPerKm) => {
            const mins = Math.floor(secPerKm / 60);
            const secs = Math.round(secPerKm % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}/km`;
        };

        const parseTimeInput = (str) => {
            if (!str) return 0;
            const parts = str.split(':');
            if (parts.length === 2) return parseInt(parts[0]) * 60 + parseInt(parts[1]);
            return parseInt(str) || 0;
        };

        const calculateProgress = (current, baseline, target) => {
            // Returns 0-100 progress percentage
            const totalGap = baseline - target;
            if (totalGap <= 0) return current <= target ? 100 : 0;
            const progress = baseline - current;
            return Math.max(0, Math.min(100, (progress / totalGap) * 100));
        };

        const calculateProgressInverse = (current, baseline, target) => {
            // For metrics where higher is better (vo2max, distance)
            const totalGap = target - baseline;
            if (totalGap <= 0) return current >= target ? 100 : 0;
            const progress = current - baseline;
            return Math.max(0, Math.min(100, (progress / totalGap) * 100));
        };

        const getProgressColor = (pct) => {
            if (pct >= 75) return 'text-green-500';
            if (pct >= 50) return 'text-yellow-500';
            if (pct >= 25) return 'text-orange-500';
            return 'text-red-500';
        };

        const getProgressBg = (pct) => {
            if (pct >= 75) return 'bg-green-500';
            if (pct >= 50) return 'bg-yellow-500';
            if (pct >= 25) return 'bg-orange-500';
            return 'bg-red-500';
        };

        // ============================================
        // MAIN APP
        // ============================================
        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [loading, setLoading] = useState(true);
            const [lastSync, setLastSync] = useState(null);
            
            // Data from Google Sheets
            const [workouts, setWorkouts] = useState([]);
            const [dailyMetrics, setDailyMetrics] = useState([]);
            
            // Test results (stored locally)
            const [testResults, setTestResults] = useState(() => storage.get('testResults', {
                twoKm: [], // { date, time (seconds), avgHR }
                threshold: [], // { date, distance (km), avgHR, avgPace }
                miniSim: [], // { date, station, rounds: [{runTime, stationTime}], total }
            }));
            
            // Profile settings
            const [profile, setProfile] = useState(() => storage.get('profile', {
                name: 'Lad',
                restingHRBaseline: 55,
                maxHR: 183,
                weeklyVolumeTarget: 50,
                raceDate: '2026-08-15',
                raceName: 'HYROX Cologne',
                targetTime: '1:05:00',
                currentPB: '1:17:18',
            }));

            // Modal states
            const [showTestModal, setShowTestModal] = useState(null);
            const [showSettings, setShowSettings] = useState(false);

            // Save to localStorage when data changes
            useEffect(() => { storage.set('testResults', testResults); }, [testResults]);
            useEffect(() => { storage.set('profile', profile); }, [profile]);

            // Fetch data from Google Sheets
            const syncData = useCallback(async () => {
                setLoading(true);
                try {
                    const [workoutsRaw, dailyRaw] = await Promise.all([
                        fetchSheetData(SHEETS_CONFIG.sheets.workouts),
                        fetchSheetData(SHEETS_CONFIG.sheets.daily)
                    ]);
                    setWorkouts(workoutsRaw.map(normalizeWorkout).filter(w => w.date));
                    setDailyMetrics(dailyRaw.map(normalizeDailyMetric).filter(d => d.date));
                    setLastSync(new Date());
                } catch (err) { console.error('Sync error:', err); }
                setLoading(false);
            }, []);

            useEffect(() => { syncData(); }, [syncData]);

            // ============================================
            // COMPUTED METRICS
            // ============================================
            const now = Date.now();
            const cutoff7 = now - 7 * 24 * 60 * 60 * 1000;
            const cutoff30 = now - 30 * 24 * 60 * 60 * 1000;

            const last7Workouts = workouts.filter(w => new Date(w.date) >= cutoff7);
            const last30Workouts = workouts.filter(w => new Date(w.date) >= cutoff30);
            
            const weeklyVolume = last7Workouts.reduce((s, w) => s + (w.distance || 0), 0);
            const weeklyDuration = last7Workouts.reduce((s, w) => s + (w.duration || 0), 0);

            // Get latest VO2max from Apple Watch
            const latestVo2 = [...dailyMetrics].sort((a, b) => new Date(b.date) - new Date(a.date))
                .find(d => d.vo2Max > 0)?.vo2Max || DEFAULT_BASELINES.vo2max;

            // Get latest resting HR
            const latestRestingHR = [...dailyMetrics].sort((a, b) => new Date(b.date) - new Date(a.date))
                .find(d => d.restingHR > 0)?.restingHR || profile.restingHRBaseline;

            // Get latest test results
            const latest2km = testResults.twoKm.length > 0 
                ? testResults.twoKm[testResults.twoKm.length - 1] 
                : { time: DEFAULT_BASELINES.twoKmTime };
            
            const latestThreshold = testResults.threshold.length > 0 
                ? testResults.threshold[testResults.threshold.length - 1] 
                : { avgPace: DEFAULT_BASELINES.thresholdPace, distance: DEFAULT_BASELINES.twentyMinDistance };

            const latestMiniSim = testResults.miniSim.length > 0 
                ? testResults.miniSim[testResults.miniSim.length - 1] 
                : null;

            // Calculate Z2 efficiency from recent easy runs
            const z2Runs = last30Workouts.filter(w => 
                w.avgHR > 0 && w.avgHR <= 145 && w.distance > 3 && w.duration > 20
            );
            const avgZ2Pace = z2Runs.length > 0 
                ? z2Runs.reduce((s, w) => s + (w.duration * 60 / w.distance), 0) / z2Runs.length
                : DEFAULT_BASELINES.z2PaceAt140;

            // Calculate progress for each pillar
            const pillars = {
                aerobic: {
                    name: 'Aerobic Base',
                    icon: '🫀',
                    current: latestVo2,
                    target: TARGETS.vo2max,
                    baseline: DEFAULT_BASELINES.vo2max,
                    unit: '',
                    format: (v) => v.toFixed(1),
                    progress: calculateProgressInverse(latestVo2, DEFAULT_BASELINES.vo2max, TARGETS.vo2max),
                    secondary: `Z2: ${formatPace(avgZ2Pace)}`,
                    lastTest: dailyMetrics.length > 0 ? 'Apple Watch' : 'No data',
                },
                threshold: {
                    name: 'Threshold',
                    icon: '⚡',
                    current: latestThreshold.avgPace,
                    target: TARGETS.thresholdPace,
                    baseline: DEFAULT_BASELINES.thresholdPace,
                    unit: '/km',
                    format: (v) => formatTime(v),
                    progress: calculateProgress(latestThreshold.avgPace, DEFAULT_BASELINES.thresholdPace, TARGETS.thresholdPace),
                    secondary: latestThreshold.distance ? `${latestThreshold.distance.toFixed(2)}km in 20min` : 'No test yet',
                    lastTest: testResults.threshold.length > 0 ? testResults.threshold[testResults.threshold.length - 1].date : 'Not tested',
                },
                vo2max: {
                    name: '2km Speed',
                    icon: '🔥',
                    current: latest2km.time,
                    target: TARGETS.twoKmTime,
                    baseline: DEFAULT_BASELINES.twoKmTime,
                    unit: '',
                    format: (v) => formatTime(v),
                    progress: calculateProgress(latest2km.time, DEFAULT_BASELINES.twoKmTime, TARGETS.twoKmTime),
                    secondary: latest2km.avgHR ? `@ ${latest2km.avgHR}bpm` : '',
                    lastTest: testResults.twoKm.length > 0 ? testResults.twoKm[testResults.twoKm.length - 1].date : 'Not tested',
                },
                functional: {
                    name: 'Stations',
                    icon: '🏋️',
                    current: latestMiniSim?.total || 0,
                    target: TARGETS.miniSimTotal,
                    baseline: 30 * 60, // 30:00 baseline
                    unit: '',
                    format: (v) => v > 0 ? formatTime(v) : '--:--',
                    progress: latestMiniSim ? calculateProgress(latestMiniSim.total, 30 * 60, TARGETS.miniSimTotal) : 0,
                    secondary: latestMiniSim ? `${latestMiniSim.station}` : 'No test yet',
                    lastTest: testResults.miniSim.length > 0 ? testResults.miniSim[testResults.miniSim.length - 1].date : 'Not tested',
                },
            };

            // Race countdown
            const raceDate = new Date(profile.raceDate);
            const countdown = Math.max(0, Math.floor((raceDate - now) / 86400000));

            // Predicted race time based on current metrics
            const predictedTime = Math.round(
                40 + // base
                (latest2km.time / 60 * 3.5) + // 2km contributes ~3.5x
                (latestThreshold.avgPace / 60 * 2) - // threshold pace
                (weeklyVolume * 0.1) + // volume bonus
                (latestMiniSim ? (latestMiniSim.total / 60 - 25) * 0.5 : 5) // station penalty/bonus
            );

            // ============================================
            // TEST LOGGING MODALS
            // ============================================
            const TwoKmTestModal = () => {
                const [time, setTime] = useState('');
                const [avgHR, setAvgHR] = useState('');

                const handleSave = () => {
                    const seconds = parseTimeInput(time);
                    if (seconds > 0) {
                        setTestResults(prev => ({
                            ...prev,
                            twoKm: [...prev.twoKm, {
                                date: new Date().toISOString().split('T')[0],
                                time: seconds,
                                avgHR: parseInt(avgHR) || null,
                            }]
                        }));
                        setShowTestModal(null);
                    }
                };

                return (
                    <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4" onClick={() => setShowTestModal(null)}>
                        <div className="bg-hyrox-card rounded-2xl p-6 w-full max-w-sm" onClick={e => e.stopPropagation()}>
                            <h2 className="font-bebas text-2xl mb-4">LOG 2KM TIME TRIAL</h2>
                            
                            <div className="space-y-4">
                                <div>
                                    <label className="text-xs text-gray-400 uppercase">Time (m:ss)</label>
                                    <input 
                                        type="text" 
                                        placeholder="9:00"
                                        value={time}
                                        onChange={e => setTime(e.target.value)}
                                        className="mt-1"
                                    />
                                </div>
                                <div>
                                    <label className="text-xs text-gray-400 uppercase">Avg Heart Rate (optional)</label>
                                    <input 
                                        type="number" 
                                        placeholder="175"
                                        value={avgHR}
                                        onChange={e => setAvgHR(e.target.value)}
                                        className="mt-1"
                                    />
                                </div>
                            </div>

                            <div className="flex gap-3 mt-6">
                                <button onClick={() => setShowTestModal(null)} className="flex-1 py-3 rounded-xl bg-hyrox-elevated">Cancel</button>
                                <button onClick={handleSave} className="flex-1 py-3 rounded-xl gradient-red font-semibold">Save</button>
                            </div>
                        </div>
                    </div>
                );
            };

            const ThresholdTestModal = () => {
                const [distance, setDistance] = useState('');
                const [avgHR, setAvgHR] = useState('');

                const handleSave = () => {
                    const dist = parseFloat(distance);
                    if (dist > 0) {
                        const avgPace = (20 * 60) / dist; // 20 min in seconds / km
                        setTestResults(prev => ({
                            ...prev,
                            threshold: [...prev.threshold, {
                                date: new Date().toISOString().split('T')[0],
                                distance: dist,
                                avgHR: parseInt(avgHR) || null,
                                avgPace: Math.round(avgPace),
                            }]
                        }));
                        setShowTestModal(null);
                    }
                };

                return (
                    <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4" onClick={() => setShowTestModal(null)}>
                        <div className="bg-hyrox-card rounded-2xl p-6 w-full max-w-sm" onClick={e => e.stopPropagation()}>
                            <h2 className="font-bebas text-2xl mb-4">LOG 20-MIN THRESHOLD TEST</h2>
                            
                            <div className="space-y-4">
                                <div>
                                    <label className="text-xs text-gray-400 uppercase">Distance covered (km)</label>
                                    <input 
                                        type="number" 
                                        step="0.01"
                                        placeholder="4.50"
                                        value={distance}
                                        onChange={e => setDistance(e.target.value)}
                                        className="mt-1"
                                    />
                                </div>
                                <div>
                                    <label className="text-xs text-gray-400 uppercase">Avg Heart Rate (optional)</label>
                                    <input 
                                        type="number" 
                                        placeholder="168"
                                        value={avgHR}
                                        onChange={e => setAvgHR(e.target.value)}
                                        className="mt-1"
                                    />
                                </div>
                            </div>

                            <p className="text-sm text-gray-500 mt-4">
                                Run as far as you can in exactly 20 minutes at maximum sustainable effort.
                            </p>

                            <div className="flex gap-3 mt-6">
                                <button onClick={() => setShowTestModal(null)} className="flex-1 py-3 rounded-xl bg-hyrox-elevated">Cancel</button>
                                <button onClick={handleSave} className="flex-1 py-3 rounded-xl gradient-red font-semibold">Save</button>
                            </div>
                        </div>
                    </div>
                );
            };

            const MiniSimModal = () => {
                const [station, setStation] = useState('Row 500m');
                const [rounds, setRounds] = useState([
                    { runTime: '', stationTime: '' },
                    { runTime: '', stationTime: '' },
                    { runTime: '', stationTime: '' },
                    { runTime: '', stationTime: '' },
                ]);

                const stations = ['Row 500m', 'Wall Balls ×30', 'Ski Erg 500m', 'Burpees ×15'];

                const handleRoundChange = (index, field, value) => {
                    const newRounds = [...rounds];
                    newRounds[index][field] = value;
                    setRounds(newRounds);
                };

                const handleSave = () => {
                    const parsedRounds = rounds.map(r => ({
                        runTime: parseTimeInput(r.runTime),
                        stationTime: parseTimeInput(r.stationTime),
                    }));
                    
                    const total = parsedRounds.reduce((s, r) => s + r.runTime + r.stationTime, 0);
                    
                    if (total > 0) {
                        setTestResults(prev => ({
                            ...prev,
                            miniSim: [...prev.miniSim, {
                                date: new Date().toISOString().split('T')[0],
                                station,
                                rounds: parsedRounds,
                                total,
                                paceDecay: parsedRounds[3].runTime > 0 && parsedRounds[0].runTime > 0 
                                    ? ((parsedRounds[3].runTime - parsedRounds[0].runTime) / parsedRounds[0].runTime * 100).toFixed(1)
                                    : null,
                            }]
                        }));
                        setShowTestModal(null);
                    }
                };

                return (
                    <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4" onClick={() => setShowTestModal(null)}>
                        <div className="bg-hyrox-card rounded-2xl p-6 w-full max-w-sm max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                            <h2 className="font-bebas text-2xl mb-4">LOG MINI-SIM</h2>
                            
                            <div className="mb-4">
                                <label className="text-xs text-gray-400 uppercase">Station</label>
                                <select 
                                    value={station}
                                    onChange={e => setStation(e.target.value)}
                                    className="w-full mt-1 bg-hyrox-elevated border border-hyrox-border rounded-lg p-3 text-white"
                                >
                                    {stations.map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                            </div>

                            <div className="space-y-3">
                                {rounds.map((round, i) => (
                                    <div key={i} className="bg-hyrox-elevated rounded-xl p-3">
                                        <p className="text-xs text-gray-400 mb-2">Round {i + 1}</p>
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <label className="text-xs text-gray-500">1km Run</label>
                                                <input 
                                                    type="text" 
                                                    placeholder="4:30"
                                                    value={round.runTime}
                                                    onChange={e => handleRoundChange(i, 'runTime', e.target.value)}
                                                    className="mt-1 text-sm"
                                                />
                                            </div>
                                            <div>
                                                <label className="text-xs text-gray-500">{station.split(' ')[0]}</label>
                                                <input 
                                                    type="text" 
                                                    placeholder="1:45"
                                                    value={round.stationTime}
                                                    onChange={e => handleRoundChange(i, 'stationTime', e.target.value)}
                                                    className="mt-1 text-sm"
                                                />
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div className="flex gap-3 mt-6">
                                <button onClick={() => setShowTestModal(null)} className="flex-1 py-3 rounded-xl bg-hyrox-elevated">Cancel</button>
                                <button onClick={handleSave} className="flex-1 py-3 rounded-xl gradient-red font-semibold">Save</button>
                            </div>
                        </div>
                    </div>
                );
            };

            // ============================================
            // RENDER: DASHBOARD
            // ============================================
            const renderDashboard = () => (
                <div className="pb-24 hide-scrollbar">
                    {/* Header */}
                    <div className="px-5 py-4 flex justify-between items-center">
                        <div>
                            <p className="text-xs text-gray-500">
                                {lastSync ? `Synced ${lastSync.toLocaleTimeString()}` : 'Not synced'}
                            </p>
                            <h1 className="font-bebas text-2xl tracking-wide">
                                {loading ? 'LOADING...' : `HI ${profile.name.toUpperCase()}`}
                            </h1>
                        </div>
                        <button 
                            onClick={syncData}
                            disabled={loading}
                            className={`p-2 bg-hyrox-card rounded-lg border border-hyrox-border ${loading ? 'opacity-50' : ''}`}
                        >
                            <svg className={`w-5 h-5 ${loading ? 'spin' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                        </button>
                    </div>

                    {/* Race Card */}
                    <div className="px-5 mb-5">
                        <div className="gradient-red rounded-2xl p-5 relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full -translate-y-1/2 translate-x-1/2"></div>
                            <div className="flex justify-between items-start">
                                <div>
                                    <p className="text-xs uppercase tracking-widest opacity-80">{profile.raceName}</p>
                                    <div className="flex items-baseline gap-2 mt-1">
                                        <span className="font-mono text-4xl font-bold">{countdown}</span>
                                        <span className="opacity-70">days</span>
                                    </div>
                                </div>
                                <div className="text-right">
                                    <p className="text-xs opacity-70">Target</p>
                                    <p className="font-mono text-2xl font-bold">{profile.targetTime}</p>
                                </div>
                            </div>
                            <div className="flex gap-6 mt-3 text-sm">
                                <div><span className="opacity-70">Current PB:</span> <span className="font-mono">{profile.currentPB}</span></div>
                                <div><span className="opacity-70">Predicted:</span> <span className="font-mono font-bold">{formatTime(predictedTime * 60)}</span></div>
                            </div>
                        </div>
                    </div>

                    {/* Performance Pillars */}
                    <div className="px-5 mb-5">
                        <h2 className="font-bebas text-xl tracking-wide mb-3">PERFORMANCE PILLARS</h2>
                        <div className="grid grid-cols-2 gap-3">
                            {Object.entries(pillars).map(([key, pillar]) => (
                                <div 
                                    key={key}
                                    className="pillar-card bg-hyrox-card rounded-xl p-4 border border-hyrox-border"
                                    onClick={() => setShowTestModal(key)}
                                >
                                    <div className="flex items-center gap-2 mb-2">
                                        <span className="text-lg">{pillar.icon}</span>
                                        <span className="text-xs text-gray-400 uppercase">{pillar.name}</span>
                                    </div>
                                    
                                    <p className={`font-mono text-2xl font-bold ${getProgressColor(pillar.progress)}`}>
                                        {pillar.format(pillar.current)}<span className="text-sm text-gray-500">{pillar.unit}</span>
                                    </p>
                                    
                                    <div className="mt-2 h-1.5 bg-hyrox-elevated rounded-full overflow-hidden">
                                        <div className={`h-full rounded-full ${getProgressBg(pillar.progress)}`} style={{ width: `${pillar.progress}%` }}></div>
                                    </div>
                                    
                                    <div className="flex justify-between mt-2">
                                        <span className="text-xs text-gray-500">Target: {pillar.format(pillar.target)}</span>
                                        <span className="text-xs text-gray-500">{Math.round(pillar.progress)}%</span>
                                    </div>
                                    
                                    <p className="text-xs text-gray-600 mt-1">{pillar.secondary}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Quick Actions */}
                    <div className="px-5 mb-5">
                        <h2 className="font-bebas text-xl tracking-wide mb-3">LOG TEST</h2>
                        <div className="flex gap-2 overflow-x-auto hide-scrollbar pb-2">
                            <button onClick={() => setShowTestModal('twoKm')} className="flex-shrink-0 px-4 py-3 bg-hyrox-card border border-hyrox-border rounded-xl text-sm">
                                🔥 2km TT
                            </button>
                            <button onClick={() => setShowTestModal('threshold')} className="flex-shrink-0 px-4 py-3 bg-hyrox-card border border-hyrox-border rounded-xl text-sm">
                                ⚡ 20-min Test
                            </button>
                            <button onClick={() => setShowTestModal('miniSim')} className="flex-shrink-0 px-4 py-3 bg-hyrox-card border border-hyrox-border rounded-xl text-sm">
                                🏋️ Mini-Sim
                            </button>
                        </div>
                    </div>

                    {/* This Week Stats */}
                    <div className="px-5 mb-5">
                        <h2 className="font-bebas text-xl tracking-wide mb-3">THIS WEEK</h2>
                        <div className="bg-hyrox-card rounded-xl p-4 border border-hyrox-border">
                            <div className="flex justify-between items-center mb-3">
                                <span className="text-gray-400">Volume</span>
                                <span className="font-mono text-xl font-bold">{weeklyVolume.toFixed(1)} <span className="text-sm text-gray-500">/ {profile.weeklyVolumeTarget}km</span></span>
                            </div>
                            <div className="h-2 bg-hyrox-elevated rounded-full overflow-hidden mb-4">
                                <div className="h-full bg-green-500 rounded-full" style={{ width: `${Math.min(100, (weeklyVolume / profile.weeklyVolumeTarget) * 100)}%` }}></div>
                            </div>
                            <div className="grid grid-cols-3 gap-3 text-center">
                                <div>
                                    <p className="font-mono text-lg font-bold">{last7Workouts.length}</p>
                                    <p className="text-xs text-gray-500">Sessions</p>
                                </div>
                                <div>
                                    <p className="font-mono text-lg font-bold">{Math.round(weeklyDuration)}</p>
                                    <p className="text-xs text-gray-500">Minutes</p>
                                </div>
                                <div>
                                    <p className="font-mono text-lg font-bold">{latestRestingHR}</p>
                                    <p className="text-xs text-gray-500">Resting HR</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Readiness */}
                    <div className="px-5 mb-5">
                        <div className="bg-hyrox-card rounded-xl p-4 border border-hyrox-border">
                            <div className="flex justify-between items-center">
                                <div>
                                    <p className="text-xs text-gray-400 uppercase">Today's Readiness</p>
                                    <div className="flex items-baseline gap-2 mt-1">
                                        <span className="font-mono text-3xl font-bold text-green-500">
                                            {latestRestingHR <= profile.restingHRBaseline + 3 ? 'GO' : latestRestingHR <= profile.restingHRBaseline + 6 ? 'EASY' : 'REST'}
                                        </span>
                                    </div>
                                </div>
                                <div className="text-right">
                                    <p className="text-sm"><span className="text-gray-500">RHR:</span> <span className="font-mono">{latestRestingHR}</span></p>
                                    <p className="text-sm"><span className="text-gray-500">Baseline:</span> <span className="font-mono">{profile.restingHRBaseline}</span></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            // ============================================
            // RENDER: PLAN
            // ============================================
            const weekPlan = [
                { day: 'SUN', name: 'Mini-Sim / Rest', type: 'sim', note: 'Every 2 weeks', zone: null },
                { day: 'MON', name: 'Easy Run', type: 'z2', note: '50min Z2', zone: 2 },
                { day: 'TUE', name: 'Strength A', type: 'strength', note: '+ Short intervals', zone: null },
                { day: 'WED', name: 'Easy Run', type: 'z2', note: '45min Z2', zone: 2 },
                { day: 'THU', name: 'Key Session', type: 'key', note: 'See rotation below', zone: 5 },
                { day: 'FRI', name: 'Strength B', type: 'strength', note: 'Functional', zone: null },
                { day: 'SAT', name: 'Long Run', type: 'long', note: '90min Z2', zone: 2 },
            ];

            const getWeekNumber = () => Math.ceil((now - new Date('2026-01-01')) / (7 * 24 * 60 * 60 * 1000)) % 4 + 1;
            const weekNum = getWeekNumber();

            const thursdayRotation = [
                { week: 1, name: '2km Time Trial', desc: 'All-out effort, record time' },
                { week: 2, name: '5×5min @ Threshold', desc: '90sec recovery' },
                { week: 3, name: '20-min Threshold Test', desc: 'Max distance in 20min' },
                { week: 4, name: '8×800m @ 5km Pace', desc: '90sec recovery' },
            ];

            const todayIdx = new Date().getDay();

            const renderPlan = () => (
                <div className="pb-24 hide-scrollbar">
                    <div className="px-5 py-4">
                        <h1 className="font-bebas text-2xl tracking-wide">WEEKLY PLAN</h1>
                        <p className="text-sm text-gray-400">Week {weekNum} of 4-week cycle</p>
                    </div>

                    {/* Thursday Key Session */}
                    <div className="px-5 mb-4">
                        <div className="bg-hyrox-red/20 border border-hyrox-red/40 rounded-xl p-4">
                            <p className="text-xs text-hyrox-red uppercase tracking-wide">Thursday Key Session</p>
                            <p className="font-bebas text-xl mt-1">{thursdayRotation[weekNum - 1].name}</p>
                            <p className="text-sm text-gray-400">{thursdayRotation[weekNum - 1].desc}</p>
                        </div>
                    </div>

                    {/* Week View */}
                    <div className="px-5 space-y-2">
                        {weekPlan.map((day, i) => {
                            const isToday = i === todayIdx;
                            return (
                                <div 
                                    key={day.day}
                                    className={`rounded-xl p-4 border ${
                                        isToday ? 'bg-hyrox-red/10 border-hyrox-red/40 pulse-glow' : 'bg-hyrox-card border-hyrox-border'
                                    }`}
                                >
                                    <div className="flex items-center justify-between">
                                        <div className="flex items-center gap-3">
                                            <div className={`w-10 h-10 rounded-lg flex items-center justify-center ${
                                                day.zone === 2 ? 'bg-zone-2/20' :
                                                day.zone === 5 ? 'bg-zone-5/20' :
                                                day.type === 'strength' ? 'bg-blue-500/20' :
                                                day.type === 'sim' ? 'bg-hyrox-orange/20' :
                                                'bg-hyrox-elevated'
                                            }`}>
                                                <span className="text-xs font-bold">{day.day}</span>
                                            </div>
                                            <div>
                                                <p className="font-semibold">{day.name}</p>
                                                <p className="text-xs text-gray-500">{day.note}</p>
                                            </div>
                                        </div>
                                        {day.zone && (
                                            <span className={`text-xs font-bold px-2 py-1 rounded ${
                                                day.zone === 2 ? 'bg-zone-2/20 text-zone-2' : 'bg-zone-5/20 text-zone-5'
                                            }`}>Z{day.zone}</span>
                                        )}
                                        {day.type === 'strength' && (
                                            <span className="text-xs font-bold px-2 py-1 rounded bg-blue-500/20 text-blue-400">GYM</span>
                                        )}
                                        {isToday && (
                                            <span className="text-xs bg-hyrox-red text-white px-2 py-1 rounded-full">TODAY</span>
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {/* Test Schedule */}
                    <div className="px-5 mt-6">
                        <h2 className="font-bebas text-xl tracking-wide mb-3">4-WEEK TEST ROTATION</h2>
                        <div className="space-y-2">
                            {thursdayRotation.map((t, i) => (
                                <div key={i} className={`rounded-lg p-3 ${weekNum === t.week ? 'bg-hyrox-red/20 border border-hyrox-red/40' : 'bg-hyrox-elevated'}`}>
                                    <div className="flex justify-between">
                                        <span className="text-sm font-medium">Week {t.week}: {t.name}</span>
                                        {weekNum === t.week && <span className="text-xs text-hyrox-red">THIS WEEK</span>}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            // ============================================
            // RENDER: HISTORY
            // ============================================
            const renderHistory = () => (
                <div className="pb-24 hide-scrollbar">
                    <div className="px-5 py-4">
                        <h1 className="font-bebas text-2xl tracking-wide">TEST HISTORY</h1>
                    </div>

                    {/* 2km Tests */}
                    <div className="px-5 mb-6">
                        <h2 className="font-bebas text-lg tracking-wide mb-2">🔥 2KM TIME TRIALS</h2>
                        {testResults.twoKm.length > 0 ? (
                            <div className="space-y-2">
                                {[...testResults.twoKm].reverse().map((t, i) => (
                                    <div key={i} className="bg-hyrox-card rounded-xl p-3 border border-hyrox-border flex justify-between items-center">
                                        <div>
                                            <p className="font-mono text-lg font-bold">{formatTime(t.time)}</p>
                                            <p className="text-xs text-gray-500">{t.date}</p>
                                        </div>
                                        {t.avgHR && <p className="text-sm text-gray-400">{t.avgHR}bpm</p>}
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <p className="text-gray-500 text-sm">No tests logged yet</p>
                        )}
                        <p className="text-xs text-gray-600 mt-2">Target: {formatTime(TARGETS.twoKmTime)}</p>
                    </div>

                    {/* Threshold Tests */}
                    <div className="px-5 mb-6">
                        <h2 className="font-bebas text-lg tracking-wide mb-2">⚡ 20-MIN THRESHOLD TESTS</h2>
                        {testResults.threshold.length > 0 ? (
                            <div className="space-y-2">
                                {[...testResults.threshold].reverse().map((t, i) => (
                                    <div key={i} className="bg-hyrox-card rounded-xl p-3 border border-hyrox-border flex justify-between items-center">
                                        <div>
                                            <p className="font-mono text-lg font-bold">{t.distance.toFixed(2)}km</p>
                                            <p className="text-xs text-gray-500">{t.date} · {formatPace(t.avgPace)}</p>
                                        </div>
                                        {t.avgHR && <p className="text-sm text-gray-400">{t.avgHR}bpm</p>}
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <p className="text-gray-500 text-sm">No tests logged yet</p>
                        )}
                        <p className="text-xs text-gray-600 mt-2">Target: {TARGETS.twentyMinDistance}km ({formatPace(TARGETS.thresholdPace)})</p>
                    </div>

                    {/* Mini-Sims */}
                    <div className="px-5 mb-6">
                        <h2 className="font-bebas text-lg tracking-wide mb-2">🏋️ MINI-SIMS</h2>
                        {testResults.miniSim.length > 0 ? (
                            <div className="space-y-2">
                                {[...testResults.miniSim].reverse().map((t, i) => (
                                    <div key={i} className="bg-hyrox-card rounded-xl p-3 border border-hyrox-border">
                                        <div className="flex justify-between items-center mb-2">
                                            <div>
                                                <p className="font-mono text-lg font-bold">{formatTime(t.total)}</p>
                                                <p className="text-xs text-gray-500">{t.date} · {t.station}</p>
                                            </div>
                                            {t.paceDecay && (
                                                <span className={`text-xs px-2 py-1 rounded ${parseFloat(t.paceDecay) <= 5 ? 'bg-green-500/20 text-green-500' : 'bg-red-500/20 text-red-500'}`}>
                                                    {t.paceDecay > 0 ? '+' : ''}{t.paceDecay}% decay
                                                </span>
                                            )}
                                        </div>
                                        <div className="grid grid-cols-4 gap-1 text-xs">
                                            {t.rounds.map((r, j) => (
                                                <div key={j} className="bg-hyrox-elevated rounded p-1 text-center">
                                                    <p className="text-gray-400">R{j+1}</p>
                                                    <p className="font-mono">{formatTime(r.runTime)}</p>
                                                    <p className="font-mono text-gray-500">{formatTime(r.stationTime)}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        ) : (
                            <p className="text-gray-500 text-sm">No tests logged yet</p>
                        )}
                        <p className="text-xs text-gray-600 mt-2">Target: {formatTime(TARGETS.miniSimTotal)}</p>
                    </div>

                    {/* Recent Workouts */}
                    <div className="px-5">
                        <h2 className="font-bebas text-lg tracking-wide mb-2">RECENT WORKOUTS</h2>
                        <div className="space-y-2">
                            {[...workouts].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 10).map((w, i) => (
                                <div key={i} className="bg-hyrox-card rounded-xl p-3 border border-hyrox-border flex justify-between items-center">
                                    <div>
                                        <p className="font-medium">{w.type || 'Workout'}</p>
                                        <p className="text-xs text-gray-500">{new Date(w.date).toLocaleDateString()}</p>
                                    </div>
                                    <div className="text-right text-sm text-gray-400">
                                        <p>{w.duration}min</p>
                                        {w.distance > 0 && <p>{w.distance.toFixed(1)}km</p>}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            // ============================================
            // SETTINGS MODAL
            // ============================================
            const SettingsModal = () => (
                <div className="fixed inset-0 bg-black/80 z-50 flex items-end justify-center" onClick={() => setShowSettings(false)}>
                    <div className="bg-[#141414] rounded-t-3xl p-6 w-full max-w-lg max-h-[85vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                        <div className="w-10 h-1 bg-gray-600 rounded-full mx-auto mb-6"></div>
                        <h2 className="font-bebas text-2xl tracking-wide text-center mb-6">SETTINGS</h2>
                        
                        <div className="space-y-4">
                            <div>
                                <label className="text-xs text-gray-400 uppercase">Name</label>
                                <input 
                                    type="text"
                                    value={profile.name}
                                    onChange={e => setProfile(p => ({ ...p, name: e.target.value }))}
                                    className="mt-1"
                                />
                            </div>
                            <div>
                                <label className="text-xs text-gray-400 uppercase">Resting HR Baseline</label>
                                <input 
                                    type="number"
                                    value={profile.restingHRBaseline}
                                    onChange={e => setProfile(p => ({ ...p, restingHRBaseline: parseInt(e.target.value) || 55 }))}
                                    className="mt-1"
                                />
                            </div>
                            <div>
                                <label className="text-xs text-gray-400 uppercase">Max HR</label>
                                <input 
                                    type="number"
                                    value={profile.maxHR}
                                    onChange={e => setProfile(p => ({ ...p, maxHR: parseInt(e.target.value) || 183 }))}
                                    className="mt-1"
                                />
                            </div>
                            <div>
                                <label className="text-xs text-gray-400 uppercase">Weekly Volume Target (km)</label>
                                <input 
                                    type="number"
                                    value={profile.weeklyVolumeTarget}
                                    onChange={e => setProfile(p => ({ ...p, weeklyVolumeTarget: parseInt(e.target.value) || 50 }))}
                                    className="mt-1"
                                />
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <div>
                                    <label className="text-xs text-gray-400 uppercase">Race Date</label>
                                    <input 
                                        type="date"
                                        value={profile.raceDate}
                                        onChange={e => setProfile(p => ({ ...p, raceDate: e.target.value }))}
                                        className="mt-1"
                                    />
                                </div>
                                <div>
                                    <label className="text-xs text-gray-400 uppercase">Target Time</label>
                                    <input 
                                        type="text"
                                        value={profile.targetTime}
                                        onChange={e => setProfile(p => ({ ...p, targetTime: e.target.value }))}
                                        className="mt-1"
                                    />
                                </div>
                            </div>

                            <div className="pt-4 border-t border-hyrox-border">
                                <p className="text-xs text-gray-500 mb-2">Data Status</p>
                                <p className="text-sm">{workouts.length} workouts synced</p>
                                <p className="text-sm">{dailyMetrics.length} daily records</p>
                                <p className="text-sm">{testResults.twoKm.length + testResults.threshold.length + testResults.miniSim.length} manual tests logged</p>
                            </div>

                            <button 
                                onClick={() => {
                                    if (confirm('Clear all test history?')) {
                                        setTestResults({ twoKm: [], threshold: [], miniSim: [] });
                                    }
                                }}
                                className="w-full py-3 rounded-xl bg-red-500/20 text-red-500 text-sm"
                            >
                                Clear Test History
                            </button>
                        </div>

                        <button onClick={() => setShowSettings(false)} className="w-full gradient-red rounded-xl py-4 font-bebas text-lg tracking-widest mt-6">
                            DONE
                        </button>
                    </div>
                </div>
            );

            // ============================================
            // MAIN RENDER
            // ============================================
            return (
                <div className="max-w-lg mx-auto min-h-screen bg-hyrox-bg">
                    <header className="sticky top-0 z-40 bg-hyrox-bg/95 backdrop-blur px-5 py-4 border-b border-hyrox-border">
                        <div className="flex justify-between items-center">
                            <h1 className="font-bebas text-2xl tracking-widest gradient-text">HYROX ENGINE</h1>
                            <button onClick={() => setShowSettings(true)} className="p-2 bg-hyrox-card rounded-lg border border-hyrox-border">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                            </button>
                        </div>
                    </header>

                    <main className="hide-scrollbar" style={{ height: 'calc(100vh - 130px)', overflowY: 'auto' }}>
                        {activeTab === 'dashboard' && renderDashboard()}
                        {activeTab === 'plan' && renderPlan()}
                        {activeTab === 'history' && renderHistory()}
                    </main>

                    <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-lg bg-[#141414] border-t border-hyrox-border px-6 py-3 pb-6 flex justify-around z-40">
                        {[
                            { id: 'dashboard', label: 'Dashboard', icon: '📊' },
                            { id: 'plan', label: 'Plan', icon: '📋' },
                            { id: 'history', label: 'History', icon: '📈' },
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex flex-col items-center gap-1 ${activeTab === tab.id ? 'opacity-100' : 'opacity-40'}`}
                            >
                                <span className="text-xl">{tab.icon}</span>
                                <span className={`text-xs ${activeTab === tab.id ? 'text-hyrox-red' : ''}`}>{tab.label}</span>
                            </button>
                        ))}
                    </nav>

                    {showSettings && <SettingsModal />}
                    {showTestModal === 'twoKm' && <TwoKmTestModal />}
                    {showTestModal === 'threshold' && <ThresholdTestModal />}
                    {showTestModal === 'miniSim' && <MiniSimModal />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(<App />);
    </script>
</body>
</html>
