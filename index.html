<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HYROX ENGINE</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#F5F3EF">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --bg: #F5F3EF;
            --card: #FFFFFF;
            --card-elevated: #F9F8F5;
            --border: rgba(0,0,0,0.06);
            --text: #1A1A1A;
            --text-secondary: #6B6B6B;
            --text-tertiary: #9E9E9E;
            --green: #34A853;
            --green-dim: rgba(52,168,83,0.1);
            --blue: #4285F4;
            --blue-dim: rgba(66,133,244,0.1);
            --orange: #E8710A;
            --orange-dim: rgba(232,113,10,0.08);
            --red: #D93025;
            --red-dim: rgba(217,48,37,0.08);
            --purple: #9334E6;
            --purple-dim: rgba(147,52,230,0.08);
            --cyan: #0097A7;
            --cyan-dim: rgba(0,151,167,0.08);
            --yellow: #E5A100;
            --yellow-dim: rgba(229,161,0,0.08);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04);
        }
        
        body {
            font-family: 'DM Sans', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }
        
        /* Subtle Gradients for metric cards */
        .grad-readiness {
            background: linear-gradient(135deg, #E8F0FE 0%, #F5F3EF 100%);
        }
        .grad-aerobic {
            background: linear-gradient(135deg, #E6F4EA 0%, #F5F3EF 100%);
        }
        .grad-race {
            background: linear-gradient(135deg, #FEF3E2 0%, #F5F3EF 100%);
        }
        .grad-hyrox {
            background: linear-gradient(135deg, #F3E8FF 0%, #F5F3EF 100%);
        }
        .grad-session {
            background: #FFFFFF;
        }
        
        /* Aurora Glow — subtle warm glow for light theme */
        .aurora {
            position: relative;
            overflow: hidden;
        }
        .aurora::before {
            content: '';
            position: absolute;
            top: -100%;
            left: -50%;
            width: 200%;
            height: 300%;
            background: 
                radial-gradient(ellipse at 30% 30%, rgba(66,133,244,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 70%, rgba(52,168,83,0.03) 0%, transparent 50%);
            animation: auroraMove 20s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes auroraMove {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(5%, -5%) rotate(2deg); }
            66% { transform: translate(-5%, 5%) rotate(-2deg); }
        }
        
        /* Cards */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:active {
            transform: scale(0.98);
            box-shadow: var(--shadow-md);
        }
        
        /* Metric Card */
        .metric-card {
            position: relative;
            padding: 20px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }
        .metric-card .chevron {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--text-tertiary);
        }
        
        /* Typography */
        .label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-tertiary);
        }
        .value-hero {
            font-family: 'DM Serif Display', serif;
            font-size: 48px;
            font-weight: 400;
            letter-spacing: -1px;
            line-height: 1;
            color: var(--text);
        }
        .value-large {
            font-family: 'DM Serif Display', serif;
            font-size: 36px;
            font-weight: 400;
            letter-spacing: -0.5px;
        }
        .value-medium {
            font-size: 24px;
            font-weight: 600;
        }
        .unit {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-secondary);
            margin-left: 4px;
        }
        .insight {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        
        /* Trend Badges */
        .trend {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 20px;
            margin-top: 8px;
        }
        .trend-up { background: var(--green-dim); color: var(--green); }
        .trend-down { background: var(--red-dim); color: var(--red); }
        .trend-stable { background: var(--yellow-dim); color: var(--yellow); }
        .trend-neutral { background: rgba(0,0,0,0.04); color: var(--text-secondary); }
        
        /* Progress Ring */
        .ring-container {
            position: relative;
            width: 80px;
            height: 80px;
        }
        .ring-svg {
            transform: rotate(-90deg);
        }
        .ring-bg {
            fill: none;
            stroke: rgba(0,0,0,0.06);
        }
        .ring-progress {
            fill: none;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s ease-out;
        }
        .ring-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
            font-weight: 600;
        }
        
        /* Progress Bar */
        .progress-bar {
            height: 8px;
            background: rgba(0,0,0,0.06);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.8s ease-out;
        }
        
        /* Charts */
        .chart-container {
            width: 100%;
            height: 180px;
            position: relative;
        }
        .chart-svg {
            width: 100%;
            height: 100%;
        }
        .chart-line {
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .chart-area {
            opacity: 0.15;
        }
        .chart-dot {
            stroke-width: 2;
        }
        .chart-grid-line {
            stroke: rgba(0,0,0,0.05);
            stroke-width: 1;
        }
        .chart-label {
            font-size: 10px;
            fill: var(--text-tertiary);
        }
        
        /* Bar Chart */
        .bar-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 100px;
            padding: 0 4px;
            gap: 6px;
        }
        .bar {
            flex: 1;
            border-radius: 6px 6px 0 0;
            min-width: 12px;
            max-width: 24px;
            transition: height 0.5s ease-out;
            position: relative;
        }
        .bar-label {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            color: var(--text-tertiary);
            white-space: nowrap;
        }
        
        /* Data Row */
        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }
        .data-row:last-child {
            border-bottom: none;
        }
        .data-label {
            font-size: 15px;
            color: var(--text);
        }
        .data-sublabel {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }
        .data-value {
            font-size: 17px;
            font-weight: 600;
            text-align: right;
        }
        
        /* Contributor Row (Oura style) */
        .contributor {
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }
        .contributor:last-child {
            border-bottom: none;
        }
        .contributor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .contributor-bar {
            height: 6px;
            background: rgba(0,0,0,0.06);
            border-radius: 3px;
            overflow: hidden;
        }
        .contributor-fill {
            height: 100%;
            border-radius: 3px;
        }
        
        /* Stat Grid */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .stat-box {
            background: var(--card-elevated);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border);
        }
        .stat-value {
            font-family: 'DM Serif Display', serif;
            font-size: 28px;
            font-weight: 400;
            margin: 6px 0;
        }
        .stat-change {
            font-size: 13px;
            font-weight: 500;
        }
        .stat-change.positive { color: var(--green); }
        .stat-change.negative { color: var(--red); }
        
        /* Insight Box */
        .insight-box {
            padding: 16px;
            border-radius: 14px;
            margin: 16px 0;
        }
        .insight-box.green { background: var(--green-dim); border: 1px solid rgba(52,168,83,0.12); }
        .insight-box.blue { background: var(--blue-dim); border: 1px solid rgba(66,133,244,0.12); }
        .insight-box.orange { background: var(--orange-dim); border: 1px solid rgba(232,113,10,0.12); }
        .insight-box.purple { background: var(--purple-dim); border: 1px solid rgba(147,52,230,0.12); }
        .insight-box.red { background: var(--red-dim); border: 1px solid rgba(217,48,37,0.12); }
        .insight-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .insight-box.green .insight-title { color: var(--green); }
        .insight-box.blue .insight-title { color: var(--blue); }
        .insight-box.orange .insight-title { color: var(--orange); }
        .insight-box.purple .insight-title { color: var(--purple); }
        
        /* Time Toggle */
        .time-toggle {
            display: flex;
            background: var(--card);
            border-radius: 12px;
            padding: 4px;
            border: 1px solid var(--border);
        }
        .time-toggle button {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text-tertiary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .time-toggle button.active {
            background: var(--text);
            color: var(--card);
            box-shadow: var(--shadow-sm);
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }
        .modal-sheet {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            width: 100%;
            max-width: 500px;
            max-height: 94vh;
            background: var(--bg);
            border-radius: 24px 24px 0 0;
            overflow-y: auto;
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
            box-shadow: 0 -4px 32px rgba(0,0,0,0.12);
        }
        .modal-overlay.open .modal-sheet {
            transform: translateX(-50%) translateY(0);
        }
        .modal-handle {
            width: 36px;
            height: 5px;
            background: rgba(0,0,0,0.15);
            border-radius: 3px;
            margin: 8px auto 0;
        }
        .modal-hero {
            position: relative;
            padding: 50px 24px 30px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .modal-back {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
            border: none;
            color: var(--text);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }
        .modal-body {
            padding: 24px;
        }
        .modal-section {
            margin-bottom: 32px;
        }
        .modal-section:last-child {
            margin-bottom: 0;
        }
        
        /* Session Card */
        .session-card {
            position: relative;
            padding: 18px 20px;
            cursor: pointer;
        }
        .session-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 0;
        }
        .session-badge.z2 { background: var(--green-dim); color: var(--green); }
        .session-badge.z4 { background: var(--orange-dim); color: var(--orange); }
        .session-badge.z5 { background: var(--red-dim); color: var(--red); }
        .session-badge.str { background: var(--purple-dim); color: var(--purple); }
        .session-badge.sim { background: var(--cyan-dim); color: var(--cyan); }
        .session-badge.rest { background: rgba(0,0,0,0.04); color: var(--text-tertiary); }
        
        /* Navigation */
        .nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: space-around;
            z-index: 50;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 20px;
            background: none;
            border: none;
            color: var(--text-tertiary);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-item.active {
            color: var(--text);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
        }
        
        /* Utilities */
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 100px;
        }
        .px-5 { padding-left: 20px; padding-right: 20px; }
        .py-4 { padding-top: 16px; padding-bottom: 16px; }
        .mb-3 { margin-bottom: 12px; }
        .mb-4 { margin-bottom: 16px; }
        .mb-5 { margin-bottom: 20px; }
        .mt-4 { margin-top: 16px; }
        .mt-5 { margin-top: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .flex { display: flex; }
        .flex-between { justify-content: space-between; }
        .flex-center { align-items: center; }
        .gap-3 { gap: 12px; }
        .text-center { text-align: center; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-up {
            animation: fadeUp 0.4s ease-out forwards;
        }
        .delay-1 { animation-delay: 0.05s; opacity: 0; }
        .delay-2 { animation-delay: 0.1s; opacity: 0; }
        .delay-3 { animation-delay: 0.15s; opacity: 0; }
        .delay-4 { animation-delay: 0.2s; opacity: 0; }
        .delay-5 { animation-delay: 0.25s; opacity: 0; }
        
        @keyframes countUp {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>window.onerror = function(msg, url, line, col, err) { document.getElementById('app').innerHTML = '<div style="padding:40px;font:14px monospace;color:#D93025"><h2>Script Error</h2><pre>' + msg + '\nLine: ' + line + ' Col: ' + col + '\n' + (err?.stack || '') + '</pre></div>'; };</script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ============================================
// CONFIGURATION
// ============================================
const CONFIG = {
    // Data lives across multiple Google Sheets
    // Health Auto Export creates a NEW sheet each month for metrics
    dataSources: {
        workouts: { sheetId: '1r-IO6Ce-uKJ6SYuEz1IiapHniosIKoyPUwkpGzR3dlM', tab: 'Workouts-2026' },
        daily: { 
            // Health Auto Export creates monthly sheets with tab name "HealthMetrics-YYYY-MM"
            // Since each month is a NEW Google Sheet (not just a new tab), we list sheet IDs per month
            // The app tries all of them and merges the results
            sheets: {
                '2026-02': '1-mUTvwJCzVio0--3DHKBMaaoVHp_yF4kWvXoVYg1EYY',
                // Add new months as Health Auto Export creates them:
                // '2026-03': 'PASTE_MARCH_SHEET_ID_HERE',
                // '2026-04': 'PASTE_APRIL_SHEET_ID_HERE',
            },
            tabPattern: 'HealthMetrics-',  // tab name = tabPattern + YYYY-MM
        },
        plan: { sheetId: '1BlGGukORumWb7508lcu-SS0wF8lMwdOJEsOp-vGCKrc', tabs: { weeklyPlan: 'WeeklyPlan', strengthA: 'StrengthA', strengthB: 'StrengthB' } }
    },
    targets: { vo2max: 48, twoKm: 465, threshold: 255, weeklyKm: 50, raceTime: 3900 },
    baselines: { vo2max: 43.5, twoKm: 540, threshold: 285, restingHR: 55 },
    profile: { name: 'Lad', hrBaseline: 55, raceDate: '2027-04-15', raceName: 'Malaga', age: 42 },
    
    // ═══ HEART RATE ZONES ═══
    // Matched to Apple Watch zones (HRR method, auto-calculated)
    // Actual max HR: 183 (HYROX race data). Apple uses 179 for zone calc.
    // Manual zone data from Apple Fitness takes priority over estimation.
    maxHR: 183,
    hrZones: {
        z1: { name: 'Recovery',   min: 0,    max: 0.705, color: 'var(--text-tertiary)', label: 'Z1' },  // <129
        z2: { name: 'Aerobic',    min: 0.705, max: 0.776, color: 'var(--green)',         label: 'Z2' },  // 130-141
        z3: { name: 'Tempo',      min: 0.776, max: 0.841, color: 'var(--blue)',          label: 'Z3' },  // 142-153
        z4: { name: 'Threshold',  min: 0.841, max: 0.907, color: 'var(--orange)',        label: 'Z4' },  // 154-165
        z5: { name: 'VO₂max',     min: 0.907, max: 1.00,  color: 'var(--red)',           label: 'Z5' },  // 166+
    },
    // Polarized targets: 80/0/20 (Z1-2 / Z3 / Z4-5)
    polarizedTarget: { easy: 80, tempo: 0, hard: 20 },
    
    // Session-specific HR targets (updated to match Apple zones)
    sessionHR: {
        z2Stepper:    { target: 135, range: [130, 141], note: 'Steady state. Should feel easy. Can hold a conversation.' },
        z2Run:        { target: 138, range: [130, 141], note: 'Easy effort. Nasal breathing. Build aerobic base.' },
        threshold:    { target: 160, range: [154, 165], note: 'Comfortably hard. Race pace effort.' },
        vo2max:       { target: 172, range: [166, 183], note: 'Hard intervals. Max sustainable for 3-5 min.' },
        compromised:  { target: 158, range: [150, 170], note: '1km repeats + stations. Avg will be lower due to transitions.' },
        strength:     { target: null, range: [100, 150], note: 'Variable. Spikes on power moves, drops on rest.' },
    }
};

// ============================================
// UTILITIES
// ============================================
const storage = {
    get: (k, d) => { try { return JSON.parse(localStorage.getItem('hyrox12_' + k)) || d; } catch { return d; } },
    set: (k, v) => localStorage.setItem('hyrox12_' + k, JSON.stringify(v))
};

// Local date string helper — avoids UTC timezone shift from toISOString()
const localDateStr = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

const fmt = {
    time: (s) => s > 0 ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}` : '—',
    pace: (s) => s > 0 ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}/km` : '—',
    duration: (m) => m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${Math.round(m)}min`,
    decimal: (n, d = 1) => n != null ? n.toFixed(d) : '—',
    percent: (n) => n != null ? `${Math.round(n)}%` : '—'
};

const parseTime = (str) => {
    if (!str) return 0;
    const p = str.toString().split(':');
    return p.length === 2 ? parseInt(p[0]) * 60 + parseInt(p[1]) : 0;
};

const math = {
    mean: (arr) => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0,
    sum: (arr) => arr.reduce((a, b) => a + b, 0),
    std: (arr) => {
        const m = math.mean(arr);
        return Math.sqrt(arr.reduce((s, v) => s + Math.pow(v - m, 2), 0) / arr.length);
    },
    clamp: (n, min, max) => Math.min(Math.max(n, min), max)
};

// ============================================
// HEART RATE ZONE ENGINE
// ============================================
const hrEngine = {
    // Classify a single HR value into a zone (1-5)
    classify: (hr) => {
        if (!hr || hr <= 0) return null;
        const pct = hr / CONFIG.maxHR;
        if (pct >= CONFIG.hrZones.z5.min) return 5;
        if (pct >= CONFIG.hrZones.z4.min) return 4;
        if (pct >= CONFIG.hrZones.z3.min) return 3;
        if (pct >= CONFIG.hrZones.z2.min) return 2;
        return 1;
    },
    
    // Get zone config for a zone number
    zone: (n) => CONFIG.hrZones[`z${n}`] || CONFIG.hrZones.z1,
    
    // Get HR range for a zone number
    range: (n) => {
        const z = CONFIG.hrZones[`z${n}`];
        return z ? [Math.round(z.min * CONFIG.maxHR), Math.round(z.max * CONFIG.maxHR)] : [0, 0];
    },
    
    // Classify a workout by Avg HR and type
    classifyWorkout: (workout) => {
        const type = (workout['Workout Type'] || '').toLowerCase();
        const avgHR = parseFloat(workout['Avg HR']) || 0;
        const dur = parseFloat(workout['Duration (min)']) || 0;
        const maxHR = parseFloat(workout['Max HR']) || 0;
        
        // Skip walks and very short sessions
        if (type.includes('walk') && dur < 25) return { zone: 1, category: 'walk' };
        if (dur < 3) return { zone: 1, category: 'micro' };
        
        // Strength sessions — BUT check if it's actually a high-intensity cardio session
        // recorded as "Functional Strength" (e.g. HYROX sim, CrossFit-style WOD)
        // True strength: moderate avg HR, big max-avg spread (spikes on sets, drops on rest)
        // Cardio disguised as strength: high sustained avg HR (>145), long duration (>20min)
        if (type.includes('strength') || type.includes('functional') || type.includes('traditional')) {
            const isHighIntensityCardio = avgHR > 145 && dur > 20;
            const isModerateSustained = avgHR > 135 && dur > 40 && maxHR > 0 && (avgHR / maxHR) > 0.85;
            
            if (isHighIntensityCardio || isModerateSustained) {
                // This is really a cardio/HYROX session recorded as functional strength
                const zone = hrEngine.classify(avgHR);
                return { zone, category: 'cardio', avgHR, reclassified: true };
            }
            return { zone: 'str', category: 'strength', avgHR };
        }
        
        // Cardio — classify by HR
        if (avgHR > 0) {
            const zone = hrEngine.classify(avgHR);
            return { zone, category: 'cardio', avgHR };
        }
        
        // No HR — estimate from type
        if (type.includes('stair') || type.includes('stepper') || type.includes('elliptical')) return { zone: 2, category: 'cardio', estimated: true };
        if (type.includes('run') || type.includes('jog')) return { zone: 3, category: 'cardio', estimated: true };
        if (type.includes('row')) return { zone: 3, category: 'cardio', estimated: true };
        if (type.includes('cross')) return { zone: 3, category: 'cardio', estimated: true };
        return { zone: 2, category: 'other', estimated: true };
    },
    
    // Compute TRIMP (Training Impulse) for a workout
    // Banister TRIMP = duration × ΔHR × 0.64e^(1.92×ΔHR) where ΔHR = (avgHR - restHR) / (maxHR - restHR)
    trimp: (workout, restHR) => {
        const dur = parseFloat(workout['Duration (min)']) || 0;
        const avgHR = parseFloat(workout['Avg HR']) || 0;
        const rhr = restHR || CONFIG.baselines?.restingHR || 55;
        if (dur <= 0) return 0;
        if (avgHR <= 0) return dur * 0.4; // No HR: assume light effort
        
        // Banister TRIMP (male formula: b = 1.92)
        const deltaHR = (avgHR - rhr) / (CONFIG.maxHR - rhr);
        const clampedDelta = Math.max(0, Math.min(1, deltaHR));
        return dur * clampedDelta * 0.64 * Math.exp(1.92 * clampedDelta);
    },
    
    // Compute weekly zone distribution from an array of workouts
    // Uses Max HR vs Avg HR spread to estimate zone time within interval sessions
    weeklyZones: (workouts) => {
        const zones = { z1: 0, z2: 0, z3: 0, z4: 0, z5: 0, str: 0 };
        const details = [];
        
        workouts.forEach(w => {
            const dur = parseFloat(w['Duration (min)']) || 0;
            if (dur <= 0) return;
            
            // ═══ PRIORITY 1: Manual zone data from sheet ═══
            const z1m = parseFloat(w['Z1 min']) || 0;
            const z2m = parseFloat(w['Z2 min']) || 0;
            const z3m = parseFloat(w['Z3 min']) || 0;
            const z4m = parseFloat(w['Z4 min']) || 0;
            const z5m = parseFloat(w['Z5 min']) || 0;
            const hasManualZones = (z1m + z2m + z3m + z4m + z5m) > 0;
            
            if (hasManualZones) {
                zones.z1 += z1m; zones.z2 += z2m; zones.z3 += z3m; zones.z4 += z4m; zones.z5 += z5m;
                // Any remaining time goes to strength bucket
                const zoneTotal = z1m + z2m + z3m + z4m + z5m;
                if (dur - zoneTotal > 2) zones.str += (dur - zoneTotal);
                const primaryZone = z5m > 0 ? 5 : z4m > 0 ? 4 : z3m > 0 ? 3 : z2m > 0 ? 2 : 1;
                details.push({ zone: primaryZone, category: 'manual', dur, type: w['Workout Type'], date: w['Date'], manual: true });
                return;
            }
            
            // ═══ PRIORITY 2: Classification + estimation ═══
            const classified = hrEngine.classifyWorkout(w);
            if (classified.zone === 'str') {
                zones.str += dur;
                details.push({ ...classified, dur, type: w['Workout Type'], date: w['Date'] });
                return;
            }
            
            // Enhanced zone estimation: if we have both Max and Avg HR, estimate zone split
            const avgHR = parseFloat(w['Avg HR']) || 0;
            const maxHR = parseFloat(w['Max HR']) || 0;
            const spread = maxHR - avgHR;
            
            if (avgHR > 0 && maxHR > 0 && spread > 15 && dur > 10) {
                // Interval-like session: spread > 15bpm means variable intensity
                const workHR = Math.round((maxHR + avgHR) / 2);
                const restHR = Math.max(90, Math.round(2 * avgHR - maxHR));
                const workFraction = Math.min(0.7, Math.max(0.2, (avgHR - restHR) / (maxHR - restHR)));
                
                const workZone = hrEngine.classify(workHR);
                const restZone = hrEngine.classify(restHR);
                
                const workMins = dur * workFraction;
                const restMins = dur * (1 - workFraction);
                
                if (workZone >= 1 && workZone <= 5) zones[`z${workZone}`] += workMins;
                if (restZone >= 1 && restZone <= 5) zones[`z${restZone}`] += restMins;
                
                details.push({ ...classified, dur, type: w['Workout Type'], date: w['Date'], 
                    estimated_split: true, workZone, restZone, workFraction: Math.round(workFraction * 100) });
            } else if (classified.zone >= 1 && classified.zone <= 5) {
                // Steady-state session or no Max HR data: assign all time to avg zone
                zones[`z${classified.zone}`] += dur;
                details.push({ ...classified, dur, type: w['Workout Type'], date: w['Date'] });
            }
        });
        
        const totalCardio = zones.z1 + zones.z2 + zones.z3 + zones.z4 + zones.z5;
        const easyMins = zones.z1 + zones.z2;
        const tempoMins = zones.z3;
        const hardMins = zones.z4 + zones.z5;
        
        return {
            zones,
            totalCardio,
            totalAll: totalCardio + zones.str,
            easy: { mins: easyMins, pct: totalCardio > 0 ? easyMins / totalCardio * 100 : 0 },
            tempo: { mins: tempoMins, pct: totalCardio > 0 ? tempoMins / totalCardio * 100 : 0 },
            hard: { mins: hardMins, pct: totalCardio > 0 ? hardMins / totalCardio * 100 : 0 },
            isPolarized: totalCardio > 0 && (easyMins / totalCardio * 100) >= 70,
            details
        };
    },
    
    // Get HR targets for today's planned session
    sessionTargets: (sessionType) => {
        const t = sessionType.toLowerCase();
        if (t.includes('z2') || t.includes('easy') || t.includes('long')) {
            return t.includes('stepper') || t.includes('stair') ? CONFIG.sessionHR.z2Stepper : CONFIG.sessionHR.z2Run;
        }
        if (t.includes('threshold') || t.includes('tempo')) return CONFIG.sessionHR.threshold;
        if (t.includes('vo₂') || t.includes('vo2') || t.includes('interval')) return CONFIG.sessionHR.vo2max;
        if (t.includes('compromised')) return CONFIG.sessionHR.compromised;
        if (t.includes('strength')) return CONFIG.sessionHR.strength;
        return null;
    },
    
    // Compute Acute:Chronic Training Load ratio (fatigue vs fitness)
    // Acute = 7-day TRIMP avg, Chronic = 28-day TRIMP avg (or actual days available)
    acwr: (workouts, restHR) => {
        const today = new Date();
        const cutoff7 = new Date(today.getTime() - 7 * 86400000);
        const cutoff28 = new Date(today.getTime() - 28 * 86400000);
        
        const acute7 = workouts
            .filter(w => new Date(w['Date']) >= cutoff7)
            .reduce((s, w) => s + hrEngine.trimp(w, restHR), 0) / 7;
        
        // For chronic: use actual days of data available (min 14 days for meaningful ratio)
        const chronic28Workouts = workouts.filter(w => new Date(w['Date']) >= cutoff28);
        const chronicTrimp = chronic28Workouts.reduce((s, w) => s + hrEngine.trimp(w, restHR), 0);
        // Count actual calendar days spanned by the data
        const allDates = workouts.map(w => w['Date']).filter(Boolean);
        const earliest = allDates.length > 0 ? new Date(allDates.sort()[0]) : today;
        const daysOfData = Math.min(28, Math.max(7, Math.ceil((today - earliest) / 86400000)));
        const chronic28 = chronicTrimp / daysOfData;
        
        const ratio = chronic28 > 0 ? acute7 / chronic28 : 1;
        let status = 'optimal';
        if (ratio > 1.5) status = 'danger';      // Injury risk
        else if (ratio > 1.3) status = 'overreach'; // Hard week
        else if (ratio < 0.7) status = 'detraining'; // Too easy
        
        return { acute: acute7, chronic: chronic28, ratio, status };
    },
    
    // Cardiac drift detection: compare first vs second half of long Z2 sessions
    // If HR drifts >5% at same pace, aerobic base needs work
    driftCheck: (recentWorkouts) => {
        // We only have avg HR per session, not split data
        // But we can compare Z2 session avg HR over time to detect improvement
        const z2Sessions = recentWorkouts
            .filter(w => {
                const c = hrEngine.classifyWorkout(w);
                return c.zone === 2 && c.category === 'cardio' && !c.estimated;
            })
            .sort((a, b) => new Date(a['Date']) - new Date(b['Date']));
        
        if (z2Sessions.length < 4) return null;
        
        const recent = z2Sessions.slice(-4);
        const older = z2Sessions.slice(0, Math.min(4, z2Sessions.length - 4));
        
        if (older.length === 0) return null;
        
        const recentAvgHR = math.mean(recent.map(w => parseFloat(w['Avg HR'])));
        const olderAvgHR = math.mean(older.map(w => parseFloat(w['Avg HR'])));
        const drift = ((recentAvgHR - olderAvgHR) / olderAvgHR) * 100;
        
        return {
            recentAvgHR: Math.round(recentAvgHR),
            olderAvgHR: Math.round(olderAvgHR),
            drift: drift.toFixed(1),
            improving: drift < -2,  // Lower HR at same effort = fitter
            concern: drift > 5      // Rising HR = fatigue or detraining
        };
    },
    
    // ═══ PACE:HR COUPLING (Aerobic Decoupling) ═══
    // Compare pace vs HR across running sessions to track aerobic efficiency
    // Lower HR at same pace = fitter. Rising HR at same pace = fatigued or detrained.
    paceHRCoupling: (workouts) => {
        const runs = workouts
            .filter(w => {
                const type = (w['Workout Type'] || '').toLowerCase();
                const dist = parseFloat(w['Distance (km)']) || 0;
                const hr = parseFloat(w['Avg HR']) || 0;
                const dur = parseFloat(w['Duration (min)']) || 0;
                // Only include easy/moderate running sessions (Z2-Z3, HR < 155) to compare like with like
                // Exclude short intervals and threshold sessions for meaningful aerobic efficiency tracking
                return (type.includes('run') || type.includes('jog')) && dist > 3 && hr > 100 && hr < 155 && dur > 20;
            })
            .map(w => ({
                date: w['Date'],
                pace: (parseFloat(w['Duration (min)']) || 0) / (parseFloat(w['Distance (km)']) || 1), // min/km
                hr: parseFloat(w['Avg HR']),
                dist: parseFloat(w['Distance (km)']),
                type: w['Workout Type']
            }))
            .sort((a, b) => new Date(a.date) - new Date(b.date));
        
        if (runs.length < 3) return null;
        
        // Efficiency index: pace / HR (lower = better: faster pace at lower HR)
        // Normalize to bpm per min/km
        const efficiencies = runs.map(r => ({
            ...r,
            efficiency: r.hr / r.pace, // bpm per min/km — lower is better for Z2
            hrPerKm: r.hr * r.pace      // HR × pace product — lower is more efficient
        }));
        
        // Recent vs older comparison
        const recentN = Math.min(3, Math.floor(runs.length / 2));
        const recent = efficiencies.slice(-recentN);
        const older = efficiencies.slice(0, recentN);
        
        const recentAvgEff = math.mean(recent.map(r => r.hrPerKm));
        const olderAvgEff = math.mean(older.map(r => r.hrPerKm));
        const change = olderAvgEff > 0 ? ((recentAvgEff - olderAvgEff) / olderAvgEff) * 100 : 0;
        
        return {
            runs: efficiencies,
            recentAvg: { pace: math.mean(recent.map(r => r.pace)), hr: Math.round(math.mean(recent.map(r => r.hr))) },
            olderAvg: { pace: math.mean(older.map(r => r.pace)), hr: Math.round(math.mean(older.map(r => r.hr))) },
            change: change.toFixed(1),
            improving: change < -3, // Lower HR×pace product = more efficient
            concern: change > 5
        };
    },
    
    // ═══ WEEKLY ZONE TREND (last 4 weeks) ═══
    // Track polarization compliance over time
    weeklyZoneTrend: (workouts) => {
        const now = new Date();
        const weeks = [];
        for (let w = 0; w < 4; w++) {
            const wStart = new Date(now.getTime() - (w + 1) * 7 * 86400000);
            const wEnd = new Date(now.getTime() - w * 7 * 86400000);
            const wWorkouts = workouts.filter(wo => {
                const d = new Date(wo['Date']);
                return d >= wStart && d < wEnd;
            });
            const zones = hrEngine.weeklyZones(wWorkouts);
            weeks.unshift({
                label: w === 0 ? 'This wk' : w === 1 ? 'Last wk' : `${w}wk ago`,
                ...zones,
                trimp: wWorkouts.reduce((s, wo) => s + hrEngine.trimp(wo), 0)
            });
        }
        return weeks;
    },
    
    // ═══ SESSION RECOMMENDATION based on readiness + training history ═══
    // Uses HRV, RHR, sleep, and recent training load to suggest intensity
    sessionRecommendation: (readinessScore, acwr, yesterdayZone) => {
        // Primary signal: readiness score (which already integrates HRV, RHR, sleep, training load)
        // Secondary signal: ACWR and yesterday's training for additional context
        // The recommendation should NEVER contradict the readiness message
        
        // High readiness (75+) = body is ready, follow your plan
        if (readinessScore >= 80) {
            if (yesterdayZone === 'str' || yesterdayZone === 1 || !yesterdayZone) {
                return { intensity: 'high', msg: 'Body is primed. Great day for threshold or VO₂max work.', color: 'red' };
            }
            return { intensity: 'moderate-high', msg: 'Good readiness. Follow your plan — can handle intensity today.', color: 'blue' };
        }
        
        if (readinessScore >= 70) {
            // Good readiness — only flag if ACWR is genuinely extreme (>1.5)
            if (acwr && acwr.ratio > 1.5) {
                return { intensity: 'moderate', msg: 'Readiness is good but training load has been high. Follow plan but monitor fatigue.', color: 'blue' };
            }
            return { intensity: 'train as planned', msg: 'Good recovery. Follow your plan today.', color: 'blue' };
        }
        
        if (readinessScore >= 60) {
            return { intensity: 'easy', msg: 'Below baseline readiness. Z2 aerobic or light strength — save intensity for a better day.', color: 'green' };
        }
        
        // Low readiness (<60) = recovery regardless of plan
        return { intensity: 'recovery', msg: 'Recovery recommended. Walk, mobility, or complete rest. Your body needs it.', color: 'green' };
    },
    
    // ═══ HR RECOVERY QUALITY ═══
    // Compare Max HR vs Avg HR — bigger gap in strength = good recovery between sets
    // Closer Max/Avg in cardio = more sustained effort
    recoveryQuality: (workout) => {
        const maxHR = parseFloat(workout['Max HR']) || 0;
        const avgHR = parseFloat(workout['Avg HR']) || 0;
        if (maxHR <= 0 || avgHR <= 0) return null;
        
        const spread = maxHR - avgHR;
        const ratio = avgHR / maxHR;
        
        return {
            spread,
            ratio: ratio.toFixed(2),
            // For cardio: ratio > 0.9 = very sustained, 0.8-0.9 = intervals, < 0.8 = varied
            // For strength: ratio < 0.8 is normal (spikes on sets, drops on rest)
            sustained: ratio > 0.88,
            interval: ratio >= 0.78 && ratio <= 0.88
        };
    }
};

// ============================================
// DATA FETCHING
// ============================================
const fetchSheet = async (sheetId, tabName) => {
    try {
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tabName)}`;
        const res = await fetch(url);
        const txt = await res.text();
        const json = JSON.parse(txt.substring(47).slice(0, -2));
        const headers = json.table.cols.map(c => c.label || '');
        
        let rawData = json.table.rows?.map(row => {
            const obj = {};
            row.c?.forEach((cell, i) => {
                if (headers[i]) {
                    if (headers[i] === 'Date' || headers[i] === 'Start' || headers[i] === 'Date/Time') {
                        // Google gviz returns dates as "Date(2026,1,24)" in v, formatted string in f
                        // Note: gviz months are 0-indexed (0=Jan, 1=Feb, etc.)
                        const v = cell?.v;
                        const f = cell?.f;
                        if (typeof v === 'string' && v.startsWith('Date(')) {
                            const m = v.match(/Date\((\d+),(\d+),(\d+)/);
                            if (m) {
                                // Build ISO date string directly to avoid timezone issues
                                const year = m[1];
                                const month = String(parseInt(m[2]) + 1).padStart(2, '0'); // gviz months are 0-indexed
                                const day = String(m[3]).padStart(2, '0');
                                obj[headers[i]] = `${year}-${month}-${day}`;
                            } else {
                                obj[headers[i]] = f || v || null;
                            }
                        } else if (f) {
                            // Try to extract just the date part (could be "2026-02-24 7:57")
                            const dateOnly = f.split(' ')[0];
                            const iso = dateOnly.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
                            const slash = dateOnly.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
                            if (iso) {
                                obj[headers[i]] = `${iso[1]}-${String(iso[2]).padStart(2,'0')}-${String(iso[3]).padStart(2,'0')}`;
                            } else if (slash) {
                                const a = parseInt(slash[1]), b = parseInt(slash[2]), y = parseInt(slash[3]);
                                // Assume DD/MM/YYYY for European locale
                                obj[headers[i]] = a > 12 ? `${y}-${String(b).padStart(2,'0')}-${String(a).padStart(2,'0')}` :
                                    b > 12 ? `${y}-${String(a).padStart(2,'0')}-${String(b).padStart(2,'0')}` :
                                    `${y}-${String(b).padStart(2,'0')}-${String(a).padStart(2,'0')}`;
                            } else {
                                obj[headers[i]] = f;
                            }
                        } else {
                            obj[headers[i]] = v || null;
                        }
                    } else {
                        // gviz returns time/duration values as "Date(1899,11,30,H,M,S)" in cell.v
                        // For these, prefer cell.f (formatted string like "0:50:05") which our parsers handle
                        const cv = cell?.v;
                        const cf = cell?.f;
                        if (typeof cv === 'string' && cv.startsWith('Date(')) {
                            // Extract H,M,S from Date(1899,11,30,H,M,S) for time/duration fields
                            const tm = cv.match(/Date\(\d+,\d+,\d+,(\d+),(\d+),(\d+)\)/);
                            if (tm) {
                                obj[headers[i]] = `${tm[1]}:${String(tm[2]).padStart(2,'0')}:${String(tm[3]).padStart(2,'0')}`;
                            } else {
                                obj[headers[i]] = cf || cv || null;
                            }
                        } else {
                            obj[headers[i]] = cv ?? cf ?? null;
                        }
                    }
                }
            });
            return obj;
        }).filter(o => o['Date'] || o['Start'] || o['Date/Time']) || [];
        
        // ═══ MAP Health Auto Export workout columns to app format ═══
        if (headers.includes('Type') && headers.includes('Start') && !headers.includes('Workout Type')) {
            rawData = rawData.map(w => {
                // Duration: gviz returns time values as fraction of a day (0.03478 = 50min)
                // OR as formatted string "0:50:05" — handle both
                let durMin = 0;
                const durRaw = w['Duration'];
                if (durRaw != null) {
                    const durStr = durRaw.toString();
                    const parts = durStr.split(':');
                    if (parts.length === 3) {
                        // "H:MM:SS" format
                        durMin = parseInt(parts[0]) * 60 + parseInt(parts[1]) + parseInt(parts[2]) / 60;
                    } else if (parts.length === 2) {
                        // "H:MM" format
                        durMin = parseInt(parts[0]) * 60 + parseInt(parts[1]);
                    } else {
                        const num = parseFloat(durStr) || 0;
                        if (num > 0 && num < 1) {
                            // Fraction of a day from gviz (0.03478 = ~50 min)
                            durMin = num * 24 * 60;
                        } else if (num > 1 && num < 10) {
                            // Likely hours as decimal (1.5 = 90 min)
                            durMin = num * 60;
                        } else {
                            // Already in minutes or unknown
                            durMin = num;
                        }
                    }
                }
                
                // Energy: kJ → kcal (÷ 4.184)
                const kj = parseFloat(w['Active Energy (kJ)']) || 0;
                const cal = Math.round(kj / 4.184);
                
                return {
                    'Date': w['Start'] || w['Date'],
                    'Workout Type': w['Type'] || '',
                    'Duration (min)': durMin.toFixed(1),
                    'Distance (km)': w['Distance (km)'] || 0,
                    'Avg HR': w['Avg Heart Rate (bpm)'] || 0,
                    'Max HR': w['Max Heart Rate (bpm)'] || 0,
                    'Calories': cal,
                    'Avg Pace (sec/km)': (w['Avg Speed (km/hr)'] && parseFloat(w['Avg Speed (km/hr)']) > 0) 
                        ? Math.round(3600 / parseFloat(w['Avg Speed (km/hr)'])) : 0,
                    'Flights Climbed': w['Flights Climbed (count)'] || 0,
                    'Step Count': w['Step Count (count)'] || 0,
                    // Manual zone data columns (added by user after workouts)
                    'Z1 min': w['Z1 min'] || '',
                    'Z2 min': w['Z2 min'] || '',
                    'Z3 min': w['Z3 min'] || '',
                    'Z4 min': w['Z4 min'] || '',
                    'Z5 min': w['Z5 min'] || '',
                    '_raw': w // Keep original data accessible
                };
            });
            console.log(`[Workouts] Mapped ${rawData.length} Health Auto Export rows`);
        }
        
        // ═══ MAP Health Auto Export daily metrics columns to app format ═══
        if (headers.includes('Date/Time') && headers.includes('Resting Heart Rate (count/min)')) {
            rawData = rawData.map(row => ({
                'Date': row['Date/Time'] || row['Date'],
                'Resting HR': row['Resting Heart Rate (count/min)'] || '',
                'HRV (ms)': row['Heart Rate Variability (ms)'] || '',
                'Sleep Duration (hr)': row['Sleep Analysis [Asleep] (hr)'] || row['Sleep Analysis [Total] (hr)'] || '',
                'Deep Sleep (hr)': row['Sleep Analysis [Deep] (hr)'] || '',
                'REM Sleep (hr)': row['Sleep Analysis [REM] (hr)'] || '',
                'VO2 Max': row['VO2 Max (ml/(kg·min))'] || '',
                'Avg HR': row['Heart Rate [Avg] (count/min)'] || '',
                'Step Count': row['Step Count (count)'] || '',
                'Walking Distance (km)': row['Walking + Running Distance (km)'] || '',
                'Respiratory Rate': row['Respiratory Rate (count/min)'] || '',
                '_raw': row
            }));
            console.log(`[Metrics] Mapped ${rawData.length} Health Auto Export rows`);
        }
        
        // Aggregate rows by date — Health Auto Export may have multiple rows per day
        const isDailyMetrics = tabName.startsWith(CONFIG.dataSources.daily.tabPattern);
        if (isDailyMetrics) {
            const byDate = {};
            rawData.forEach(row => {
                const d = row['Date'];
                if (!d) return;
                if (!byDate[d]) byDate[d] = { Date: d };
                const mappedKeys = Object.keys(row).filter(k => k !== 'Date' && k !== '_raw');
                mappedKeys.forEach(h => {
                    const val = parseFloat(row[h]);
                    if (!isNaN(val) && val > 0) {
                        if (h === 'Step Count') {
                            byDate[d][h] = (byDate[d][h] || 0) + val;
                        } else {
                            byDate[d][h] = val;
                        }
                    }
                });
            });
            
            // Sanity-check sleep values — Health Auto Export sends varied units
            Object.values(byDate).forEach(row => {
                let sleep = parseFloat(row['Sleep Duration (hr)']);
                if (!sleep || sleep <= 0) { row['Sleep Duration (hr)'] = ''; return; }
                
                // >960 = probably seconds (e.g. 25200s = 7hr)
                if (sleep > 960) sleep = sleep / 3600;
                // >16 = probably minutes (e.g. 420min = 7hr)
                else if (sleep > 16) sleep = sleep / 60;
                
                // <3h = nap or garbage, discard as not a real night
                row['Sleep Duration (hr)'] = sleep >= 3 ? sleep.toFixed(2) : '';
                
                // Deep sleep + REM
                const deep = parseFloat(row['Deep Sleep (hr)']);
                if (deep > 0) row['Deep Sleep (hr)'] = deep > 960 ? (deep/3600).toFixed(2) : deep > 8 ? (deep > 480 ? '' : (deep/60).toFixed(2)) : deep.toFixed(2);
                const rem = parseFloat(row['REM Sleep (hr)']);
                if (rem > 0) row['REM Sleep (hr)'] = rem > 960 ? (rem/3600).toFixed(2) : rem > 8 ? (rem > 480 ? '' : (rem/60).toFixed(2)) : rem.toFixed(2);
            });
            
            const merged = Object.values(byDate);
            console.log(`[${tabName}] Loaded ${rawData.length} raw rows → merged to ${merged.length} days`);
            return merged;
        }
        
        console.log(`[${tabName}] Loaded ${rawData.length} rows`);
        
        // Clean up workout durations — Health Auto Export sometimes sends seconds instead of minutes
        if (tabName === CONFIG.dataSources.workouts.tab) {
            rawData.forEach(w => {
                let dur = parseFloat(w['Duration (min)']) || 0;
                const dist = parseFloat(w['Distance (km)']) || 0;
                
                if (dur <= 0) return;
                
                // Method 1: If we have distance, check if pace is impossible (>30 min/km means dur is in seconds)
                if (dist > 0) {
                    const paceMinPerKm = dur / dist;
                    if (paceMinPerKm > 30) {
                        dur = dur / 60;
                        w['Duration (min)'] = dur.toFixed(1);
                    }
                }
                
                // Method 2: No distance — use calorie rate as sanity check
                // A reasonable workout burns 5-20 cal/min. If cal/min < 1.5, dur is likely in seconds
                const cal = parseFloat(w['Calories']) || 0;
                if (cal > 0 && dur > 60) {
                    const calPerMin = cal / dur;
                    if (calPerMin < 1.5) {
                        dur = dur / 60;
                        w['Duration (min)'] = dur.toFixed(1);
                    }
                }
                
                // Method 3: Hard cap — no single workout should exceed 180 min (3 hours)
                // If it does and wasn't caught above, it's almost certainly in seconds
                dur = parseFloat(w['Duration (min)']) || 0;
                if (dur > 180) {
                    w['Duration (min)'] = (dur / 60).toFixed(1);
                }
            });
            
            // Deduplicate workouts client-side (date + type + similar duration)
            const seen = new Set();
            rawData = rawData.filter(w => {
                const dur = Math.round(parseFloat(w['Duration (min)']) || 0);
                const key = `${w['Date']}|${w['Workout Type']}|${dur}`;
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });
            
            console.log(`[Workouts] After cleanup: ${rawData.length} workouts`);
        }
        
        return rawData;
    } catch (e) {
        console.error(`[${tabName}] Error:`, e);
        return [];
    }
};

// ============================================
// INSIGHT ENGINE
// ============================================
const InsightEngine = {
    // Calculate Readiness Score (0-100) — Oura/WHOOP-inspired
    readiness: (data) => {
        const { restingHR, hrv, sleep, hrAvg7, hrvAvg7, 
                hrvAvg14, hrvBaseline60, hrvTrend3d, 
                trimpYesterday, trimpAvg7 } = data;
        
        // Track which components have real data
        const hasHR = restingHR != null && restingHR > 0;
        const hasHRV = hrv != null && hrv > 0;
        const hasSleep = sleep != null && sleep > 0.5;
        const hasHRVBalance = hrvAvg14 > 0 && hrvBaseline60 > 0;
        
        // ═══════════════════════════════════════
        // HR Component (0-25) — lower is better vs 7-day avg
        // ═══════════════════════════════════════
        let hrScore = 12, hrStatus = 'no data', hrDiff = 0;
        if (hasHR && hrAvg7 > 0) {
            hrDiff = ((restingHR - hrAvg7) / hrAvg7) * 100;
            hrScore = hrDiff <= -3 ? 25 : hrDiff <= 0 ? 22 : hrDiff <= 3 ? 18 : hrDiff <= 6 ? 12 : 6;
            hrStatus = hrDiff <= 0 ? 'optimal' : hrDiff <= 3 ? 'normal' : hrDiff <= 6 ? 'elevated' : 'high';
        }
        
        // ═══════════════════════════════════════
        // HRV Component (0-30) — Oura-style HRV Balance
        // Compares 14-day weighted avg to 60-day baseline
        // Only flags "depleted" if trend declining 3+ days
        // ═══════════════════════════════════════
        let hrvScore = 15, hrvStatus = 'no data', hrvBalancePct = 0;
        if (hasHRVBalance) {
            // HRV Balance: how does recent (14d weighted) compare to baseline (60d)?
            hrvBalancePct = ((hrvAvg14 - hrvBaseline60) / hrvBaseline60) * 100;
            
            // Trend matters: is HRV declining over last 3 days?
            const isTrendingDown = hrvTrend3d < -5; // 3-day slope negative >5%
            
            if (hrvBalancePct >= 5) {
                hrvScore = 30;
                hrvStatus = 'strong';
            } else if (hrvBalancePct >= -5) {
                hrvScore = isTrendingDown ? 20 : 25;
                hrvStatus = isTrendingDown ? 'declining' : 'normal';
            } else if (hrvBalancePct >= -15) {
                hrvScore = isTrendingDown ? 12 : 16;
                hrvStatus = isTrendingDown ? 'low' : 'below avg';
            } else {
                hrvScore = isTrendingDown ? 6 : 10;
                hrvStatus = 'depleted';
            }
        } else if (hasHRV && hrvAvg7 > 0) {
            // Fallback: simple comparison to 7-day avg (less than 14 days of data)
            hrvBalancePct = ((hrv - hrvAvg7) / hrvAvg7) * 100;
            hrvScore = hrvBalancePct >= 5 ? 28 : hrvBalancePct >= -5 ? 22 : hrvBalancePct >= -15 ? 14 : 8;
            hrvStatus = hrvBalancePct >= 5 ? 'strong' : hrvBalancePct >= -5 ? 'normal' : hrvBalancePct >= -15 ? 'low' : 'depleted';
        }
        
        // ═══════════════════════════════════════
        // Sleep Component (0-25)
        // ═══════════════════════════════════════
        let sleepScore = 12, sleepStatus = 'no data';
        if (hasSleep) {
            sleepScore = sleep >= 8 ? 25 : sleep >= 7 ? 22 : sleep >= 6 ? 16 : sleep >= 5 ? 10 : 5;
            sleepStatus = sleep >= 7.5 ? 'optimal' : sleep >= 6.5 ? 'good' : sleep >= 5.5 ? 'fair' : 'poor';
        }
        
        // ═══════════════════════════════════════
        // Training Load (0-20) — TRIMP-based
        // TRIMP = Duration × (Avg HR / Max HR)
        // Compare yesterday's TRIMP to 7-day rolling avg
        // ═══════════════════════════════════════
        let loadScore = 10, loadRatio = 1, loadStatus = 'no data';
        if (trimpAvg7 > 0) {
            loadRatio = trimpYesterday / trimpAvg7;
            if (loadRatio <= 0.3) {
                loadScore = 18; loadStatus = 'rest day';
            } else if (loadRatio <= 0.8) {
                loadScore = 20; loadStatus = 'light';
            } else if (loadRatio <= 1.2) {
                loadScore = 16; loadStatus = 'normal';
            } else if (loadRatio <= 1.5) {
                loadScore = 12; loadStatus = 'moderate';
            } else if (loadRatio <= 2.0) {
                loadScore = 8; loadStatus = 'heavy';
            } else {
                loadScore = 4; loadStatus = 'overreaching';
            }
        } else if (trimpYesterday === 0) {
            loadScore = 18; loadStatus = 'rest day';
        }
        
        const total = hrScore + hrvScore + sleepScore + loadScore;
        
        const getMessage = (score) => {
            if (score >= 85) return { text: "You're primed. Great day for intensity.", status: 'peak' };
            if (score >= 70) return { text: "Good recovery. Train as planned.", status: 'good' };
            if (score >= 55) return { text: "Moderate recovery. Listen to your body.", status: 'moderate' };
            if (score >= 40) return { text: "Recovery incomplete. Consider going easy.", status: 'low' };
            return { text: "Rest recommended. Your body needs recovery.", status: 'rest' };
        };
        
        return {
            score: total,
            message: getMessage(total),
            components: {
                hr: { score: hrScore, max: 25, value: restingHR, avg: hrAvg7, diff: hrDiff, status: hrStatus },
                hrv: { score: hrvScore, max: 30, value: hrv, avg14: hrvAvg14, baseline60: hrvBaseline60, balance: hrvBalancePct, trend3d: hrvTrend3d, status: hrvStatus },
                sleep: { score: sleepScore, max: 25, value: sleep, status: sleepStatus },
                load: { score: loadScore, max: 20, ratio: loadRatio, trimp: trimpYesterday, avg: trimpAvg7, status: loadStatus }
            }
        };
    },
    
    // Calculate Aerobic Score
    aerobic: (data) => {
        const { vo2max, weeklyKm, weeklyMins, vo2History, volHistory } = data;
        
        // VO2max progress (0-50)
        const vo2Progress = ((vo2max - CONFIG.baselines.vo2max) / (CONFIG.targets.vo2max - CONFIG.baselines.vo2max)) * 50;
        const vo2Score = math.clamp(vo2Progress, 0, 50);
        
        // Volume progress (0-30)
        const volProgress = (weeklyKm / CONFIG.targets.weeklyKm) * 30;
        const volScore = math.clamp(volProgress, 0, 30);
        
        // Consistency (0-20) - based on training days
        const consistencyScore = weeklyMins > 0 ? 20 : 5;
        
        const total = Math.round(vo2Score + volScore + consistencyScore);
        
        // Trend calculation
        const vo2Trend = vo2History.length >= 4
            ? vo2History[vo2History.length - 1] - vo2History[Math.max(0, vo2History.length - 5)]
            : 0;
        
        // Time to target
        const weeklyGain = vo2Trend / 4;
        const weeksToTarget = weeklyGain > 0 ? Math.round((CONFIG.targets.vo2max - vo2max) / weeklyGain) : null;
        
        return {
            score: total,
            vo2max,
            weeklyKm,
            weeklyMins,
            vo2Trend,
            trend: vo2Trend > 0.3 ? 'improving' : vo2Trend < -0.3 ? 'declining' : 'stable',
            weeksToTarget,
            insight: vo2Trend > 0 
                ? { title: 'Engine growing', text: `VO₂max up ${vo2Trend.toFixed(1)} recently`, color: 'green' }
                : vo2Trend < -0.3
                ? { title: 'VO₂max declining', text: 'May need more aerobic work', color: 'orange' }
                : { title: 'Holding steady', text: 'Consistent base maintenance', color: 'blue' }
        };
    },
    
    // Predict Race Time
    racePrediction: (data) => {
        const { twoKm, threshold, weeklyKm, paceDecay, vo2max } = data;
        
        // Base from threshold or estimate
        const effectiveThreshold = threshold || (twoKm ? twoKm / 2 * 1.12 : CONFIG.baselines.threshold);
        
        // Run time: 8km at threshold + 8% fatigue factor
        const racePace = effectiveThreshold * 1.08;
        const runTime = 8 * racePace;
        
        // Station time: base 30min, adjust for fitness
        const stationBase = 30 * 60;
        const vo2Adjust = (CONFIG.targets.vo2max - (vo2max || CONFIG.baselines.vo2max)) * 12;
        const stationTime = stationBase + vo2Adjust;
        
        // Adjustments
        const volumeBonus = Math.max(0, (weeklyKm - 25) * 2);
        const speedBonus = twoKm ? Math.max(0, (CONFIG.baselines.twoKm - twoKm) * 0.6) : 0;
        const fatiguePenalty = paceDecay ? Math.max(0, (paceDecay - 5) * 20) : 0;
        
        const predicted = Math.round(runTime + stationTime - volumeBonus - speedBonus + fatiguePenalty);
        const gap = predicted - CONFIG.targets.raceTime;
        
        // Confidence based on test data
        const tests = [twoKm, threshold, paceDecay].filter(Boolean).length;
        const confidence = tests >= 3 ? 'high' : tests >= 2 ? 'medium' : 'low';
        
        return {
            predicted,
            formatted: fmt.time(predicted),
            gap,
            confidence,
            breakdown: { runTime, stationTime, volumeBonus, speedBonus, fatiguePenalty },
            insight: gap <= 0
                ? { title: 'On track for 1:05!', text: 'Maintain consistency', color: 'green' }
                : gap <= 300
                ? { title: `${Math.round(gap / 60)} min to find`, text: 'You\'re close to target', color: 'blue' }
                : { title: 'Building toward goal', text: 'Focus on consistency', color: 'orange' }
        };
    },
    
    // HYROX Readiness (fatigue resistance)
    hyroxReady: (data) => {
        const { latestSim, simHistory } = data;
        
        if (!latestSim) {
            return {
                score: null,
                hasSim: false,
                insight: { title: 'No data yet', text: 'Log a mini-sim to track', color: 'blue' }
            };
        }
        
        const decay = parseFloat(latestSim.decay) || 0;
        const total = latestSim.total || 0;
        
        // Decay score (0-50) - lower is better
        const decayScore = decay <= 3 ? 50 : decay <= 5 ? 42 : decay <= 8 ? 30 : decay <= 12 ? 18 : 8;
        
        // Time score (0-50) - target ~25:40 (1540s)
        const timeScore = math.clamp(((1800 - total) / (1800 - 1400)) * 50, 0, 50);
        
        const score = Math.round(decayScore + timeScore);
        
        // Trend
        const trend = simHistory.length >= 2
            ? simHistory[simHistory.length - 1].total < simHistory[simHistory.length - 2].total ? 'improving' : 'stable'
            : 'stable';
        
        return {
            score,
            hasSim: true,
            total,
            decay,
            trend,
            latestSim,
            insight: decay > 8
                ? { title: 'Fatigue resistance is limiting', text: `${decay}% decay — target <5%`, color: 'orange' }
                : decay > 5
                ? { title: 'Room to improve', text: 'More running after strength work', color: 'blue' }
                : { title: 'Strong fatigue resistance', text: 'Pacing is solid', color: 'green' }
        };
    }
};

// Beautiful Line Chart with gradient fill
const LineChart = ({ data, color = 'var(--green)', height = 160 }) => {
    if (!data || data.length < 2) {
        return (
            <div style={{ height, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-tertiary)' }}>
                Not enough data yet
            </div>
        );
    }
    
    const values = data.filter(v => v != null && !isNaN(v));
    if (values.length < 2) return null;
    
    const min = Math.min(...values);
    const max = Math.max(...values);
    const range = max - min || 1;
    const padding = range * 0.1;
    const yMin = min - padding;
    const yMax = max + padding;
    const yRange = yMax - yMin;
    
    const width = 300;
    const h = height - 30;
    
    const points = values.map((v, i) => ({
        x: (i / (values.length - 1)) * width,
        y: h - ((v - yMin) / yRange) * h
    }));
    
    // Create smooth curve
    const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
    const areaD = pathD + ` L ${width} ${h} L 0 ${h} Z`;
    
    const gradientId = `grad-${Math.random().toString(36).substr(2, 9)}`;
    
    return (
        <div className="chart-container" style={{ height }}>
            <svg viewBox={`0 0 ${width} ${height}`} className="chart-svg" preserveAspectRatio="none">
                <defs>
                    <linearGradient id={gradientId} x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor={color} stopOpacity="0.4" />
                        <stop offset="100%" stopColor={color} stopOpacity="0" />
                    </linearGradient>
                </defs>
                
                {/* Grid lines */}
                {[0.25, 0.5, 0.75].map((p, i) => (
                    <line key={i} x1="0" y1={h * p} x2={width} y2={h * p} className="chart-grid-line" />
                ))}
                
                {/* Area fill */}
                <path d={areaD} fill={`url(#${gradientId})`} />
                
                {/* Line */}
                <path d={pathD} className="chart-line" stroke={color} />
                
                {/* Dots - show fewer for cleaner look */}
                {values.length <= 15 && points.map((p, i) => (
                    <circle key={i} cx={p.x} cy={p.y} r={i === points.length - 1 ? 5 : 3} 
                        fill={i === points.length - 1 ? color : 'var(--bg)'} 
                        stroke={color} className="chart-dot" />
                ))}
                
                {/* Y-axis labels */}
                <text x="4" y="14" className="chart-label">{max.toFixed(1)}</text>
                <text x="4" y={h - 4} className="chart-label">{min.toFixed(1)}</text>
            </svg>
        </div>
    );
};

// Progress Ring (Oura style)
const ProgressRing = ({ value, max = 100, size = 80, strokeWidth = 6, color = 'var(--green)' }) => {
    const radius = (size - strokeWidth) / 2;
    const circumference = 2 * Math.PI * radius;
    const progress = math.clamp(value / max, 0, 1);
    const offset = circumference - progress * circumference;
    
    return (
        <div className="ring-container" style={{ width: size, height: size }}>
            <svg width={size} height={size} className="ring-svg">
                <circle cx={size/2} cy={size/2} r={radius} strokeWidth={strokeWidth} className="ring-bg" />
                <circle 
                    cx={size/2} cy={size/2} r={radius} 
                    strokeWidth={strokeWidth} 
                    stroke={color}
                    strokeDasharray={circumference}
                    strokeDashoffset={offset}
                    className="ring-progress"
                />
            </svg>
            <div className="ring-value" style={{ color }}>{Math.round(value)}</div>
        </div>
    );
};

// Contributor Bar (Oura style)
const ContributorBar = ({ label, sublabel, value, max, score, maxScore, color = 'var(--green)', status }) => {
    const percent = maxScore > 0 ? (score / maxScore) * 100 : 0;
    
    return (
        <div className="contributor">
            <div className="contributor-header">
                <div>
                    <p className="data-label">{label}</p>
                    {sublabel && <p className="data-sublabel">{sublabel}</p>}
                </div>
                <div style={{ textAlign: 'right' }}>
                    <p className="data-value">{value}</p>
                    {status && (
                        <span className={`trend trend-${status === 'optimal' || status === 'strong' || status === 'good' || status === 'light' ? 'up' : status === 'normal' ? 'stable' : 'down'}`} 
                            style={{ fontSize: 11, padding: '2px 8px', marginTop: 4 }}>
                            {status}
                        </span>
                    )}
                </div>
            </div>
            <div className="contributor-bar">
                <div className="contributor-fill" style={{ width: `${percent}%`, background: color }} />
            </div>
        </div>
    );
};

// Data Row
const DataRow = ({ label, sublabel, value, trend }) => (
    <div className="data-row">
        <div>
            <p className="data-label">{label}</p>
            {sublabel && <p className="data-sublabel">{sublabel}</p>}
        </div>
        <div style={{ textAlign: 'right' }}>
            <p className="data-value">{value}</p>
            {trend && (
                <span className={`trend trend-${trend.type}`} style={{ fontSize: 11, padding: '2px 8px', marginTop: 4 }}>
                    {trend.text}
                </span>
            )}
        </div>
    </div>
);

// Stat Box
const StatBox = ({ label, value, unit, change, positive }) => (
    <div className="stat-box">
        <p className="label">{label}</p>
        <p className="stat-value">{value}{unit && <span className="unit">{unit}</span>}</p>
        {change !== undefined && (
            <p className={`stat-change ${positive === true ? 'positive' : positive === false ? 'negative' : ''}`}>
                {typeof change === 'number' ? (change > 0 ? '+' : '') + change.toFixed(1) : change}
            </p>
        )}
    </div>
);

// Insight Box
const InsightBox = ({ title, text, color = 'blue' }) => (
    <div className={`insight-box ${color}`}>
        <p className="insight-title">{title}</p>
        <p className="insight">{text}</p>
    </div>
);

// Zone Entry Modal — tap a workout, enter 5 zone values
const ZoneEntryModal = ({ workout, onClose, onSave }) => {
    const [zones, setZones] = useState(() => {
        const key = `${workout['Date']}|${workout['Workout Type']}`;
        const stored = storage.get('zones', {});
        return stored[key] || { z1: '', z2: '', z3: '', z4: '', z5: '' };
    });
    
    const handleSave = () => {
        const key = `${workout['Date']}|${workout['Workout Type']}`;
        const allZones = storage.get('zones', {});
        allZones[key] = {
            z1: parseFloat(zones.z1) || 0,
            z2: parseFloat(zones.z2) || 0,
            z3: parseFloat(zones.z3) || 0,
            z4: parseFloat(zones.z4) || 0,
            z5: parseFloat(zones.z5) || 0
        };
        storage.set('zones', allZones);
        onSave();
        onClose();
    };
    
    const handleDelete = () => {
        const key = `${workout['Date']}|${workout['Workout Type']}`;
        const allZones = storage.get('zones', {});
        delete allZones[key];
        storage.set('zones', allZones);
        onSave();
        onClose();
    };
    
    const dur = parseFloat(workout['Duration (min)']) || 0;
    const avgHR = parseFloat(workout['Avg HR']) || 0;
    const maxHR = parseFloat(workout['Max HR']) || 0;
    const classified = hrEngine.classifyWorkout(workout);
    const total = (parseFloat(zones.z1) || 0) + (parseFloat(zones.z2) || 0) + (parseFloat(zones.z3) || 0) + (parseFloat(zones.z4) || 0) + (parseFloat(zones.z5) || 0);
    const hasData = total > 0;
    
    const zoneColors = ['var(--text-tertiary)', 'var(--green)', 'var(--blue)', 'var(--orange)', 'var(--red)'];
    const zoneLabels = ['Z1 (<129)', 'Z2 (130-141)', 'Z3 (142-153)', 'Z4 (154-165)', 'Z5 (166+)'];
    
    return (
        <div className="modal-overlay open" onClick={onClose}>
            <div className="modal-sheet hide-scrollbar" onClick={e => e.stopPropagation()} style={{ maxHeight: '85vh' }}>
                <div className="modal-handle" />
                <div style={{ padding: 24 }}>
                    <button className="modal-back" onClick={onClose}>‹</button>
                    <p className="label" style={{ marginBottom: 4 }}>ENTER ZONE DATA</p>
                    <p style={{ fontSize: 18, fontWeight: 600, marginBottom: 4 }}>{workout['Workout Type']}</p>
                    <p style={{ fontSize: 13, color: 'var(--text-secondary)', marginBottom: 4 }}>{workout['Date']} · {Math.round(dur)} min</p>
                    {avgHR > 0 && (
                        <p style={{ fontSize: 13, color: 'var(--text-tertiary)' }}>
                            Avg HR: {avgHR} · Max HR: {maxHR || '—'} · Estimated: Z{classified.zone === 'str' ? 'STR' : classified.zone}
                        </p>
                    )}
                    
                    <div style={{ marginTop: 20, display: 'flex', flexDirection: 'column', gap: 12 }}>
                        {[1,2,3,4,5].map(z => (
                            <div key={z} style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                                <div style={{ width: 10, height: 10, borderRadius: 5, background: zoneColors[z-1], flexShrink: 0 }} />
                                <p style={{ fontSize: 13, color: 'var(--text-secondary)', width: 100, flexShrink: 0 }}>{zoneLabels[z-1]}</p>
                                <input 
                                    type="number" 
                                    inputMode="numeric"
                                    placeholder="0"
                                    value={zones[`z${z}`]}
                                    onChange={e => setZones({...zones, [`z${z}`]: e.target.value})}
                                    style={{ 
                                        flex: 1, padding: '10px 12px', borderRadius: 10, border: '1px solid var(--border)',
                                        fontSize: 16, fontWeight: 600, background: 'var(--card-elevated)', 
                                        color: 'var(--text-primary)', textAlign: 'center', maxWidth: 80
                                    }}
                                />
                                <span style={{ fontSize: 13, color: 'var(--text-tertiary)' }}>min</span>
                            </div>
                        ))}
                    </div>
                    
                    {total > 0 && (
                        <div style={{ marginTop: 16, padding: '10px 14px', borderRadius: 10, background: 'rgba(0,0,0,0.03)' }}>
                            <div style={{ display: 'flex', height: 8, borderRadius: 4, overflow: 'hidden', marginBottom: 6 }}>
                                {[1,2,3,4,5].map(z => {
                                    const mins = parseFloat(zones[`z${z}`]) || 0;
                                    if (mins <= 0) return null;
                                    return <div key={z} style={{ width: `${(mins/total)*100}%`, background: zoneColors[z-1] }} />;
                                })}
                            </div>
                            <p style={{ fontSize: 12, color: 'var(--text-tertiary)', textAlign: 'center' }}>
                                Total: {Math.round(total)} min {dur > 0 ? `(session: ${Math.round(dur)} min)` : ''}
                            </p>
                        </div>
                    )}
                    
                    <div style={{ marginTop: 20, display: 'flex', gap: 10 }}>
                        <button onClick={handleSave} style={{ 
                            flex: 1, padding: '14px 20px', borderRadius: 12, border: 'none',
                            background: 'var(--blue)', color: 'white', fontSize: 16, fontWeight: 600, cursor: 'pointer'
                        }}>
                            Save zones
                        </button>
                        {hasData && (
                            <button onClick={handleDelete} style={{ 
                                padding: '14px 16px', borderRadius: 12, border: '1px solid var(--border)',
                                background: 'transparent', color: 'var(--red)', fontSize: 14, cursor: 'pointer'
                            }}>
                                Clear
                            </button>
                        )}
                    </div>
                </div>
            </div>
        </div>
    );
};
