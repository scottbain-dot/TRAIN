<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HYROX ENGINE</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --bg: #0a0a0a;
            --card: #141414;
            --card-border: rgba(255,255,255,0.06);
            --text: #ffffff;
            --text-secondary: rgba(255,255,255,0.6);
            --text-tertiary: rgba(255,255,255,0.35);
            --accent: #00D4AA;
            --accent-warm: #F5A623;
            --accent-blue: #4A90D9;
            --accent-purple: #9B59B6;
            --accent-red: #E74C3C;
        }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        
        /* Gradient backgrounds */
        .gradient-recovery {
            background: linear-gradient(135deg, #1a3a4a 0%, #0d2030 50%, #0a1520 100%);
        }
        .gradient-aerobic {
            background: linear-gradient(135deg, #1a4a3a 0%, #0d3020 50%, #0a2015 100%);
        }
        .gradient-race {
            background: linear-gradient(135deg, #4a3a1a 0%, #302510 50%, #201a0a 100%);
        }
        .gradient-hyrox {
            background: linear-gradient(135deg, #3a1a4a 0%, #200d30 50%, #150a20 100%);
        }
        .gradient-session {
            background: linear-gradient(165deg, #2c3e50 0%, #1a252f 40%, #0d1318 100%);
        }
        
        /* Aurora effect */
        .aurora {
            position: relative;
            overflow: hidden;
        }
        .aurora::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(0, 212, 170, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 60%, rgba(74, 144, 217, 0.1) 0%, transparent 40%);
            animation: aurora 15s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes aurora {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-5%, 5%) rotate(3deg); }
        }
        
        /* Cards */
        .card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:active {
            transform: scale(0.98);
        }
        .card-metric {
            position: relative;
            padding: 20px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }
        .card-metric::after {
            content: '→';
            position: absolute;
            top: 20px;
            right: 20px;
            opacity: 0.4;
            font-size: 18px;
        }
        
        /* Score arc */
        .score-container {
            position: relative;
            width: 80px;
            height: 80px;
        }
        .score-arc {
            transform: rotate(-90deg);
        }
        .score-arc circle {
            fill: none;
            stroke-linecap: round;
        }
        .score-arc .bg {
            stroke: rgba(255,255,255,0.1);
        }
        .score-arc .progress {
            transition: stroke-dashoffset 1s ease-out;
            filter: drop-shadow(0 0 8px currentColor);
        }
        .score-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: 700;
        }
        
        /* Typography */
        .label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.6;
        }
        .insight {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.4;
        }
        .value-large {
            font-size: 42px;
            font-weight: 300;
            letter-spacing: -1px;
        }
        .value-unit {
            font-size: 16px;
            font-weight: 400;
            opacity: 0.6;
            margin-left: 4px;
        }
        
        /* Progress bar */
        .progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.8s ease-out;
        }
        
        /* Session card */
        .session-card {
            position: relative;
            padding: 24px;
            min-height: 140px;
            cursor: pointer;
        }
        .session-type {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            background: rgba(255,255,255,0.15);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .session-name {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .session-detail {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(20px);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 90vh;
            background: #1a1a1a;
            border-radius: 24px 24px 0 0;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
        }
        .modal-overlay.open .modal-content {
            transform: translateY(0);
        }
        .modal-handle {
            width: 40px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            margin: 12px auto 20px;
        }
        
        /* Navigation */
        .nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(20,20,20,0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--card-border);
            padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: space-around;
            z-index: 50;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 20px;
            color: var(--text-tertiary);
            font-size: 10px;
            font-weight: 500;
            background: none;
            border: none;
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-item.active {
            color: var(--accent);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
        }
        
        /* Detail page header */
        .detail-header {
            position: relative;
            padding: 60px 24px 30px;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .detail-back {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 40px;
            height: 40px;
            background: rgba(0,0,0,0.3);
            border: none;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        /* Data row */
        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--card-border);
        }
        .data-row:last-child {
            border-bottom: none;
        }
        
        /* Trend indicator */
        .trend {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: 500;
        }
        .trend.up { color: var(--accent); }
        .trend.down { color: var(--accent-red); }
        .trend.neutral { color: var(--text-tertiary); }
        
        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeInUp 0.5s ease-out forwards; }
        .delay-1 { animation-delay: 0.1s; opacity: 0; }
        .delay-2 { animation-delay: 0.2s; opacity: 0; }
        .delay-3 { animation-delay: 0.3s; opacity: 0; }
        .delay-4 { animation-delay: 0.4s; opacity: 0; }
        
        /* Utility */
        .container { max-width: 500px; margin: 0 auto; padding-bottom: 100px; }
        .px-4 { padding-left: 16px; padding-right: 16px; }
        .py-4 { padding-top: 16px; padding-bottom: 16px; }
        .mb-3 { margin-bottom: 12px; }
        .mb-4 { margin-bottom: 16px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;

        // ============================================
        // CONFIG
        // ============================================
        const SHEETS = {
            id: '1BlGGukORumWb7508lcu-SS0wF8lMwdOJEsOp-vGCKrc',
            workouts: 'Workouts',
            daily: 'DailyMetrics'
        };

        const TARGETS = {
            vo2max: 48,
            twoKm: 465, // 7:45
            threshold: 255, // 4:15/km
            weeklyVol: 50,
            raceTime: 65 * 60, // 1:05:00
        };

        const BASELINES = {
            vo2max: 43.5,
            twoKm: 540, // 9:00
            threshold: 285, // 4:45/km
        };

        // ============================================
        // UTILITIES
        // ============================================
        const storage = {
            get: (k, d) => { try { return JSON.parse(localStorage.getItem('hyrox9_'+k)) || d; } catch { return d; }},
            set: (k, v) => localStorage.setItem('hyrox9_'+k, JSON.stringify(v))
        };

        const formatTime = (s) => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
        const formatPace = (s) => `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}/km`;
        const parseTime = (str) => { const p = str?.split(':'); return p?.length === 2 ? parseInt(p[0])*60 + parseInt(p[1]) : 0; };

        const fetchSheet = async (name) => {
            try {
                const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEETS.id}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}`);
                const txt = await res.text();
                const json = JSON.parse(txt.substring(47).slice(0,-2));
                const headers = json.table.cols.map(c => c.label || '');
                return json.table.rows?.map(r => {
                    const o = {};
                    r.c?.forEach((c,i) => { if(headers[i]) o[headers[i]] = c?.v ?? c?.f ?? null; });
                    return o;
                }) || [];
            } catch { return []; }
        };

        // ============================================
        // SESSIONS
        // ============================================
        const SESSIONS = {
            easyRun: (mins, km) => ({
                type: 'Easy Run', zone: 2, duration: mins, distance: km,
                purpose: 'Build aerobic base and promote recovery',
                structure: [
                    { block: 'Warm-up', time: '5 min', note: 'Walk to easy jog' },
                    { block: 'Main', time: `${mins-10} min`, note: 'Conversational pace, HR 130-145' },
                    { block: 'Cool-down', time: '5 min', note: 'Easy jog to walk' },
                ],
                targets: { hr: '130-145 bpm', pace: '5:30-6:30/km', feel: 'RPE 4-5, can chat easily' }
            }),
            longRun: (mins) => ({
                type: 'Long Run', zone: 2, duration: mins, distance: Math.round(mins/6),
                purpose: 'Maximize aerobic adaptations and build endurance',
                structure: [
                    { block: 'Easy start', time: '15 min', note: 'Very relaxed, wake up the body' },
                    { block: 'Main', time: `${mins-20} min`, note: 'Steady Z2, even effort throughout' },
                    { block: 'Cool-down', time: '5 min', note: 'Easy to finish' },
                ],
                targets: { hr: '130-145 bpm', pace: '5:45-6:30/km', feel: 'RPE 5-6, finish strong' }
            }),
            threshold: (reps, repMins) => ({
                type: 'Threshold', zone: 4, duration: reps * repMins + reps * 2 + 20,
                purpose: 'Raise lactate threshold for faster sustainable pace',
                structure: [
                    { block: 'Warm-up', time: '10 min', note: 'Easy jog + 4×30s strides' },
                    { block: 'Main', time: `${reps}×${repMins} min`, note: 'Threshold pace, 2min jog between' },
                    { block: 'Cool-down', time: '10 min', note: 'Easy jog' },
                ],
                targets: { hr: '160-170 bpm', pace: '4:20-4:50/km', feel: 'RPE 7-8, comfortably hard' }
            }),
            vo2max: (reps, repMins) => ({
                type: 'VO₂max Intervals', zone: 5, duration: reps * repMins + reps * 3 + 20,
                purpose: 'Expand aerobic ceiling and top-end speed',
                structure: [
                    { block: 'Warm-up', time: '10 min', note: 'Easy + strides' },
                    { block: 'Main', time: `${reps}×${repMins} min`, note: 'Hard effort, 3min easy between' },
                    { block: 'Cool-down', time: '10 min', note: 'Easy jog' },
                ],
                targets: { hr: '170-185 bpm', pace: '3:50-4:20/km', feel: 'RPE 9, very hard' }
            }),
            strength: (focus) => ({
                type: `Strength: ${focus}`, zone: 'STR', duration: 45,
                purpose: focus === 'Lower' ? 'Build leg strength for sled and lunges' : 'Build upper body for ski, row, wall balls',
                structure: [
                    { block: 'Warm-up', time: '8 min', note: 'Bike/row + dynamic stretches' },
                    { block: 'Strength', time: '30 min', note: 'See exercises' },
                    { block: 'Cool-down', time: '7 min', note: 'Stretch + foam roll' },
                ],
                exercises: focus === 'Lower' 
                    ? ['Back Squat 4×6-8', 'RDL 3×8-10', 'Walking Lunges 3×12', 'Leg Press 3×12-15', 'Calf Raises 3×15-20']
                    : ['Pull-ups 4×6-10', 'DB Row 3×10', 'Push Press 3×8-10', 'Wall Balls 3×20', 'Ski Erg 3×250m']
            }),
            miniSim: (station) => ({
                type: 'Mini-Sim', zone: 'SIM', duration: 30, distance: 4,
                purpose: 'Practice running under fatigue, test pacing',
                structure: [
                    { block: 'Warm-up', time: '5 min', note: 'Easy jog' },
                    { block: 'Round 1-4', time: '~24 min', note: `4× (1km run + ${station})` },
                    { block: 'Cool-down', time: '5 min', note: 'Walk' },
                ],
                targets: { splits: '4:25-4:40/km', decay: '<5% slower on R4', total: '25:40' }
            }),
            rest: () => ({
                type: 'Rest Day', zone: null, duration: 0,
                purpose: 'Recovery is when adaptation happens',
                structure: [
                    { block: 'Option A', time: '0 min', note: 'Complete rest' },
                    { block: 'Option B', time: '20 min', note: 'Walk + stretch' },
                ],
            }),
        };

        const getWeekPlan = (phase) => {
            const plans = {
                base: [
                    { day: 'Mon', ...SESSIONS.easyRun(45, 7) },
                    { day: 'Tue', ...SESSIONS.strength('Lower') },
                    { day: 'Wed', ...SESSIONS.easyRun(40, 6) },
                    { day: 'Thu', ...SESSIONS.easyRun(45, 7) },
                    { day: 'Fri', ...SESSIONS.strength('Upper') },
                    { day: 'Sat', ...SESSIONS.longRun(75) },
                    { day: 'Sun', ...SESSIONS.rest() },
                ],
                build: [
                    { day: 'Mon', ...SESSIONS.easyRun(50, 8) },
                    { day: 'Tue', ...SESSIONS.strength('Lower') },
                    { day: 'Wed', ...SESSIONS.easyRun(45, 7) },
                    { day: 'Thu', ...SESSIONS.vo2max(5, 4) },
                    { day: 'Fri', ...SESSIONS.strength('Upper') },
                    { day: 'Sat', ...SESSIONS.longRun(100) },
                    { day: 'Sun', ...SESSIONS.threshold(3, 8) },
                ],
                specific: [
                    { day: 'Mon', ...SESSIONS.easyRun(50, 8) },
                    { day: 'Tue', ...SESSIONS.strength('Lower') },
                    { day: 'Wed', ...SESSIONS.easyRun(45, 7) },
                    { day: 'Thu', ...SESSIONS.vo2max(5, 4) },
                    { day: 'Fri', ...SESSIONS.rest() },
                    { day: 'Sat', ...SESSIONS.longRun(90) },
                    { day: 'Sun', ...SESSIONS.miniSim('Row 500m') },
                ],
            };
            return plans[phase] || plans.base;
        };

        // ============================================
        // COMPONENTS
        // ============================================
        
        // Score Arc
        const ScoreArc = ({ value, max = 100, color = 'var(--accent)', size = 80 }) => {
            const r = (size - 8) / 2;
            const circ = 2 * Math.PI * r;
            const pct = Math.min(100, Math.max(0, (value / max) * 100));
            const offset = circ - (pct / 100) * circ;
            
            return (
                <div className="score-container" style={{ width: size, height: size }}>
                    <svg width={size} height={size} className="score-arc">
                        <circle className="bg" cx={size/2} cy={size/2} r={r} strokeWidth="6" />
                        <circle className="progress" cx={size/2} cy={size/2} r={r} strokeWidth="6"
                            stroke={color} strokeDasharray={circ} strokeDashoffset={offset} />
                    </svg>
                    <div className="score-value" style={{ color }}>{Math.round(value)}</div>
                </div>
            );
        };

        // Metric Card
        const MetricCard = ({ title, value, unit, insight, gradient, color, onClick, trend }) => (
            <div className={`card card-metric aurora ${gradient}`} onClick={onClick}>
                <div>
                    <p className="label" style={{ marginBottom: 8 }}>{title}</p>
                    <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
                        <span className="value-large" style={{ color }}>{value}</span>
                        {unit && <span className="value-unit">{unit}</span>}
                    </div>
                    {trend && (
                        <span className={`trend ${trend.dir}`} style={{ marginTop: 4, display: 'inline-flex' }}>
                            {trend.dir === 'up' ? '↑' : trend.dir === 'down' ? '↓' : '→'} {trend.text}
                        </span>
                    )}
                </div>
                <p className="insight">{insight}</p>
            </div>
        );

        // Session Card
        const SessionCard = ({ session, isToday, onClick }) => (
            <div className={`card session-card aurora gradient-session`} onClick={onClick}>
                <div className="session-type">
                    {session.zone === 2 ? '🟢 Z2' : session.zone === 4 ? '🟠 Threshold' : session.zone === 5 ? '🔴 VO₂max' : session.zone === 'STR' ? '💪 Strength' : session.zone === 'SIM' ? '🏁 Simulation' : '😴 Recovery'}
                </div>
                <p className="session-name">{session.type}</p>
                <p className="session-detail">
                    {session.duration > 0 ? `${session.duration} min` : 'Rest day'}
                    {session.distance > 0 && ` · ${session.distance}km`}
                    {isToday && ' · Today'}
                </p>
                <div style={{ position: 'absolute', bottom: 20, right: 20, opacity: 0.4 }}>→</div>
            </div>
        );

        // ============================================
        // DETAIL VIEWS
        // ============================================
        const RecoveryDetail = ({ data, onClose }) => (
            <div className="modal-overlay open" onClick={onClose}>
                <div className="modal-content" onClick={e => e.stopPropagation()}>
                    <div className="modal-handle" />
                    <div className={`detail-header gradient-recovery aurora`}>
                        <button className="detail-back" onClick={onClose}>←</button>
                        <p className="label" style={{ marginBottom: 8 }}>RECOVERY</p>
                        <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
                            <span style={{ fontSize: 56, fontWeight: 300 }}>{data.score}</span>
                            <span style={{ fontSize: 20, opacity: 0.6 }}>/ 100</span>
                        </div>
                        <p style={{ fontSize: 18, marginTop: 8, color: 'var(--text-secondary)' }}>{data.insight}</p>
                    </div>
                    <div style={{ padding: '24px' }}>
                        <p className="label" style={{ marginBottom: 16 }}>CONTRIBUTING FACTORS</p>
                        
                        <div className="data-row">
                            <div>
                                <p style={{ fontWeight: 500 }}>Resting Heart Rate</p>
                                <p className="insight">vs {data.hrBaseline} baseline</p>
                            </div>
                            <div style={{ textAlign: 'right' }}>
                                <p style={{ fontSize: 20, fontWeight: 600 }}>{data.restingHR} <span style={{ fontSize: 14, opacity: 0.6 }}>bpm</span></p>
                                <span className={`trend ${data.restingHR <= data.hrBaseline ? 'up' : 'down'}`}>
                                    {data.restingHR <= data.hrBaseline ? '✓ Good' : '↑ Elevated'}
                                </span>
                            </div>
                        </div>
                        
                        <div className="data-row">
                            <div>
                                <p style={{ fontWeight: 500 }}>Heart Rate Variability</p>
                                <p className="insight">Higher is better</p>
                            </div>
                            <div style={{ textAlign: 'right' }}>
                                <p style={{ fontSize: 20, fontWeight: 600 }}>{data.hrv} <span style={{ fontSize: 14, opacity: 0.6 }}>ms</span></p>
                                <span className={`trend ${data.hrv >= 50 ? 'up' : data.hrv >= 35 ? 'neutral' : 'down'}`}>
                                    {data.hrv >= 50 ? '✓ Strong' : data.hrv >= 35 ? '→ Normal' : '↓ Low'}
                                </span>
                            </div>
                        </div>
                        
                        <div className="data-row">
                            <div>
                                <p style={{ fontWeight: 500 }}>Sleep</p>
                                <p className="insight">Data from Apple Watch</p>
                            </div>
                            <div style={{ textAlign: 'right' }}>
                                <p style={{ fontSize: 20, fontWeight: 600 }}>{data.sleep > 0 ? `${data.sleep.toFixed(1)}h` : '—'}</p>
                                <span className={`trend ${data.sleep >= 7 ? 'up' : data.sleep >= 6 ? 'neutral' : 'down'}`}>
                                    {data.sleep >= 7 ? '✓ Good' : data.sleep >= 6 ? '→ Okay' : data.sleep > 0 ? '↓ Low' : 'No data'}
                                </span>
                            </div>
                        </div>

                        <div style={{ marginTop: 24, padding: 16, background: 'rgba(0,212,170,0.1)', borderRadius: 12 }}>
                            <p style={{ fontWeight: 500, color: 'var(--accent)', marginBottom: 8 }}>💡 What this means</p>
                            <p className="insight">{data.recommendation}</p>
                        </div>
                    </div>
                </div>
            </div>
        );

        const AerobicDetail = ({ data, onClose }) => (
            <div className="modal-overlay open" onClick={onClose}>

            const [workouts, setWorkouts] = useState([]);
            const [daily, setDaily] = useState([]);
            const [tests, setTests] = useState(() => storage.get('tests', { twoKm: [], threshold: [], miniSim: [] }));
            const [profile] = useState(() => storage.get('profile', { name: 'Lad', hrBaseline: 55, raceDate: '2027-04-15' }));
            const [modal, setModal] = useState(null);
            const [testModal, setTestModal] = useState(null);

            useEffect(() => { storage.set('tests', tests); }, [tests]);

            useEffect(() => {
                Promise.all([fetchSheet('Workouts'), fetchSheet('DailyMetrics')]).then(([w, d]) => {
                    setWorkouts(w.filter(x => x['Date']));
                    setDaily(d.filter(x => x['Date']));
                });
            }, []);

            const now = Date.now();
            const weekAgo = now - 7*24*60*60*1000;

            // Latest metrics
            const latestDaily = useMemo(() => {
                const sorted = [...daily].sort((a,b) => new Date(b['Date']) - new Date(a['Date']));
                return {
                    restingHR: sorted.find(d => d['Resting HR'])?.['Resting HR'] || 55,
                    hrv: sorted.find(d => d['HRV (ms)'])?.['HRV (ms)'] || 0,
                    vo2max: sorted.find(d => d['VO2 Max'])?.['VO2 Max'] || 43.5,
                    sleep: sorted.find(d => d['Sleep Duration (hr)'])?.['Sleep Duration (hr)'] || 0,
                };
            }, [daily]);

            const weeklyVol = useMemo(() => 
                workouts.filter(w => new Date(w['Date']) >= weekAgo).reduce((s,w) => s + (parseFloat(w['Distance (km)']) || 0), 0)
            , [workouts, weekAgo]);

            const z2Sessions = useMemo(() => 
                workouts.filter(w => new Date(w['Date']) >= weekAgo && (w['Workout Type']?.toLowerCase().includes('run') || w['Workout Type']?.toLowerCase().includes('walking'))).length
            , [workouts, weekAgo]);

            // Recovery score
            const recoveryScore = useMemo(() => {
                let score = 70;
                const hrDiff = latestDaily.restingHR - profile.hrBaseline;
                if (hrDiff <= 0) score += 15;
                else if (hrDiff <= 3) score += 5;
                else if (hrDiff > 5) score -= 15;
                
                if (latestDaily.hrv >= 50) score += 10;
                else if (latestDaily.hrv >= 35) score += 0;
                else if (latestDaily.hrv > 0) score -= 10;
                
                if (latestDaily.sleep >= 7) score += 5;
                else if (latestDaily.sleep >= 6) score += 0;
                else if (latestDaily.sleep > 0) score -= 5;
                
                return Math.max(0, Math.min(100, score));
            }, [latestDaily, profile.hrBaseline]);

            const recoveryInsight = recoveryScore >= 80 ? "You're recovered. Push hard today." : recoveryScore >= 60 ? "Moderate recovery. Train as planned." : "Recovery needed. Consider an easy day.";

            // Test data
            const latestTwoKm = tests.twoKm[tests.twoKm.length - 1];
            const latestThreshold = tests.threshold[tests.threshold.length - 1];
            const latestSim = tests.miniSim[tests.miniSim.length - 1];

            // Predicted race time
            const predictedTime = useMemo(() => {
                const twoKm = latestTwoKm?.time || BASELINES.twoKm;
                const threshold = latestThreshold?.pace || BASELINES.threshold;
                const base = 75; // minutes
                const twoKmFactor = (twoKm - 465) * 0.15;
                const thresholdFactor = (threshold - 255) * 0.1;
                return Math.round(base + twoKmFactor + thresholdFactor);
            }, [latestTwoKm, latestThreshold]);

            const raceInsight = predictedTime <= 65 ? "On track for 1:05!" : predictedTime <= 70 ? "Improving steadily" : predictedTime <= 75 ? "Building fitness" : "Keep training consistently";

            // Week plan
            const weekPlan = useMemo(() => getWeekPlan('base'), []);
            const todayName = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date().getDay()];
            const todaySession = weekPlan.find(d => d.day === todayName);

            const daysToRace = Math.floor((new Date(profile.raceDate) - now) / 86400000);

                setTests(prev => ({ ...prev, [result.type]: [...prev[result.type], result] }));
            };

                                title="Recovery" 
                                value={recoveryScore} 
                                insight={recoveryInsight}
                                gradient="gradient-recovery"
                                color="var(--accent-blue)"
                                onClick={() => setModal({ type: 'recovery', data: { score: recoveryScore, insight: recoveryInsight, restingHR: latestDaily.restingHR, hrBaseline: profile.hrBaseline, hrv: latestDaily.hrv, sleep: latestDaily.sleep, recommendation: recoveryScore >= 80 ? "Your body has recovered well. Great day for a hard workout." : recoveryScore >= 60 ? "Decent recovery. Stick to the plan." : "Your body needs more rest. Consider swapping for an easy day or rest." }})}
                            />
                            <MetricCard 
                                title="Aerobic Engine" 
                                value={latestDaily.vo2max.toFixed(1)}

                                color="var(--accent)"

                                insight={raceInsight}
                                gradient="gradient-race"
                                color="var(--accent-warm)"
                                onClick={() => setModal({ type: 'raceFitness', data: { predicted: `~${Math.floor(predictedTime/60)}:${String(predictedTime%60).padStart(2,'0')}`, insight: raceInsight, twoKm: latestTwoKm?.time, twoKmDate: latestTwoKm?.date, threshold: latestThreshold?.pace, thresholdDate: latestThreshold?.date }})}

                            <MetricCard

                                    <p style={{ fontSize: 32, fontWeight: 300, marginTop: 4 }}>{daysToRace} <span style={{ fontSize: 16, opacity: 0.5 }}>days</span></p>
                                </div>
                                <div style={{ textAlign: 'right' }}>
                                    <p style={{ fontSize: 13, color: 'var(--text-secondary)' }}>Target</p>
                                    <p style={{ fontSize: 24, fontWeight: 600, color: 'var(--accent)' }}>1:05:00</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            // ============================================
            // PLAN TAB
            // ============================================
            const renderPlan = () => (
                <div className="container hide-scrollbar">
                    <div className="px-4 py-4">
                        <h1 style={{ fontSize: 28, fontWeight: 600 }}>This Week</h1>
                        <p style={{ color: 'var(--text-secondary)' }}>Base Phase · Week 1</p>
                    </div>
                    <div className="px-4" style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                        {weekPlan.map((item, i) => (
                            <div key={i} className={`card`} style={{ padding: 16, cursor: 'pointer', border: item.day === todayName ? '1px solid var(--accent)' : '1px solid var(--card-border)' }} onClick={() => setModal({ type: 'session', data: item })}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                    <div>
                                        <p style={{ fontSize: 12, color: 'var(--text-tertiary)', marginBottom: 4 }}>{item.day}{item.day === todayName && ' · Today'}</p>
                                        <p style={{ fontWeight: 500 }}>{item.type}</p>
                                    </div>
                                    <div style={{ textAlign: 'right' }}>
                                        {item.duration > 0 && <p style={{ fontSize: 14 }}>{item.duration}min</p>}
                                        {item.zone && <span style={{ fontSize: 11, padding: '2px 8px', background: item.zone === 2 ? 'rgba(0,212,170,0.2)' : item.zone === 4 ? 'rgba(245,166,35,0.2)' : item.zone === 5 ? 'rgba(231,76,60,0.2)' : 'rgba(155,89,182,0.2)', borderRadius: 10, color: item.zone === 2 ? 'var(--accent)' : item.zone === 4 ? 'var(--accent-warm)' : item.zone === 5 ? 'var(--accent-red)' : 'var(--accent-purple)' }}>{item.zone === 'STR' ? 'Strength' : item.zone === 'SIM' ? 'Sim' : `Z${item.zone}`}</span>}
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );

            // ============================================
            // RENDER
            // ============================================
            return (
                <>
                    {tab === 'home' && renderHome()}
                    {tab === 'plan' && renderPlan()}

                    <nav className="nav">
                        <button className={`nav-item ${tab === 'home' ? 'active' : ''}`} onClick={() => setTab('home')}>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                            <span>Home</span>
                        </button>
                        <button className={`nav-item ${tab === 'plan' ? 'active' : ''}`} onClick={() => setTab('plan')}>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                            <span>Plan</span>
                        </button>
                    </nav>

                    {modal?.type === 'recovery' && <RecoveryDetail data={modal.data} onClose={() => setModal(null)} />}
                    {modal?.type === 'aerobic' && <AerobicDetail data={modal.data} onClose={() => setModal(null)} />}
                    {modal?.type === 'raceFitness' && <RaceFitnessDetail data={modal.data} onClose={() => setModal(null)} onLogTest={(t) => { setModal(null); setTestModal(t); }} />}
                    {modal?.type === 'hyroxReady' && <HyroxReadyDetail data={modal.data} onClose={() => setModal(null)} onLogTest={(t) => { setModal(null); setTestModal(t); }} />}
                    {modal?.type === 'session' && <SessionDetail session={modal.data} onClose={() => setModal(null)} />}
                    {testModal && <TestModal type={testModal} onClose={() => setTestModal(null)} onSave={handleTestSave} />}
                </>
            );
        }

        ReactDOM.createRoot(document.getElementById('app')).render(<App />);
    </script>
</body>
</html>
