<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HYROX ENGINE</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --bg: #000000;
            --bg-card: #0d0d0d;
            --bg-elevated: #1a1a1a;
            --border: rgba(255,255,255,0.08);
            --text: #ffffff;
            --text-secondary: rgba(255,255,255,0.55);
            --text-tertiary: rgba(255,255,255,0.3);
            --green: #34C759;
            --green-dim: rgba(52,199,89,0.15);
            --yellow: #FFD60A;
            --yellow-dim: rgba(255,214,10,0.15);
            --orange: #FF9F0A;
            --orange-dim: rgba(255,159,10,0.15);
            --red: #FF453A;
            --red-dim: rgba(255,69,58,0.15);
            --blue: #0A84FF;
            --blue-dim: rgba(10,132,255,0.15);
            --purple: #BF5AF2;
            --purple-dim: rgba(191,90,242,0.15);
            --cyan: #5AC8FA;
            --cyan-dim: rgba(90,200,250,0.15);
        }
        
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.4; -webkit-font-smoothing: antialiased; }
        
        /* Gradients */
        .grad-readiness { background: linear-gradient(135deg, #1a3a4a 0%, #0d2030 50%, #0a1520 100%); }
        .grad-aerobic { background: linear-gradient(135deg, #1a4a3a 0%, #0d3020 50%, #0a2015 100%); }
        .grad-race { background: linear-gradient(135deg, #4a3a1a 0%, #302510 50%, #201a0a 100%); }
        .grad-hyrox { background: linear-gradient(135deg, #3a1a4a 0%, #200d30 50%, #150a20 100%); }
        .grad-session { background: linear-gradient(165deg, #2c3e50 0%, #1a252f 40%, #0d1318 100%); }
        
        .aurora { position: relative; overflow: hidden; }
        .aurora::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(0,212,170,0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 60%, rgba(74,144,217,0.1) 0%, transparent 40%);
            animation: aurora 15s ease-in-out infinite; pointer-events: none;
        }
        @keyframes aurora { 0%, 100% { transform: translate(0,0) rotate(0deg); } 50% { transform: translate(-5%,5%) rotate(3deg); } }
        
        /* Cards */
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
        .card:active { transform: scale(0.98); }
        .metric-card { position: relative; padding: 20px; min-height: 150px; display: flex; flex-direction: column; justify-content: space-between; cursor: pointer; }
        .metric-card .arrow { position: absolute; top: 18px; right: 18px; width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 12px; color: rgba(255,255,255,0.6); }
        
        /* Typography */
        .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-secondary); }
        .value-xl { font-size: 44px; font-weight: 300; letter-spacing: -2px; line-height: 1.1; }
        .value-lg { font-size: 32px; font-weight: 400; letter-spacing: -1px; }
        .unit { font-size: 14px; font-weight: 400; color: var(--text-secondary); margin-left: 4px; }
        .insight { font-size: 14px; color: var(--text-secondary); line-height: 1.4; }
        
        /* Trends */
        .trend { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; padding: 4px 10px; border-radius: 12px; }
        .trend-up { background: var(--green-dim); color: var(--green); }
        .trend-down { background: var(--red-dim); color: var(--red); }
        .trend-stable { background: var(--yellow-dim); color: var(--yellow); }
        .trend-neutral { background: rgba(255,255,255,0.08); color: var(--text-secondary); }
        
        /* Progress */
        .progress-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease-out; }
        
        /* Charts */
        .chart-container { position: relative; height: 200px; margin: 16px 0; }
        .chart-line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .chart-area { opacity: 0.15; }
        .chart-dot { fill: var(--bg); stroke-width: 2; }
        .chart-grid { stroke: rgba(255,255,255,0.06); stroke-width: 1; }
        .chart-label { font-size: 10px; fill: var(--text-tertiary); }
        .chart-value { font-size: 11px; fill: var(--text-secondary); }
        
        /* Bar chart */
        .bar-chart { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding: 0 4px; }
        .bar { flex: 1; border-radius: 4px 4px 0 0; min-width: 8px; transition: height 0.3s ease; position: relative; }
        .bar-label { position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%); font-size: 9px; color: var(--text-tertiary); white-space: nowrap; }
        
        /* Time toggle */
        .time-toggle { display: flex; background: var(--bg-elevated); border-radius: 10px; padding: 3px; }
        .time-toggle button { flex: 1; padding: 8px 12px; border: none; border-radius: 8px; background: transparent; color: var(--text-tertiary); font-size: 13px; font-weight: 500; cursor: pointer; }
        .time-toggle button.active { background: var(--bg-card); color: var(--text); }
        
        /* Data rows */
        .data-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); }
        .data-row:last-child { border-bottom: none; }
        
        /* Comparison card */
        .compare-card { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; padding: 20px; align-items: center; }
        .compare-period { text-align: center; }
        .compare-vs { font-size: 12px; color: var(--text-tertiary); padding: 8px 12px; background: var(--bg-elevated); border-radius: 8px; }
        
        /* Insight box */
        .insight-box { padding: 16px; border-radius: 14px; margin-top: 16px; }
        .insight-box.green { background: var(--green-dim); border: 1px solid rgba(52,199,89,0.2); }
        .insight-box.blue { background: var(--blue-dim); border: 1px solid rgba(10,132,255,0.2); }
        .insight-box.orange { background: var(--orange-dim); border: 1px solid rgba(255,159,10,0.2); }
        .insight-box.purple { background: var(--purple-dim); border: 1px solid rgba(191,90,242,0.2); }
        .insight-box-title { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
        .insight-box.green .insight-box-title { color: var(--green); }
        .insight-box.blue .insight-box-title { color: var(--blue); }
        .insight-box.orange .insight-box-title { color: var(--orange); }
        
        /* Stat grid */
        .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .stat-card { background: var(--bg-elevated); border-radius: 14px; padding: 16px; }
        .stat-value { font-size: 28px; font-weight: 600; margin: 4px 0; }
        .stat-change { font-size: 13px; margin-top: 4px; }
        .stat-change.positive { color: var(--green); }
        .stat-change.negative { color: var(--red); }
        .stat-change.neutral { color: var(--text-tertiary); }
        
        /* Modals */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; opacity: 0; visibility: hidden; transition: all 0.25s; }
        .modal-overlay.open { opacity: 1; visibility: visible; }
        .modal-content { position: absolute; bottom: 0; left: 0; right: 0; max-height: 92vh; background: #0a0a0a; border-radius: 24px 24px 0 0; overflow-y: auto; transform: translateY(100%); transition: transform 0.3s ease-out; }
        .modal-overlay.open .modal-content { transform: translateY(0); }
        .modal-handle { width: 36px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin: 10px auto 0; }
        .modal-header { position: relative; padding: 40px 24px 24px; min-height: 200px; display: flex; flex-direction: column; justify-content: flex-end; }
        .modal-back { position: absolute; top: 16px; left: 16px; width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.4); border: none; color: white; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .modal-body { padding: 24px; }
        
        /* Nav */
        .nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,10,10,0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border); padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); display: flex; justify-content: space-around; z-index: 50; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 16px; background: none; border: none; color: var(--text-tertiary); font-size: 10px; font-weight: 500; cursor: pointer; }
        .nav-item.active { color: var(--blue); }
        .nav-item svg { width: 24px; height: 24px; }
        
        /* Session */
        .session-badge { display: inline-flex; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .session-badge.z2 { background: var(--green-dim); color: var(--green); }
        .session-badge.z4 { background: var(--orange-dim); color: var(--orange); }
        .session-badge.z5 { background: var(--red-dim); color: var(--red); }
        .session-badge.str { background: var(--purple-dim); color: var(--purple); }
        .session-badge.sim { background: var(--cyan-dim); color: var(--cyan); }
        .session-badge.rest { background: rgba(255,255,255,0.08); color: var(--text-secondary); }
        
        /* Limiter badge */
        .limiter-badge { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: var(--orange-dim); border: 1px solid rgba(255,159,10,0.3); border-radius: 12px; font-size: 13px; font-weight: 500; color: var(--orange); }
        
        /* Utility */
        .container { max-width: 500px; margin: 0 auto; padding-bottom: 100px; }
        .px-5 { padding-left: 20px; padding-right: 20px; }
        .py-4 { padding-top: 16px; padding-bottom: 16px; }
        .mb-3 { margin-bottom: 12px; }
        .mb-4 { margin-bottom: 16px; }
        .mb-5 { margin-bottom: 20px; }
        .mt-4 { margin-top: 16px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .flex { display: flex; }
        .flex-between { justify-content: space-between; }
        .flex-center { align-items: center; }
        .gap-3 { gap: 12px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .fade-up { animation: fadeUp 0.4s ease-out forwards; }
        .delay-1 { animation-delay: 0.05s; opacity: 0; }
        .delay-2 { animation-delay: 0.1s; opacity: 0; }
        .delay-3 { animation-delay: 0.15s; opacity: 0; }
        .delay-4 { animation-delay: 0.2s; opacity: 0; }
        .delay-5 { animation-delay: 0.25s; opacity: 0; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
const { useState, useEffect, useCallback, useMemo } = React;

// ============================================
// CONFIG
// ============================================
const SHEETS = { id: '1BlGGukORumWb7508lcu-SS0wF8lMwdOJEsOp-vGCKrc', workouts: 'Workouts', daily: 'DailyMetrics' };
const TARGETS = { vo2max: 48, twoKm: 465, threshold: 255, weeklyVol: 50, raceTime: 65 * 60, paceDecay: 5 };
const BASELINES = { vo2max: 43.5, twoKm: 540, threshold: 285, weeklyVol: 25 };

// ============================================
// UTILITIES
// ============================================
const storage = { get: (k, d) => { try { return JSON.parse(localStorage.getItem('hyrox11_'+k)) || d; } catch { return d; }}, set: (k, v) => localStorage.setItem('hyrox11_'+k, JSON.stringify(v)) };
const formatTime = (s) => s > 0 ? `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}` : '—';
const formatPace = (s) => s > 0 ? `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}/km` : '—';
const formatDuration = (m) => m >= 60 ? `${Math.floor(m/60)}h ${m%60}m` : `${m}min`;
const parseTime = (str) => { if (!str) return 0; const p = str.split(':'); return p.length === 2 ? parseInt(p[0])*60 + parseInt(p[1]) : 0; };
const mean = (arr) => arr.length ? arr.reduce((a,b) => a+b, 0) / arr.length : 0;
const stdDev = (arr) => { const m = mean(arr); return Math.sqrt(arr.reduce((s,v) => s + Math.pow(v-m, 2), 0) / arr.length); };

const parseSheetDate = (d) => {
    if (!d) return null;
    if (typeof d === 'string') return d;
    // Google Sheets Date format: "Date(2026,0,15)" where month is 0-indexed
    if (typeof d === 'string' && d.startsWith('Date(')) {
        const match = d.match(/Date\((\d+),(\d+),(\d+)\)/);
        if (match) return `${match[1]}-${String(parseInt(match[2])+1).padStart(2,'0')}-${match[3].padStart(2,'0')}`;
    }
    return d;
};

const fetchSheet = async (name) => {
    try {
        const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEETS.id}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}`);
        const txt = await res.text();
        const json = JSON.parse(txt.substring(47).slice(0,-2));
        const headers = json.table.cols.map(c => c.label || '');
        console.log(`[${name}] Headers:`, headers);
        const data = json.table.rows?.map(r => { 
            const o = {}; 
            r.c?.forEach((c,i) => { 
                if(headers[i]) {
                    // Use formatted value (f) for dates, otherwise use value (v)
                    if (headers[i] === 'Date') {
                        o[headers[i]] = c?.f || c?.v || null;
                    } else {
                        o[headers[i]] = c?.v ?? c?.f ?? null;
                    }
                }
            }); 
            return o; 
        }).filter(o => o['Date']) || [];
        console.log(`[${name}] Rows:`, data.length, 'Sample:', data.slice(0,2));
        return data;
    } catch (e) { console.error(`[${name}] Error:`, e); return []; }
};

// ============================================
// ANALYSIS ENGINE
// ============================================
const AnalysisEngine = {
    // Group data by week
    groupByWeek: (data, dateKey = 'Date') => {
        const weeks = {};
        data.forEach(d => {
            const date = new Date(d[dateKey]);
            const weekStart = new Date(date);
            weekStart.setDate(date.getDate() - date.getDay());
            const key = weekStart.toISOString().split('T')[0];
            if (!weeks[key]) weeks[key] = [];
            weeks[key].push(d);
        });
        return Object.entries(weeks).sort((a, b) => new Date(a[0]) - new Date(b[0])).map(([week, items]) => ({ week, items }));
    },
    
    // Group data by month
    groupByMonth: (data, dateKey = 'Date') => {
        const months = {};
        data.forEach(d => {
            const date = new Date(d[dateKey]);
            const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
            if (!months[key]) months[key] = [];
            months[key].push(d);
        });
        return Object.entries(months).sort((a, b) => a[0].localeCompare(b[0])).map(([month, items]) => ({ month, items }));
    },
    
    // Calculate weekly volume from workouts
    weeklyVolumes: (workouts) => {
        const weeks = AnalysisEngine.groupByWeek(workouts);
        return weeks.map(({ week, items }) => ({
            week,
            volume: items.reduce((s, w) => s + (parseFloat(w['Distance (km)']) || 0), 0),
            sessions: items.length,
            duration: items.reduce((s, w) => s + (parseFloat(w['Duration (min)']) || 0), 0),
        }));
    },
    
    // Calculate monthly stats
    monthlyStats: (workouts, dailyMetrics) => {
        const workoutMonths = AnalysisEngine.groupByMonth(workouts);
        const metricMonths = AnalysisEngine.groupByMonth(dailyMetrics);
        
        return workoutMonths.map(({ month, items }) => {
            const metrics = metricMonths.find(m => m.month === month)?.items || [];
            const vo2Values = metrics.map(m => parseFloat(m['VO2 Max'])).filter(Boolean);
            const hrValues = metrics.map(m => parseFloat(m['Resting HR'])).filter(Boolean);
            
            return {
                month,
                volume: items.reduce((s, w) => s + (parseFloat(w['Distance (km)']) || 0), 0),
                sessions: items.length,
                duration: items.reduce((s, w) => s + (parseFloat(w['Duration (min)']) || 0), 0),
                avgVo2: vo2Values.length ? mean(vo2Values) : null,
                endVo2: vo2Values.length ? vo2Values[vo2Values.length - 1] : null,
                avgHR: hrValues.length ? mean(hrValues) : null,
            };
        });
    },
    
    // Compare two periods
    comparePeriods: (data1, data2, metrics) => {
        const results = {};
        metrics.forEach(m => {
            const v1 = mean(data1.map(d => parseFloat(d[m])).filter(Boolean));
            const v2 = mean(data2.map(d => parseFloat(d[m])).filter(Boolean));
            const change = v1 > 0 ? ((v2 - v1) / v1) * 100 : 0;
            results[m] = { before: v1, after: v2, change, improved: m === 'Resting HR' ? change < 0 : change > 0 };
        });
        return results;
    },
    
    // Find correlations
    findCorrelations: (workouts, dailyMetrics) => {
        const monthly = AnalysisEngine.monthlyStats(workouts, dailyMetrics);
        const insights = [];
        
        // Volume vs VO2max correlation
        const volumeVo2Pairs = monthly.filter(m => m.volume > 0 && m.endVo2).map(m => ({ vol: m.volume, vo2: m.endVo2 }));
        if (volumeVo2Pairs.length >= 3) {
            const highVolMonths = volumeVo2Pairs.filter(p => p.vol >= 150);
            const lowVolMonths = volumeVo2Pairs.filter(p => p.vol < 150);
            if (highVolMonths.length > 0 && lowVolMonths.length > 0) {
                const highVolVo2 = mean(highVolMonths.map(p => p.vo2));
                const lowVolVo2 = mean(lowVolMonths.map(p => p.vo2));
                if (highVolVo2 > lowVolVo2) {
                    insights.push({ type: 'correlation', title: 'Volume drives VO₂max', detail: `Months with 150+ km averaged ${highVolVo2.toFixed(1)} VO₂max vs ${lowVolVo2.toFixed(1)} in lower volume months.`, impact: 'high', color: 'green' });
                }
            }
        }
        
        // Consistency analysis
        const weeklyVols = AnalysisEngine.weeklyVolumes(workouts);
        const consistentWeeks = weeklyVols.filter(w => w.volume >= 30).length;
        const totalWeeks = weeklyVols.length;
        const consistency = totalWeeks > 0 ? (consistentWeeks / totalWeeks) * 100 : 0;
        
        if (consistency < 60) {
            insights.push({ type: 'consistency', title: 'Consistency is your opportunity', detail: `Only ${consistency.toFixed(0)}% of weeks had 30+ km. More consistent training would accelerate gains.`, impact: 'high', color: 'orange' });
        } else if (consistency >= 80) {
            insights.push({ type: 'consistency', title: 'Great consistency', detail: `${consistency.toFixed(0)}% of weeks hit 30+ km. This consistency is driving your progress.`, impact: 'positive', color: 'green' });
        }
        
        return insights;
    },
    
    // Calculate progress rate
    progressRate: (history, key, weeks = 12) => {
        if (history.length < 2) return null;
        const recent = history.slice(-weeks);
        const first = parseFloat(recent[0]?.[key]);
        const last = parseFloat(recent[recent.length - 1]?.[key]);
        if (!first || !last) return null;
        
        const change = last - first;
        const weeklyRate = change / recent.length;
        const weeksToTarget = weeklyRate > 0 ? (TARGETS[key === 'VO2 Max' ? 'vo2max' : key] - last) / weeklyRate : null;
        
        return { first, last, change, weeklyRate, weeksToTarget, trend: change > 0.5 ? 'improving' : change < -0.5 ? 'declining' : 'stable' };
    }
};

// ============================================
// CHART COMPONENTS
// ============================================
const LineChart = ({ data, dataKey, color = 'var(--blue)', height = 180, showDots = true, label }) => {
    if (!data || data.length < 2) return <div style={{ height, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-tertiary)' }}>Not enough data</div>;
    
    const values = data.map(d => parseFloat(d[dataKey])).filter(Boolean);
    if (values.length < 2) return <div style={{ height, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-tertiary)' }}>Not enough data</div>;
    
    const min = Math.min(...values) * 0.95;
    const max = Math.max(...values) * 1.05;
    const range = max - min || 1;
    
    const width = 100;
    const h = height - 40;
    const points = values.map((v, i) => ({ x: (i / (values.length - 1)) * width, y: h - ((v - min) / range) * h }));
    const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
    const areaD = pathD + ` L ${width} ${h} L 0 ${h} Z`;
    
    return (
        <div style={{ height, position: 'relative' }}>
            <svg viewBox={`0 0 ${width} ${height}`} style={{ width: '100%', height: '100%' }} preserveAspectRatio="none">
                <defs>
                    <linearGradient id={`grad-${dataKey}`} x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor={color} stopOpacity="0.3" />
                        <stop offset="100%" stopColor={color} stopOpacity="0" />
                    </linearGradient>
                </defs>
                {/* Grid lines */}
                {[0, 0.25, 0.5, 0.75, 1].map((p, i) => (
                    <line key={i} x1="0" y1={p * h} x2={width} y2={p * h} className="chart-grid" />
                ))}
                {/* Area */}
                <path d={areaD} fill={`url(#grad-${dataKey})`} />
                {/* Line */}
                <path d={pathD} className="chart-line" stroke={color} />
                {/* Dots */}
                {showDots && points.length <= 30 && points.map((p, i) => (
                    <circle key={i} cx={p.x} cy={p.y} r="3" className="chart-dot" stroke={color} />
                ))}
                {/* Labels */}
                <text x="2" y={h + 14} className="chart-label">{data[0]?.week || data[0]?.month || ''}</text>
                <text x={width - 2} y={h + 14} className="chart-label" textAnchor="end">{data[data.length-1]?.week || data[data.length-1]?.month || ''}</text>
                <text x="2" y="10" className="chart-value">{max.toFixed(1)}</text>
                <text x="2" y={h - 4} className="chart-value">{min.toFixed(1)}</text>
            </svg>
            {label && <div style={{ position: 'absolute', top: 8, right: 8, fontSize: 12, color: 'var(--text-tertiary)' }}>{label}</div>}
        </div>
    );
};

const BarChart = ({ data, dataKey, color = 'var(--blue)', height = 120, label }) => {
    if (!data || data.length < 1) return <div style={{ height, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-tertiary)' }}>No data</div>;
    
    const values = data.map(d => parseFloat(d[dataKey]) || 0);
    const max = Math.max(...values) || 1;
    
    return (
        <div>
            {label && <p className="label" style={{ marginBottom: 12 }}>{label}</p>}
            <div className="bar-chart" style={{ height }}>
                {data.slice(-12).map((d, i) => (
                    <div key={i} className="bar" style={{ height: `${(values[data.length - 12 + i] / max) * 100}%`, background: color, opacity: i === data.length - 1 || i === 11 ? 1 : 0.6 }}>
                        {data.length <= 12 && <span className="bar-label">{d.week?.slice(5) || d.month?.slice(5) || ''}</span>}
                    </div>
                ))}
            </div>
        </div>
    );
};

// ============================================
const TimeToggle = ({ value, onChange }) => (
    <div className="time-toggle">
        {['3M', '6M', '1Y', 'All'].map(t => (
            <button key={t} className={value === t ? 'active' : ''} onClick={() => onChange(t)}>{t}</button>
        ))}

);

const StatCard = ({ label, value, unit, change, positive }) => (
    <div className="stat-card">
        <p className="label">{label}</p>
        <p className="stat-value">{value}{unit && <span className="unit">{unit}</span>}</p>
        {change !== undefined && change !== null && (
            <p className={`stat-change ${positive ? 'positive' : positive === false ? 'negative' : 'neutral'}`}>
                {change > 0 ? '+' : ''}{typeof change === 'number' ? change.toFixed(1) : change}

        )}

);

const InsightCard = ({ title, detail, color = 'blue' }) => (
    <div className={`insight-box ${color}`}>
        <p className="insight-box-title">{title}</p>
        <p className="insight">{detail}</p>

);

const MetricCard = ({ label, value, unit, insight, gradient, color, trend, onClick }) => (
    <div className={`card metric-card aurora ${gradient}`} onClick={onClick}>
        <div className="arrow">→</div>
        <div>
            <p className="label" style={{ marginBottom: 6 }}>{label}</p>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 4 }}>
                <span className="value-xl" style={{ color }}>{value}</span>
                {unit && <span className="unit">{unit}</span>}
            </div>
            {trend && <span className={`trend trend-${trend.type}`} style={{ marginTop: 8 }}>{trend.icon} {trend.text}</span>}
        </div>
        {insight && <p className="insight">{insight}</p>}
    </div>
);

const SessionCard = ({ session, isToday, onClick }) => (
    <div className={`card aurora grad-session`} onClick={onClick} style={{ padding: 20, cursor: 'pointer', border: isToday ? '1px solid var(--blue)' : '1px solid var(--border)' }}>
        <span className={`session-badge ${session.zone === 2 ? 'z2' : session.zone === 4 ? 'z4' : session.zone === 5 ? 'z5' : session.zone === 'str' ? 'str' : session.zone === 'sim' ? 'sim' : 'rest'}`}>
            {session.zone === 2 ? '🟢 Z2' : session.zone === 4 ? '🟠 Threshold' : session.zone === 5 ? '🔴 VO₂max' : session.zone === 'str' ? '💪 Strength' : session.zone === 'sim' ? '🏁 Sim' : '😴 Rest'}
        </span>
        <p style={{ fontSize: 22, fontWeight: 600, margin: '10px 0 4px' }}>{session.type}</p>
        <p className="insight">{session.duration > 0 ? formatDuration(session.duration) : 'Rest day'}{session.distance > 0 && ` · ${session.distance}km`}{isToday && ' · Today'}</p>
    </div>
);

const DataRow = ({ label, value, sub, trend }) => (
    <div className="data-row">
        <div><p style={{ color: 'var(--text-secondary)', fontSize: 14 }}>{label}</p>{sub && <p style={{ fontSize: 12, color: 'var(--text-tertiary)', marginTop: 2 }}>{sub}</p>}</div>
        <div style={{ textAlign: 'right' }}><p style={{ fontWeight: 600, fontSize: 16 }}>{value}</p>{trend && <span className={`trend trend-${trend.type}`} style={{ fontSize: 12, padding: '2px 8px', marginTop: 4 }}>{trend.text}</span>}</div>
    </div>
);

// ============================================
// SESSIONS
// ============================================
const SESSIONS = {
    easyRun: (mins, km) => ({ type: 'Easy Run', zone: 2, duration: mins, distance: km, purpose: 'Build aerobic base', structure: [{ block: 'Warm-up', time: '5 min', note: 'Walk to jog' }, { block: 'Main', time: `${mins-10} min`, note: 'Easy pace, HR 130-145' }, { block: 'Cool-down', time: '5 min', note: 'Jog to walk' }], targets: { hr: '130-145 bpm', pace: '5:30-6:30/km' } }),
    longRun: (mins) => ({ type: 'Long Run', zone: 2, duration: mins, distance: Math.round(mins/6), purpose: 'Build endurance', structure: [{ block: 'Easy start', time: '15 min', note: 'Very relaxed' }, { block: 'Main', time: `${mins-20} min`, note: 'Steady Z2' }, { block: 'Cool-down', time: '5 min', note: 'Easy' }], targets: { hr: '130-145 bpm', pace: '5:45-6:30/km' } }),
    threshold: (reps, mins) => ({ type: 'Threshold', zone: 4, duration: reps*mins + reps*2 + 20, purpose: 'Raise lactate threshold', structure: [{ block: 'Warm-up', time: '10 min', note: 'Easy + strides' }, { block: 'Main', time: `${reps}×${mins} min`, note: 'Threshold, 2min jog' }, { block: 'Cool-down', time: '10 min', note: 'Easy' }], targets: { hr: '160-170 bpm', pace: '4:20-4:50/km' } }),
    vo2max: (reps, mins) => ({ type: 'VO₂max Intervals', zone: 5, duration: reps*mins + reps*3 + 20, purpose: 'Expand aerobic ceiling', structure: [{ block: 'Warm-up', time: '10 min', note: 'Easy + strides' }, { block: 'Main', time: `${reps}×${mins} min`, note: 'Hard, 3min easy' }, { block: 'Cool-down', time: '10 min', note: 'Easy' }], targets: { hr: '170-185 bpm', pace: '3:50-4:20/km' } }),
    strength: (focus) => ({ type: `Strength: ${focus}`, zone: 'str', duration: 45, purpose: focus === 'Lower' ? 'Leg strength' : 'Upper body for stations', structure: [{ block: 'Warm-up', time: '8 min', note: 'Bike + dynamic' }, { block: 'Main', time: '30 min', note: 'See exercises' }, { block: 'Cool-down', time: '7 min', note: 'Stretch' }], exercises: focus === 'Lower' ? ['Back Squat 4×6-8', 'RDL 3×8-10', 'Lunges 3×12', 'Calf Raises 3×15'] : ['Pull-ups 4×6-10', 'DB Row 3×10', 'Push Press 3×8', 'Wall Balls 3×20'] }),
    rest: () => ({ type: 'Rest', zone: 'rest', duration: 0, purpose: 'Recovery' }),
};

const getWeekPlan = () => [
    { day: 'Mon', ...SESSIONS.easyRun(45, 7) },
    { day: 'Tue', ...SESSIONS.strength('Lower') },
    { day: 'Wed', ...SESSIONS.easyRun(40, 6) },
    { day: 'Thu', ...SESSIONS.easyRun(45, 7) },
    { day: 'Fri', ...SESSIONS.strength('Upper') },
    { day: 'Sat', ...SESSIONS.longRun(75) },
    { day: 'Sun', ...SESSIONS.rest() },
];

// ============================================
// MAIN APP
// ============================================
function App() {
    const [tab, setTab] = useState('home');
    const [workouts, setWorkouts] = useState([]);
    const [daily, setDaily] = useState([]);
    const [tests, setTests] = useState(() => storage.get('tests', { twoKm: [], threshold: [], miniSim: [] }));
    const [profile] = useState(() => storage.get('profile', { name: 'Lad', hrBaseline: 55, raceDate: '2027-04-15' }));
    const [modal, setModal] = useState(null);
    const [historyRange, setHistoryRange] = useState('6M');
    
    useEffect(() => { storage.set('tests', tests); }, [tests]);
    useEffect(() => {
        Promise.all([fetchSheet('Workouts'), fetchSheet('DailyMetrics')]).then(([w, d]) => { setWorkouts(w); setDaily(d); });
    }, []);
    
    const now = Date.now();
    const daysAgo = (d) => now - d * 24 * 60 * 60 * 1000;
    
    // Filter data by range
    const filterByRange = useCallback((data, range) => {
        const days = { '3M': 90, '6M': 180, '1Y': 365, 'All': 9999 }[range] || 180;
        return data.filter(d => new Date(d['Date']) >= daysAgo(days));
    }, [now]);
    
    // Latest metrics
    const latestDaily = useMemo(() => {
        const sorted = [...daily].sort((a, b) => new Date(b['Date']) - new Date(a['Date']));
        return {
            restingHR: parseFloat(sorted.find(d => d['Resting HR'])?.['Resting HR']) || 55,
            hrv: parseFloat(sorted.find(d => d['HRV (ms)'])?.['HRV (ms)']) || 0,
            vo2max: parseFloat(sorted.find(d => d['VO2 Max'])?.['VO2 Max']) || 43.5,
            sleep: parseFloat(sorted.find(d => d['Sleep Duration (hr)'])?.['Sleep Duration (hr)']) || 0,
        };
    }, [daily]);
    
    // Weekly stats
    const workoutStats = useMemo(() => {
        const last7 = workouts.filter(w => new Date(w['Date']) >= daysAgo(7));
        const weeklyVol = last7.reduce((s, w) => s + (parseFloat(w['Distance (km)']) || 0), 0);
        return { weeklyVol };
    }, [workouts, now]);
    
    // Historical analysis
    const historicalData = useMemo(() => {
        const filteredWorkouts = filterByRange(workouts, historyRange);
        const filteredDaily = filterByRange(daily, historyRange);
        
        const weeklyVols = AnalysisEngine.weeklyVolumes(filteredWorkouts);
        const monthlyStats = AnalysisEngine.monthlyStats(filteredWorkouts, filteredDaily);
        const vo2Progress = AnalysisEngine.progressRate(filteredDaily, 'VO2 Max');
        const correlations = AnalysisEngine.findCorrelations(filteredWorkouts, filteredDaily);
        
        // Period comparison (last half vs first half)
        const midpoint = Math.floor(filteredDaily.length / 2);
        const firstHalf = filteredDaily.slice(0, midpoint);
        const secondHalf = filteredDaily.slice(midpoint);
        const comparison = AnalysisEngine.comparePeriods(firstHalf, secondHalf, ['VO2 Max', 'Resting HR']);
        
        // Summary stats
        const totalVolume = weeklyVols.reduce((s, w) => s + w.volume, 0);
        const avgWeeklyVol = weeklyVols.length ? totalVolume / weeklyVols.length : 0;
        const peakWeek = Math.max(...weeklyVols.map(w => w.volume));
        const totalSessions = filteredWorkouts.length;
        
        return { weeklyVols, monthlyStats, vo2Progress, correlations, comparison, totalVolume, avgWeeklyVol, peakWeek, totalSessions };
    }, [workouts, daily, historyRange, filterByRange]);
    
    // Week plan
    const weekPlan = useMemo(() => getWeekPlan(), []);
    const todayName = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][new Date().getDay()];
    const todaySession = weekPlan.find(d => d.day === todayName);
    const daysToRace = Math.max(0, Math.floor((new Date(profile.raceDate) - now) / 86400000));
    
    // ============================================
    // HOME TAB
    // ============================================
    const renderHome = () => (
        <div className="container hide-scrollbar">
            <div className="px-5 py-4">
                <p style={{ fontSize: 13, color: 'var(--text-tertiary)' }}>Welcome back</p>
                <h1 style={{ fontSize: 28, fontWeight: 600 }}>{profile.name}</h1>
            </div>
            
            <div className="px-5 mb-4 fade-up">
                <p className="label" style={{ marginBottom: 10 }}>TODAY'S SESSION</p>
                <SessionCard session={todaySession} isToday onClick={() => setModal({ type: 'session', data: todaySession })} />
            </div>
            
            <div className="px-5 mb-4">
                <div className="grid-2 fade-up delay-1">
                    <MetricCard label="VO₂max" value={latestDaily.vo2max?.toFixed(1)} gradient="grad-aerobic" color="var(--green)"
                        trend={historicalData.vo2Progress?.trend === 'improving' ? { type: 'up', icon: '↑', text: `+${historicalData.vo2Progress.change?.toFixed(1)}` } : { type: 'stable', icon: '→', text: 'Stable' }}
                        insight={`Target: ${TARGETS.vo2max}`} onClick={() => setTab('history')} />
                    <MetricCard label="Weekly Volume" value={workoutStats.weeklyVol?.toFixed(0)} unit="km" gradient="grad-race" color="var(--orange)"
                        insight={`Target: ${TARGETS.weeklyVol}km`} onClick={() => setTab('history')} />
                </div>
            </div>
            
            <div className="px-5 mb-4 fade-up delay-2">
                <div className="card" style={{ padding: 20 }}>
                    <div className="flex flex-between flex-center">
                        <div>
                            <p className="label">MALAGA 2027</p>
                            <p style={{ fontSize: 36, fontWeight: 300, marginTop: 4 }}>{daysToRace} <span style={{ fontSize: 16, color: 'var(--text-tertiary)' }}>days</span></p>
                        </div>
                        <div style={{ textAlign: 'right' }}>
                            <p style={{ fontSize: 13, color: 'var(--text-secondary)' }}>Target</p>
                            <p style={{ fontSize: 28, fontWeight: 600, color: 'var(--green)' }}>1:05</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div className="px-5 fade-up delay-3">
                <p className="label" style={{ marginBottom: 10 }}>QUICK STATS</p>
                <div className="stat-grid">
                    <StatCard label="Resting HR" value={latestDaily.restingHR?.toFixed(0)} unit=" bpm" />
                    <StatCard label="HRV" value={latestDaily.hrv?.toFixed(0) || '—'} unit=" ms" />
                </div>
            </div>
        </div>
    );
    
    // ============================================
    // PLAN TAB
    // ============================================
    const renderPlan = () => (
        <div className="container hide-scrollbar">
            <div className="px-5 py-4">
                <h1 style={{ fontSize: 28, fontWeight: 600 }}>This Week</h1>
                <p style={{ color: 'var(--text-secondary)' }}>Base Phase</p>
            </div>
            <div className="px-5" style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                {weekPlan.map((item, i) => (
                    <div key={i} className="card" style={{ padding: 16, cursor: 'pointer', border: item.day === todayName ? '1px solid var(--blue)' : '1px solid var(--border)' }} onClick={() => setModal({ type: 'session', data: item })}>
                        <div className="flex flex-between flex-center">
                            <div>
                                <p style={{ fontSize: 12, color: 'var(--text-tertiary)', marginBottom: 4 }}>{item.day}{item.day === todayName && ' · Today'}</p>
                                <p style={{ fontWeight: 500 }}>{item.type}</p>
                            </div>
                            <span className={`session-badge ${item.zone === 2 ? 'z2' : item.zone === 4 ? 'z4' : item.zone === 5 ? 'z5' : item.zone === 'str' ? 'str' : item.zone === 'sim' ? 'sim' : 'rest'}`} style={{ padding: '4px 10px', fontSize: 11 }}>
                                {item.zone === 2 ? 'Z2' : item.zone === 4 ? 'Z4' : item.zone === 5 ? 'Z5' : item.zone === 'str' ? 'STR' : item.zone === 'sim' ? 'SIM' : 'REST'}
                            </span>
                        </div>
                    </div>
                ))}
            </div>
        </div>
    );
    
    // ============================================
    // HISTORY TAB
    // ============================================
    const renderHistory = () => (
        <div className="container hide-scrollbar">
            <div className="px-5 py-4">
                <h1 style={{ fontSize: 28, fontWeight: 600 }}>History</h1>
                <p style={{ color: 'var(--text-secondary)' }}>Your training journey</p>
            </div>
            
            <div className="px-5 mb-4">
                <TimeToggle value={historyRange} onChange={setHistoryRange} />
            </div>
            
            {/* Summary Stats */}
            <div className="px-5 mb-4 fade-up">
                <p className="label" style={{ marginBottom: 12 }}>PERIOD SUMMARY</p>
                <div className="stat-grid">
                    <StatCard label="Total Volume" value={historicalData.totalVolume?.toFixed(0)} unit=" km" />
                    <StatCard label="Avg Weekly" value={historicalData.avgWeeklyVol?.toFixed(1)} unit=" km" />
                    <StatCard label="Peak Week" value={historicalData.peakWeek?.toFixed(0)} unit=" km" />
                    <StatCard label="Sessions" value={historicalData.totalSessions} />
                </div>
            </div>
            
            {/* VO2max Trend */}
            <div className="px-5 mb-4 fade-up delay-1">
                <div className="card" style={{ padding: 20 }}>
                    <div className="flex flex-between flex-center" style={{ marginBottom: 4 }}>
                        <p className="label">VO₂MAX JOURNEY</p>
                        {historicalData.vo2Progress && (
                            <span className={`trend trend-${historicalData.vo2Progress.trend === 'improving' ? 'up' : historicalData.vo2Progress.trend === 'declining' ? 'down' : 'stable'}`}>
                                {historicalData.vo2Progress.change > 0 ? '+' : ''}{historicalData.vo2Progress.change?.toFixed(1)}
                            </span>
                        )}
                    </div>
                    <LineChart data={filterByRange(daily, historyRange).filter(d => d['VO2 Max'])} dataKey="VO2 Max" color="var(--green)" height={180} />
                    {historicalData.vo2Progress?.weeksToTarget && historicalData.vo2Progress.weeksToTarget > 0 && historicalData.vo2Progress.weeksToTarget < 100 && (
                        <p className="insight" style={{ marginTop: 12 }}>At current rate, you'll hit target in ~{Math.round(historicalData.vo2Progress.weeksToTarget)} weeks</p>
                    )}
                </div>
            </div>
            
            {/* Weekly Volume */}
            <div className="px-5 mb-4 fade-up delay-2">
                <div className="card" style={{ padding: 20 }}>
                    <p className="label" style={{ marginBottom: 16 }}>WEEKLY VOLUME</p>
                    <BarChart data={historicalData.weeklyVols} dataKey="volume" color="var(--blue)" height={100} />
                </div>
            </div>
            
            {/* Monthly Breakdown */}
            {historicalData.monthlyStats.length > 0 && (
                <div className="px-5 mb-4 fade-up delay-3">
                    <div className="card" style={{ padding: 20 }}>
                        <p className="label" style={{ marginBottom: 16 }}>MONTHLY BREAKDOWN</p>
                        {historicalData.monthlyStats.slice(-6).map((m, i) => (
                            <DataRow key={i} 
                                label={new Date(m.month + '-01').toLocaleDateString('en', { month: 'short', year: 'numeric' })} 
                                value={`${m.volume.toFixed(0)} km`}
                                sub={`${m.sessions} sessions`}
                                trend={m.endVo2 ? { type: 'neutral', text: `VO₂ ${m.endVo2.toFixed(1)}` } : null}
                            />
                        ))}
                    </div>
                </div>
            )}
            
            {/* Period Comparison */}
            {historicalData.comparison?.['VO2 Max']?.before > 0 && (
                <div className="px-5 mb-4 fade-up delay-4">
                    <div className="card">
                        <p className="label" style={{ padding: '20px 20px 12px' }}>FIRST HALF vs SECOND HALF</p>
                        <div className="compare-card">
                            <div className="compare-period">
                                <p style={{ fontSize: 24, fontWeight: 600 }}>{historicalData.comparison['VO2 Max'].before.toFixed(1)}</p>
                                <p className="label">VO₂ Before</p>
                            </div>
                            <div className="compare-vs">→</div>
                            <div className="compare-period">
                                <p style={{ fontSize: 24, fontWeight: 600, color: historicalData.comparison['VO2 Max'].improved ? 'var(--green)' : 'var(--text)' }}>{historicalData.comparison['VO2 Max'].after.toFixed(1)}</p>
                                <p className="label">VO₂ After</p>
                            </div>
                        </div>
                    </div>
                </div>
            )}
            
            {/* Insights */}
            {historicalData.correlations.length > 0 && (
                <div className="px-5 mb-4 fade-up delay-5">
                    <p className="label" style={{ marginBottom: 12 }}>KEY INSIGHTS</p>
                    {historicalData.correlations.map((insight, i) => (
                        <InsightCard key={i} title={insight.title} detail={insight.detail} color={insight.color} />
                    ))}
                </div>
            )}
        </div>
    );
    
    // ============================================
    // SESSION MODAL
    // ============================================
    const SessionModal = ({ session, onClose }) => (
        <div className="modal-overlay open" onClick={onClose}>
            <div className="modal-content hide-scrollbar" onClick={e => e.stopPropagation()}>
                <div className="modal-handle" />
                <div className={`modal-header grad-session aurora`}>
                    <button className="modal-back" onClick={onClose}>←</button>
                    <span className={`session-badge ${session.zone === 2 ? 'z2' : session.zone === 4 ? 'z4' : session.zone === 5 ? 'z5' : session.zone === 'str' ? 'str' : session.zone === 'sim' ? 'sim' : 'rest'}`}>{session.zone === 2 ? '🟢 Z2' : session.zone === 4 ? '🟠 Threshold' : session.zone === 5 ? '🔴 VO₂max' : session.zone === 'str' ? '💪 Strength' : session.zone === 'sim' ? '🏁 Sim' : '😴 Rest'}</span>
                    <p style={{ fontSize: 28, fontWeight: 600, marginTop: 12 }}>{session.type}</p>
                    <p style={{ fontSize: 15, color: 'var(--text-secondary)', marginTop: 6 }}>{session.duration > 0 ? formatDuration(session.duration) : 'Rest day'}{session.distance > 0 && ` · ${session.distance}km`}</p>
                </div>
                <div className="modal-body">
                    <div style={{ padding: 16, background: 'var(--bg-elevated)', borderRadius: 14, marginBottom: 24 }}>
                        <p style={{ fontWeight: 500, marginBottom: 6 }}>Purpose</p>
                        <p className="insight">{session.purpose}</p>
                    </div>
                    {session.structure && (
                        <>
                            <p className="label" style={{ marginBottom: 16 }}>SESSION STRUCTURE</p>
                            {session.structure.map((s, i) => <DataRow key={i} label={s.block} sub={s.note} value={s.time} />)}
                        </>
                    )}
                    {session.exercises && (
                        <>
                            <p className="label" style={{ marginBottom: 16, marginTop: 24 }}>EXERCISES</p>
                            {session.exercises.map((ex, i) => <div key={i} style={{ padding: '12px 0', borderBottom: '1px solid var(--border)' }}>{ex}</div>)}
                        </>
                    )}
                    {session.targets && (
                        <>
                            <p className="label" style={{ marginBottom: 16, marginTop: 24 }}>TARGETS</p>
                            {Object.entries(session.targets).map(([k, v]) => <DataRow key={k} label={k} value={v} />)}
                        </>
                    )}
                </div>
            </div>
        </div>
    );
    
    // ============================================
    // RENDER
    // ============================================
    return (
        <>
            {tab === 'home' && renderHome()}
            {tab === 'plan' && renderPlan()}
            {tab === 'history' && renderHistory()}
            
            <nav className="nav">
                <button className={`nav-item ${tab === 'home' ? 'active' : ''}`} onClick={() => setTab('home')}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span>Home</span>
                </button>
                <button className={`nav-item ${tab === 'plan' ? 'active' : ''}`} onClick={() => setTab('plan')}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                    <span>Plan</span>
                </button>
                <button className={`nav-item ${tab === 'history' ? 'active' : ''}`} onClick={() => setTab('history')}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                    <span>History</span>
                </button>
            </nav>
            
            {modal?.type === 'session' && <SessionModal session={modal.data} onClose={() => setModal(null)} />}
        </>
    );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
    </script>
</body>
</html>
