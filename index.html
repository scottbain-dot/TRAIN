<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HYROX ENGINE</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'bebas': ['Bebas Neue', 'sans-serif'], 'mono': ['JetBrains Mono', 'monospace'] },
                    colors: {
                        'hyrox': { 'bg': '#0a0a0a', 'card': '#1a1a1a', 'elevated': '#222222', 'border': '#2a2a2a', 'red': '#FF3131', 'orange': '#FF6B35' },
                        'zone': { 1: '#3B82F6', 2: '#22C55E', 3: '#EAB308', 4: '#F97316', 5: '#EF4444' }
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: #0a0a0a; color: white; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .gradient-red { background: linear-gradient(135deg, #FF3131 0%, #FF6B35 100%); }
        .gradient-text { background: linear-gradient(135deg, #FF3131 0%, #FF6B35 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .slide-up { animation: slide-up 0.3s ease-out; }
        @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 5px rgba(255,49,49,0.3); } 50% { box-shadow: 0 0 20px rgba(255,49,49,0.6); } }
        .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spin { animation: spin 1s linear infinite; }
    </style>
</head>
<body class="bg-hyrox-bg min-h-screen">
    <div id="app"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // ============================================
        // GOOGLE SHEETS CONFIG
        // ============================================
        const SHEETS_CONFIG = {
            sheetId: '1BlGGukORumWb7508lcu-SS0wF8lMwdOJEsOp-vGCKrc',
            sheets: {
                workouts: 'Workouts',
                daily: 'DailyMetrics', 
                profile: 'Profile',
                plan: 'WeeklyPlan'
            }
        };

        // ============================================
        // FLEXIBLE DATA EXTRACTION - handles various header names
        // ============================================
        const getValue = (row, ...possibleKeys) => {
            for (const key of possibleKeys) {
                // Try exact match
                if (row[key] !== undefined && row[key] !== null && row[key] !== '') {
                    return row[key];
                }
                // Try case-insensitive match
                const lowerKey = key.toLowerCase();
                for (const rowKey of Object.keys(row)) {
                    if (rowKey.toLowerCase() === lowerKey || rowKey.toLowerCase().includes(lowerKey.replace(/[^a-z0-9]/g, ''))) {
                        if (row[rowKey] !== undefined && row[rowKey] !== null && row[rowKey] !== '') {
                            return row[rowKey];
                        }
                    }
                }
            }
            return null;
        };

        // Normalize workout data
        const normalizeWorkout = (row) => ({
            date: getValue(row, 'Date', 'date'),
            type: getValue(row, 'Workout Type', 'WorkoutType', 'type'),
            duration: parseFloat(getValue(row, 'Duration (min)', 'Duration', 'duration')) || 0,
            distance: parseFloat(getValue(row, 'Distance (km)', 'Distance', 'distance')) || 0,
            calories: parseFloat(getValue(row, 'Calories', 'calories')) || 0,
            avgHR: parseFloat(getValue(row, 'Avg HR', 'AvgHR', 'avgHR', 'Average HR')) || 0,
            maxHR: parseFloat(getValue(row, 'Max HR', 'MaxHR', 'maxHR', 'Maximum HR')) || 0,
            avgPace: parseFloat(getValue(row, 'Avg Pace (sec/km)', 'Avg Pace', 'avgPace', 'pace')) || 0,
            elevation: parseFloat(getValue(row, 'Elevation Gain', 'elevation')) || 0,
            startTime: getValue(row, 'Start Time', 'startTime'),
            endTime: getValue(row, 'End Time', 'endTime'),
            source: getValue(row, 'Source', 'source')
        });

        // Normalize daily metrics data
        const normalizeDailyMetric = (row) => ({
            date: getValue(row, 'Date', 'date'),
            restingHR: parseFloat(getValue(row, 'Resting HR', 'RestingHR', 'restingHR')) || 0,
            hrv: parseFloat(getValue(row, 'HRV (ms)', 'HRV', 'hrv')) || 0,
            vo2Max: parseFloat(getValue(row, 'VO2 Max', 'VO2Max', 'vo2Max', 'VO2')) || 0,
            sleepDuration: parseFloat(getValue(row, 'Sleep Duration (hr)', 'Sleep Duration', 'sleepDuration', 'Sleep')) || 0,
            deepSleep: parseFloat(getValue(row, 'Deep Sleep (hr)', 'Deep Sleep', 'deepSleep')) || 0,
            remSleep: parseFloat(getValue(row, 'REM Sleep (hr)', 'REM Sleep', 'remSleep')) || 0,
            walkingHR: parseFloat(getValue(row, 'Walking HR Avg', 'Walking HR', 'walkingHR', 'WalkingHR')) || 0,
            steps: parseFloat(getValue(row, 'Steps', 'steps')) || 0,
            activeCalories: parseFloat(getValue(row, 'Active Calories', 'ActiveCalories', 'activeCalories')) || 0,
            weight: parseFloat(getValue(row, 'Weight (kg)', 'Weight', 'weight')) || 0
        });

        // ============================================
        // DATA FETCHING
        // ============================================
        const fetchSheetData = async (sheetName) => {
            if (!SHEETS_CONFIG.sheetId) return null;
            
            const url = `https://docs.google.com/spreadsheets/d/${SHEETS_CONFIG.sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
            
            try {
                const response = await fetch(url);
                const text = await response.text();
                // Google returns JSONP, extract JSON
                const json = JSON.parse(text.substring(47).slice(0, -2));
                
                if (!json.table || !json.table.rows) return [];
                
                const headers = json.table.cols.map(col => col.label || '');
                console.log(`Headers for ${sheetName}:`, headers);
                
                const rows = json.table.rows.map(row => {
                    const obj = {};
                    row.c?.forEach((cell, i) => {
                        if (headers[i]) {
                            obj[headers[i]] = cell?.v ?? cell?.f ?? null;
                        }
                    });
                    return obj;
                });
                
                console.log(`First row of ${sheetName}:`, rows[0]);
                return rows;
            } catch (err) {
                console.error(`Error fetching ${sheetName}:`, err);
                return null;
            }
        };

        const fetchAllData = async () => {
            const [workoutsRaw, dailyRaw, profile, plan] = await Promise.all([
                fetchSheetData(SHEETS_CONFIG.sheets.workouts),
                fetchSheetData(SHEETS_CONFIG.sheets.daily),
                fetchSheetData(SHEETS_CONFIG.sheets.profile),
                fetchSheetData(SHEETS_CONFIG.sheets.plan)
            ]);
            
            // Normalize the data
            const workouts = workoutsRaw ? workoutsRaw.map(normalizeWorkout).filter(w => w.date) : [];
            const daily = dailyRaw ? dailyRaw.map(normalizeDailyMetric).filter(d => d.date) : [];
            
            console.log('Normalized workouts:', workouts.slice(0, 3));
            console.log('Normalized daily:', daily.slice(0, 3));
            
            return { workouts, daily, profile, plan };
        };

        // ============================================
        // INTELLIGENCE ENGINE
        // ============================================
        const HyroxIntelligence = {
            classifyWorkout: (workout, zones) => {
                const avgHR = workout.avgHR;
                if (!avgHR || !zones) return 'unknown';
                
                if (avgHR <= zones.z2Max) return 'zone2';
                if (avgHR <= zones.z3Max) return 'tempo';
                if (avgHR <= zones.z4Max) return 'threshold';
                return 'vo2max';
            },

            calculateReadiness: (dailyMetrics, profile) => {
                if (!dailyMetrics || dailyMetrics.length === 0) return null;
                
                // Sort by date and get most recent
                const sorted = [...dailyMetrics].sort((a, b) => new Date(b.date) - new Date(a.date));
                const today = sorted[0];
                
                if (!today) return null;
                
                const restingHR = today.restingHR;
                const hrv = today.hrv;
                const sleep = today.sleepDuration;
                
                const baselineHR = profile?.restingHRBaseline || 55;
                const baselineHRV = 50;
                
                let score = 100;
                
                if (restingHR > 0) {
                    const hrDiff = restingHR - baselineHR;
                    score -= Math.min(20, Math.max(-10, hrDiff * 3));
                }
                
                if (hrv > 0) {
                    const hrvDiff = hrv - baselineHRV;
                    score += Math.min(15, Math.max(-20, hrvDiff * 0.3));
                }
                
                if (sleep > 0) {
                    if (sleep < 6) score -= 20;
                    else if (sleep < 7) score -= 10;
                    else if (sleep >= 8) score += 10;
                }
                
                return Math.max(0, Math.min(100, Math.round(score)));
            },

            analyzeDistribution: (workouts, zones) => {
                if (!workouts || workouts.length === 0) {
                    return { z2Pct: 0, z3Pct: 0, z45Pct: 0, simPct: 0, isHealthy: true, totalMinutes: 0 };
                }
                
                let z2 = 0, z3 = 0, z45 = 0, sim = 0;
                const defaultZones = { z2Max: 141, z3Max: 153, z4Max: 165 };
                const z = zones || defaultZones;
                
                workouts.forEach(w => {
                    const duration = w.duration || 0;
                    const type = (w.type || '').toLowerCase();
                    const avgHR = w.avgHR || 0;
                    
                    if (type.includes('hyrox') || type.includes('simulation') || type.includes('functional')) {
                        sim += duration;
                        return;
                    }
                    
                    if (avgHR > 0) {
                        if (avgHR <= z.z2Max) z2 += duration;
                        else if (avgHR <= z.z3Max) z3 += duration;
                        else z45 += duration;
                    } else {
                        if (type.includes('walk') || type.includes('easy')) z2 += duration;
                        else if (type.includes('run') || type.includes('indoor')) z2 += duration;
                        else if (type.includes('cross') || type.includes('row') || type.includes('ellip') || type.includes('stair') || type.includes('climb')) z3 += duration;
                        else z2 += duration;
                    }
                });
                
                const total = z2 + z3 + z45 + sim;
                if (total === 0) return { z2Pct: 0, z3Pct: 0, z45Pct: 0, simPct: 0, isHealthy: true, totalMinutes: 0 };
                
                const z2Pct = Math.round((z2 / total) * 100);
                const z3Pct = Math.round((z3 / total) * 100);
                const z45Pct = Math.round((z45 / total) * 100);
                const simPct = Math.round((sim / total) * 100);
                const isHealthy = z2Pct >= 60 && simPct <= 15;
                
                return { z2Pct, z3Pct, z45Pct, simPct, isHealthy, totalMinutes: total };
            },

            predictRaceTime: (z2PaceSecKm, weeklyVolumeKm, simulationsPerMonth) => {
                const z2PaceMin = z2PaceSecKm / 60;
                const monthlyVolume = weeklyVolumeKm * 4;
                const predictedMin = 40 + (8 * z2PaceMin) - (0.02 * monthlyVolume) + (0.5 * simulationsPerMonth);
                return {
                    predicted: Math.round(predictedMin),
                    range: { low: Math.round(predictedMin - 5), high: Math.round(predictedMin + 5) }
                };
            },

            getRestingHRTrend: (dailyMetrics, days = 7) => {
                if (!dailyMetrics || dailyMetrics.length < 2) return null;
                
                const sorted = [...dailyMetrics].sort((a, b) => new Date(b.date) - new Date(a.date));
                const recent = sorted.slice(0, days);
                const values = recent.map(d => d.restingHR).filter(v => v > 0);
                
                if (values.length < 2) return null;
                
                const avg = values.reduce((a, b) => a + b, 0) / values.length;
                const firstHalf = values.slice(0, Math.floor(values.length / 2));
                const secondHalf = values.slice(Math.floor(values.length / 2));
                
                const firstAvg = firstHalf.reduce((a, b) => a + b, 0) / firstHalf.length;
                const secondAvg = secondHalf.reduce((a, b) => a + b, 0) / secondHalf.length;
                
                return {
                    current: values[0],
                    average: Math.round(avg),
                    trend: secondAvg - firstAvg > 2 ? 'rising' : secondAvg - firstAvg < -2 ? 'falling' : 'stable'
                };
            },

            generateInsights: (workouts, dailyMetrics, profile, zones) => {
                const insights = [];
                const now = Date.now();
                const cutoff7 = now - (7 * 24 * 60 * 60 * 1000);
                const cutoff30 = now - (30 * 24 * 60 * 60 * 1000);
                
                const last7Workouts = (workouts || []).filter(w => new Date(w.date) >= cutoff7);
                const last30Workouts = (workouts || []).filter(w => new Date(w.date) >= cutoff30);
                
                const weeklyVol = last7Workouts.reduce((s, w) => s + (w.distance || 0), 0);
                const targetVol = profile?.weeklyVolumeTarget || 50;
                
                if (weeklyVol < targetVol * 0.7 && last7Workouts.length > 0) {
                    insights.push({
                        type: 'warning',
                        title: 'Volume Below Target',
                        message: `${weeklyVol.toFixed(1)}km this week vs ${targetVol}km target`,
                        action: 'Add more easy running — biggest lever for improvement'
                    });
                } else if (weeklyVol >= targetVol) {
                    insights.push({
                        type: 'success',
                        title: 'Volume On Track',
                        message: `${weeklyVol.toFixed(1)}km this week — building that base`
                    });
                }
                
                const dist = HyroxIntelligence.analyzeDistribution(last30Workouts, zones);
                
                if (dist.simPct > 10) {
                    insights.push({
                        type: 'warning',
                        title: 'Too Many Simulations',
                        message: `${dist.simPct}% race-pace — Brownlee says this hurts performance`,
                        action: 'Cut to 1-2 per month, build instead of test'
                    });
                }
                
                const hrTrend = HyroxIntelligence.getRestingHRTrend(dailyMetrics);
                if (hrTrend?.trend === 'rising') {
                    insights.push({
                        type: 'warning',
                        title: 'Resting HR Rising',
                        message: `HR trending up — possible fatigue or stress`,
                        action: 'Consider an easy day or rest'
                    });
                } else if (hrTrend?.trend === 'falling') {
                    insights.push({
                        type: 'success',
                        title: 'Recovery Looking Good',
                        message: `Resting HR trending down — fitness improving`
                    });
                }
                
                return insights;
            }
        };

        // ============================================
        // WEEKLY PLAN
        // ============================================
        const DEFAULT_PLAN = [
            { day: 0, name: 'Sunday', type: 'rest', label: 'Rest / Stations', duration: 0, distance: 0, zone: null },
            { day: 1, name: 'Monday', type: 'zone2', label: 'Easy Run', duration: 50, distance: 8.5, zone: 2 },
            { day: 2, name: 'Tuesday', type: 'strength', label: 'Strength A', duration: 45, distance: 0, zone: null },
            { day: 3, name: 'Wednesday', type: 'zone2', label: 'Easy Run', duration: 45, distance: 7.5, zone: 2 },
            { day: 4, name: 'Thursday', type: 'vo2max', label: 'VO₂max Intervals', duration: 45, distance: 8, zone: 5 },
            { day: 5, name: 'Friday', type: 'strength', label: 'Strength B', duration: 45, distance: 0, zone: null },
            { day: 6, name: 'Saturday', type: 'long', label: 'Long Run', duration: 90, distance: 15, zone: 2 },
        ];

        // ============================================
        // MAIN APP
        // ============================================
        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [loading, setLoading] = useState(true);
            const [lastSync, setLastSync] = useState(null);
            const [showSettings, setShowSettings] = useState(false);
            
            const [workouts, setWorkouts] = useState([]);
            const [dailyMetrics, setDailyMetrics] = useState([]);
            const [profile, setProfile] = useState({});
            const [plan, setPlan] = useState(DEFAULT_PLAN);
            
            const [localProfile, setLocalProfile] = useState(() => {
                const saved = localStorage.getItem('hyrox_local_profile');
                return saved ? JSON.parse(saved) : {
                    name: 'Lad',
                    restingHRBaseline: 55,
                    z2Pace: 360,
                    weeklyVolumeTarget: 50,
                    currentPB: '1:17:18',
                    race: { name: 'HYROX Cologne', date: '2026-08-15', targetTime: '1:05:00' },
                    zones: { z1Max: 129, z2Max: 141, z3Max: 153, z4Max: 165, z5Max: 183 }
                };
            });

            useEffect(() => {
                localStorage.setItem('hyrox_local_profile', JSON.stringify(localProfile));
            }, [localProfile]);

            const syncData = useCallback(async () => {
                setLoading(true);
                
                try {
                    const data = await fetchAllData();
                    
                    if (data.workouts) setWorkouts(data.workouts);
                    if (data.daily) setDailyMetrics(data.daily);
                    if (data.profile) setProfile(data.profile);
                    
                    setLastSync(new Date());
                } catch (err) {
                    console.error('Sync error:', err);
                }
                
                setLoading(false);
            }, []);

            useEffect(() => {
                syncData();
            }, [syncData]);

            // Helpers
            const formatPace = (sec) => `${Math.floor(sec / 60)}:${(sec % 60).toString().padStart(2, '0')}`;
            const formatTime = (min) => `${Math.floor(min / 60)}:${(min % 60).toString().padStart(2, '0')}`;
            
            const effectiveProfile = localProfile;
            
            // Computed values with date filtering
            const now = Date.now();
            const cutoff7 = now - (7 * 24 * 60 * 60 * 1000);
            const cutoff30 = now - (30 * 24 * 60 * 60 * 1000);
            
            const last7Workouts = workouts.filter(w => {
                const d = new Date(w.date);
                return d >= cutoff7;
            });
            
            const last30Workouts = workouts.filter(w => {
                const d = new Date(w.date);
                return d >= cutoff30;
            });
            
            const weeklyVol = last7Workouts.reduce((s, w) => s + (w.distance || 0), 0);
            const avgWeeklyVol = last30Workouts.reduce((s, w) => s + (w.distance || 0), 0) / 4;
            
            const distribution = HyroxIntelligence.analyzeDistribution(last30Workouts, effectiveProfile.zones);
            const readiness = HyroxIntelligence.calculateReadiness(dailyMetrics, effectiveProfile);
            const hrTrend = HyroxIntelligence.getRestingHRTrend(dailyMetrics);
            const insights = HyroxIntelligence.generateInsights(workouts, dailyMetrics, effectiveProfile, effectiveProfile.zones);
            
            const simsThisMonth = last30Workouts.filter(w => 
                (w.type || '').toLowerCase().includes('hyrox') ||
                (w.type || '').toLowerCase().includes('simulation') ||
                (w.type || '').toLowerCase().includes('functional')
            ).length;
            
            const prediction = HyroxIntelligence.predictRaceTime(
                effectiveProfile.z2Pace,
                avgWeeklyVol || effectiveProfile.weeklyVolumeTarget,
                simsThisMonth
            );

            const countdown = Math.max(0, Math.floor((new Date(effectiveProfile.race.date) - Date.now()) / 86400000));

            // Week dates
            const getWeekDates = () => {
                const now = new Date();
                const dayOfWeek = now.getDay();
                return Array.from({ length: 7 }, (_, i) => {
                    const d = new Date(now);
                    d.setDate(now.getDate() - dayOfWeek + i);
                    return d.toISOString().split('T')[0];
                });
            };
            
            const weekDates = getWeekDates();
            const today = new Date().toISOString().split('T')[0];

            const getWorkoutForDate = (dateStr) => {
                return workouts.find(w => {
                    if (!w.date) return false;
                    const wDateStr = typeof w.date === 'string' ? w.date.split('T')[0] : new Date(w.date).toISOString().split('T')[0];
                    return wDateStr === dateStr;
                });
            };

            // ============================================
            // RENDER: DASHBOARD
            // ============================================
            const renderDashboard = () => (
                <div className="pb-24 hide-scrollbar">
                    <div className="px-5 py-4 flex justify-between items-center">
                        <div>
                            <p className="text-xs text-gray-500">
                                {lastSync ? `Synced ${lastSync.toLocaleTimeString()}` : 'Not synced'}
                            </p>
                            <h1 className="font-bebas text-2xl tracking-wide">
                                {loading ? 'LOADING...' : `HI ${effectiveProfile.name.toUpperCase()}`}
                            </h1>
                        </div>
                        <button 
                            onClick={syncData}
                            disabled={loading}
                            className={`p-2 bg-hyrox-card rounded-lg border border-hyrox-border ${loading ? 'opacity-50' : ''}`}
                        >
                            <svg className={`w-5 h-5 ${loading ? 'spin' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                            </svg>
                        </button>
                    </div>

                    {/* Race Card */}
                    <div className="px-5 mb-5">
                        <div className="gradient-red rounded-2xl p-5 relative overflow-hidden">
                            <div className="absolute top-0 right-0 w-32 h-32 bg-white/10 rounded-full -translate-y-1/2 translate-x-1/2"></div>
                            <p className="text-xs uppercase tracking-widest opacity-80">{effectiveProfile.race.name}</p>
                            <div className="flex items-baseline gap-2 mt-1">
                                <span className="font-mono text-4xl font-bold">{countdown}</span>
                                <span className="opacity-70">days</span>
                            </div>
                            <div className="flex gap-4 mt-3 text-sm">
                                <div><span className="opacity-70">Target:</span> <span className="font-mono font-bold">{effectiveProfile.race.targetTime}</span></div>
                                <div><span className="opacity-70">PB:</span> <span className="font-mono">{effectiveProfile.currentPB}</span></div>
                            </div>
                        </div>
                    </div>

                    {/* Readiness Score */}
                    {readiness !== null && (
                        <div className="px-5 mb-5">
                            <div className={`rounded-2xl p-5 border ${
                                readiness >= 80 ? 'bg-green-500/10 border-green-500/30' :
                                readiness >= 60 ? 'bg-yellow-500/10 border-yellow-500/30' :
                                'bg-red-500/10 border-red-500/30'
                            }`}>
                                <div className="flex justify-between items-center mb-3">
                                    <h2 className="font-semibold">Today's Readiness</h2>
                                    <span className={`text-3xl font-mono font-bold ${
                                        readiness >= 80 ? 'text-green-500' :
                                        readiness >= 60 ? 'text-yellow-500' :
                                        'text-red-500'
                                    }`}>{readiness}</span>
                                </div>
                                <div className="h-2 bg-black/20 rounded-full overflow-hidden">
                                    <div 
                                        className={`h-full rounded-full ${
                                            readiness >= 80 ? 'bg-green-500' :
                                            readiness >= 60 ? 'bg-yellow-500' :
                                            'bg-red-500'
                                        }`}
                                        style={{ width: `${readiness}%` }}
                                    ></div>
                                </div>
                                <p className="text-sm mt-2 opacity-70">
                                    {readiness >= 80 ? 'Green light for hard session' :
                                     readiness >= 60 ? 'Moderate effort recommended' :
                                     'Consider rest or easy session'}
                                </p>
                            </div>
                        </div>
                    )}

                    {/* Quick Stats */}
                    <div className="px-5 mb-5">
                        <div className="grid grid-cols-3 gap-3">
                            <div className="bg-hyrox-card rounded-xl p-4 border border-hyrox-border text-center">
                                <p className="font-mono text-2xl font-bold">{weeklyVol.toFixed(1)}</p>
                                <p className="text-xs text-gray-400">km this week</p>
                                <div className="mt-2 h-1 bg-hyrox-elevated rounded-full">
                                    <div className="h-full bg-green-500 rounded-full" style={{ width: `${Math.min(100, (weeklyVol / effectiveProfile.weeklyVolumeTarget) * 100)}%` }}></div>
                                </div>
                            </div>
                            <div className="bg-hyrox-card rounded-xl p-4 border border-hyrox-border text-center">
                                <p className="font-mono text-2xl font-bold">{hrTrend?.current || '—'}</p>
                                <p className="text-xs text-gray-400">resting HR</p>
                                {hrTrend && (
                                    <p className={`text-xs mt-1 ${hrTrend.trend === 'rising' ? 'text-red-400' : hrTrend.trend === 'falling' ? 'text-green-400' : 'text-gray-500'}`}>
                                        {hrTrend.trend === 'rising' ? '↑ rising' : hrTrend.trend === 'falling' ? '↓ falling' : '→ stable'}
                                    </p>
                                )}
                            </div>
                            <div className="bg-hyrox-card rounded-xl p-4 border border-hyrox-border text-center">
                                <p className="font-mono text-2xl font-bold">{last7Workouts.length}</p>
                                <p className="text-xs text-gray-400">sessions</p>
                            </div>
                        </div>
                    </div>

                    {/* Race Prediction */}
                    <div className="px-5 mb-5">
                        <div className="bg-hyrox-card rounded-2xl p-5 border border-hyrox-border">
                            <div className="flex items-center justify-between mb-2">
                                <h2 className="font-semibold">Predicted Finish</h2>
                                <span className="text-xs bg-hyrox-elevated px-2 py-1 rounded-full text-gray-400">Brownlee Model</span>
                            </div>
                            <p className="font-mono text-4xl font-bold text-center">{formatTime(prediction.predicted)}</p>
                            <p className="text-center text-sm text-gray-400 mt-1">
                                Based on {formatPace(effectiveProfile.z2Pace)}/km · {avgWeeklyVol.toFixed(0)}km/week avg
                            </p>
                        </div>
                    </div>

                    {/* Training Distribution */}
                    <div className="px-5 mb-5">
                        <div className="bg-hyrox-card rounded-2xl p-5 border border-hyrox-border">
                            <div className="flex items-center justify-between mb-4">
                                <h2 className="font-semibold">30-Day Distribution</h2>
                                <span className={`text-xs px-2 py-1 rounded-full ${distribution.isHealthy ? 'bg-green-500/20 text-green-500' : 'bg-yellow-500/20 text-yellow-500'}`}>
                                    {distribution.isHealthy ? '✓ Balanced' : '⚠ Adjust'}
                                </span>
                            </div>
                            
                            {distribution.totalMinutes > 0 ? (
                                <>
                                    <div className="h-5 rounded-full overflow-hidden flex mb-4">
                                        <div className="bg-zone-2" style={{ width: `${distribution.z2Pct}%` }}></div>
                                        <div className="bg-zone-3" style={{ width: `${distribution.z3Pct}%` }}></div>
                                        <div className="bg-zone-5" style={{ width: `${distribution.z45Pct}%` }}></div>
                                        <div className="bg-hyrox-red" style={{ width: `${distribution.simPct}%` }}></div>
                                    </div>
                                    <div className="grid grid-cols-4 gap-2 text-center text-xs">
                                        <div><p className="font-mono font-bold text-zone-2">{distribution.z2Pct}%</p><p className="text-gray-500">Easy</p></div>
                                        <div><p className="font-mono font-bold text-zone-3">{distribution.z3Pct}%</p><p className="text-gray-500">Tempo</p></div>
                                        <div><p className="font-mono font-bold text-zone-5">{distribution.z45Pct}%</p><p className="text-gray-500">VO₂</p></div>
                                        <div><p className="font-mono font-bold text-hyrox-red">{distribution.simPct}%</p><p className="text-gray-500">Sims</p></div>
                                    </div>
                                </>
                            ) : (
                                <p className="text-gray-500 text-center py-4">Waiting for workout data...</p>
                            )}
                        </div>
                    </div>

                    {/* Insights */}
                    {insights.length > 0 && (
                        <div className="px-5 mb-5 space-y-3">
                            <h2 className="font-bebas text-xl tracking-wide">INSIGHTS</h2>
                            {insights.map((insight, i) => (
                                <div key={i} className={`rounded-xl p-4 border ${insight.type === 'success' ? 'bg-green-500/10 border-green-500/30' : 'bg-yellow-500/10 border-yellow-500/30'}`}>
                                    <p className="font-semibold">{insight.title}</p>
                                    <p className="text-sm text-gray-400">{insight.message}</p>
                                    {insight.action && <p className="text-xs text-hyrox-orange mt-1">{insight.action}</p>}
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );

            // ============================================
            // RENDER: PLAN
            // ============================================
            const renderPlan = () => (
                <div className="pb-24 hide-scrollbar">
                    <div className="px-5 py-4 border-b border-hyrox-border">
                        <div className="flex justify-between items-center">
                            <div>
                                <p className="text-xs text-gray-400 uppercase tracking-wide">This Week</p>
                                <p className="font-bebas text-2xl tracking-wide">
                                    {new Date(weekDates[0]).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} – {new Date(weekDates[6]).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}
                                </p>
                            </div>
                            <div className="text-right">
                                <p className="font-mono text-2xl font-bold">{weeklyVol.toFixed(1)}<span className="text-sm text-gray-400">/{effectiveProfile.weeklyVolumeTarget}km</span></p>
                            </div>
                        </div>
                    </div>

                    <div className="px-5 py-4 space-y-3">
                        {plan.map((planned, i) => {
                            const date = weekDates[planned.day] || weekDates[i];
                            const isToday = date === today;
                            const logged = getWorkoutForDate(date);
                            const isComplete = !!logged;

                            return (
                                <div 
                                    key={i}
                                    className={`rounded-xl border p-4 ${
                                        isComplete ? 'bg-green-500/10 border-green-500/30' :
                                        isToday ? 'bg-hyrox-red/10 border-hyrox-red/30 pulse-glow' :
                                        'bg-hyrox-card border-hyrox-border'
                                    }`}
                                >
                                    <div className="flex items-center gap-3">
                                        <div className={`w-8 h-8 rounded-lg flex items-center justify-center ${
                                            isComplete ? 'bg-green-500' :
                                            isToday ? 'bg-hyrox-red/30' :
                                            'bg-hyrox-elevated'
                                        }`}>
                                            {isComplete ? (
                                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7" />
                                                </svg>
                                            ) : (
                                                <span className="text-xs font-bold">{planned.name?.slice(0, 2).toUpperCase()}</span>
                                            )}
                                        </div>

                                        <div className="flex-1">
                                            <div className="flex items-center gap-2">
                                                <span className={`text-sm font-medium ${isToday ? 'text-hyrox-red' : 'text-gray-400'}`}>
                                                    {planned.name?.slice(0, 3).toUpperCase() || ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'][planned.day]}
                                                </span>
                                                {isToday && <span className="text-xs bg-hyrox-red/20 text-hyrox-red px-2 py-0.5 rounded-full">Today</span>}
                                            </div>
                                            <p className={`font-semibold ${isComplete ? 'text-green-400' : ''}`}>
                                                {isComplete ? (logged.type || planned.label) : planned.label}
                                            </p>
                                            {isComplete && logged.distance > 0 && (
                                                <p className="text-xs text-gray-500">
                                                    {logged.duration}min · {logged.distance}km · {logged.avgHR}bpm avg
                                                </p>
                                            )}
                                        </div>

                                        <div className="text-right">
                                            {planned.zone && (
                                                <span className={`text-xs font-bold px-2 py-1 rounded ${
                                                    planned.zone === 2 ? 'bg-zone-2/20 text-zone-2' :
                                                    planned.zone === 5 ? 'bg-zone-5/20 text-zone-5' : ''
                                                }`}>
                                                    Z{planned.zone}
                                                </span>
                                            )}
                                            {planned.type === 'strength' && (
                                                <span className="text-xs font-bold px-2 py-1 rounded bg-blue-500/20 text-blue-400">GYM</span>
                                            )}
                                            <p className="text-xs text-gray-500 mt-1">
                                                {planned.duration}min{planned.distance > 0 ? ` · ${planned.distance}km` : ''}
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );

            // ============================================
            // RENDER: TRENDS
            // ============================================
            const renderTrends = () => {
                const weeklyData = [];
                for (let i = 7; i >= 0; i--) {
                    const weekStart = new Date();
                    weekStart.setDate(weekStart.getDate() - (i * 7) - weekStart.getDay());
                    const weekEnd = new Date(weekStart);
                    weekEnd.setDate(weekEnd.getDate() + 7);
                    
                    const weekWorkouts = workouts.filter(w => {
                        const d = new Date(w.date);
                        return d >= weekStart && d < weekEnd;
                    });
                    
                    weeklyData.push({
                        week: `W${8-i}`,
                        volume: weekWorkouts.reduce((s, w) => s + (w.distance || 0), 0),
                        workouts: weekWorkouts.length
                    });
                }

                const maxVol = Math.max(...weeklyData.map(w => w.volume), effectiveProfile.weeklyVolumeTarget);

                return (
                    <div className="pb-24 hide-scrollbar px-5 py-4 space-y-5">
                        <h1 className="font-bebas text-2xl tracking-wide">TRENDS</h1>

                        <div className="bg-hyrox-card rounded-2xl p-5 border border-hyrox-border">
                            <h2 className="font-semibold mb-4">Weekly Volume (km)</h2>
                            <div className="flex items-end gap-1 h-32 mb-2">
                                {weeklyData.map((w, i) => {
                                    const pct = maxVol > 0 ? (w.volume / maxVol) * 100 : 0;
                                    const hitTarget = w.volume >= effectiveProfile.weeklyVolumeTarget;
                                    return (
                                        <div key={i} className="flex-1 flex flex-col items-center">
                                            <div 
                                                className={`w-full rounded-t transition-all ${hitTarget ? 'bg-green-500' : 'bg-gradient-to-t from-hyrox-red to-hyrox-orange'}`}
                                                style={{ height: `${Math.max(4, pct)}%` }}
                                            ></div>
                                        </div>
                                    );
                                })}
                            </div>
                            <div className="flex justify-between text-xs text-gray-500">
                                {weeklyData.map((w, i) => <span key={i}>{w.volume.toFixed(0)}</span>)}
                            </div>
                        </div>

                        {dailyMetrics.length > 0 && (
                            <div className="bg-hyrox-card rounded-2xl p-5 border border-hyrox-border">
                                <h2 className="font-semibold mb-4">Resting HR (last 14 days)</h2>
                                <div className="flex items-end gap-1 h-24 mb-2">
                                    {[...dailyMetrics].sort((a, b) => new Date(a.date) - new Date(b.date)).slice(-14).map((d, i) => {
                                        const hr = d.restingHR || 0;
                                        const min = 45, max = 70;
                                        const pct = hr ? ((hr - min) / (max - min)) * 100 : 0;
                                        const elevated = hr > effectiveProfile.restingHRBaseline + 5;
                                        return (
                                            <div key={i} className="flex-1 flex flex-col items-center">
                                                <div 
                                                    className={`w-full rounded-t ${elevated ? 'bg-red-500' : 'bg-blue-500'}`}
                                                    style={{ height: `${Math.max(4, Math.min(100, pct))}%` }}
                                                ></div>
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="text-xs text-gray-500 text-center">
                                    Baseline: {effectiveProfile.restingHRBaseline} bpm
                                </div>
                            </div>
                        )}

                        <div>
                            <h2 className="font-bebas text-xl tracking-wide mb-3">RECENT WORKOUTS</h2>
                            <div className="space-y-2">
                                {[...workouts].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, 10).map((w, i) => (
                                    <div key={i} className="bg-hyrox-card rounded-xl p-3 border border-hyrox-border flex justify-between items-center">
                                        <div>
                                            <p className="font-medium">{w.type || 'Workout'}</p>
                                            <p className="text-xs text-gray-500">
                                                {new Date(w.date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })}
                                            </p>
                                        </div>
                                        <div className="text-right text-sm text-gray-400">
                                            <p>{w.duration}min</p>
                                            {w.distance > 0 && <p>{w.distance}km</p>}
                                        </div>
                                    </div>
                                ))}
                                {workouts.length === 0 && <p className="text-gray-500 text-center py-4">No workouts synced yet</p>}
                            </div>
                        </div>
                    </div>
                );
            };

            // ============================================
            // SETTINGS MODAL
            // ============================================
            const SettingsModal = () => (
                <div className="fixed inset-0 bg-black/80 z-50 flex items-end justify-center" onClick={() => setShowSettings(false)}>
                    <div className="bg-[#141414] rounded-t-3xl p-6 w-full max-w-lg slide-up max-h-[85vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                        <div className="w-10 h-1 bg-gray-600 rounded-full mx-auto mb-6"></div>
                        <h2 className="font-bebas text-2xl tracking-wide text-center mb-6">SETTINGS</h2>
                        
                        <div className="space-y-4">
                            <div>
                                <label className="text-xs text-gray-400 uppercase tracking-wide">Z2 Pace (sec/km)</label>
                                <p className="text-center font-mono text-2xl my-2">{formatPace(localProfile.z2Pace)}/km</p>
                                <input 
                                    type="range" min="270" max="450" step="5"
                                    value={localProfile.z2Pace}
                                    onChange={e => setLocalProfile(p => ({ ...p, z2Pace: parseInt(e.target.value) }))}
                                    className="w-full"
                                />
                            </div>

                            <div>
                                <label className="text-xs text-gray-400 uppercase tracking-wide">Weekly Volume Target (km)</label>
                                <input 
                                    type="number"
                                    value={localProfile.weeklyVolumeTarget}
                                    onChange={e => setLocalProfile(p => ({ ...p, weeklyVolumeTarget: parseInt(e.target.value) || 50 }))}
                                    className="w-full bg-hyrox-elevated border border-hyrox-border rounded-xl px-4 py-3 mt-1"
                                />
                            </div>
                            
                            <div>
                                <label className="text-xs text-gray-400 uppercase tracking-wide">Resting HR Baseline</label>
                                <input 
                                    type="number"
                                    value={localProfile.restingHRBaseline}
                                    onChange={e => setLocalProfile(p => ({ ...p, restingHRBaseline: parseInt(e.target.value) || 55 }))}
                                    className="w-full bg-hyrox-elevated border border-hyrox-border rounded-xl px-4 py-3 mt-1"
                                />
                            </div>

                            <div className="pt-4 border-t border-hyrox-border">
                                <p className="text-xs text-gray-500 text-center">
                                    Connected to Google Sheet<br/>
                                    {workouts.length} workouts · {dailyMetrics.length} daily records
                                </p>
                            </div>
                        </div>

                        <button onClick={() => setShowSettings(false)} className="w-full gradient-red rounded-xl py-4 font-bebas text-lg tracking-widest mt-6">
                            DONE
                        </button>
                    </div>
                </div>
            );

            // ============================================
            // MAIN RENDER
            // ============================================
            return (
                <div className="max-w-lg mx-auto min-h-screen bg-hyrox-bg">
                    <header className="sticky top-0 z-40 bg-hyrox-bg/95 backdrop-blur px-5 py-4 border-b border-hyrox-border">
                        <div className="flex justify-between items-center">
                            <h1 className="font-bebas text-2xl tracking-widest gradient-text">HYROX ENGINE</h1>
                            <button onClick={() => setShowSettings(true)} className="p-2 bg-hyrox-card rounded-lg border border-hyrox-border">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                            </button>
                        </div>
                    </header>

                    <main className="hide-scrollbar" style={{ height: 'calc(100vh - 130px)', overflowY: 'auto' }}>
                        {activeTab === 'dashboard' && renderDashboard()}
                        {activeTab === 'plan' && renderPlan()}
                        {activeTab === 'trends' && renderTrends()}
                    </main>

                    <nav className="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-lg bg-[#141414] border-t border-hyrox-border px-6 py-3 pb-6 flex justify-around z-40">
                        {[
                            { id: 'dashboard', label: 'Dashboard', icon: <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg> },
                            { id: 'plan', label: 'Plan', icon: <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" /></svg> },
                            { id: 'trends', label: 'Trends', icon: <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg> },
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => setActiveTab(tab.id)}
                                className={`flex flex-col items-center gap-1 ${activeTab === tab.id ? 'opacity-100' : 'opacity-40'}`}
                            >
                                {tab.icon}
                                <span className={`text-xs ${activeTab === tab.id ? 'text-hyrox-red' : ''}`}>{tab.label}</span>
                            </button>
                        ))}
                    </nav>

                    {showSettings && <SettingsModal />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(<App />);
    </script>
</body>
</html>
