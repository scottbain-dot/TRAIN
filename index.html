<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HYROX ENGINE</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700&family=SF+Pro+Text:wght@400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --bg-primary: #000000;
            --bg-card: rgba(28, 28, 30, 0.8);
            --bg-elevated: rgba(44, 44, 46, 0.8);
            --border: rgba(56, 56, 58, 0.6);
            --text-primary: #ffffff;
            --text-secondary: rgba(235, 235, 245, 0.6);
            --text-tertiary: rgba(235, 235, 245, 0.3);
            --accent-blue: #0A84FF;
            --accent-green: #30D158;
            --accent-orange: #FF9F0A;
            --accent-red: #FF453A;
            --accent-purple: #BF5AF2;
            --accent-cyan: #64D2FF;
            --accent-pink: #FF375F;
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.4;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Oura-style animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes ringDraw {
            from { stroke-dashoffset: 251.2; }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.9; }
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .fade-in-up { animation: fadeInUp 0.6s ease-out forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        .delay-5 { animation-delay: 0.5s; }
        
        /* Glass morphism cards */
        .glass-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.02) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
        }
        
        .glass-card-subtle {
            background: rgba(28, 28, 30, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
        }
        
        /* Ring styles */
        .ring-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .svg-ring { transform: rotate(-90deg); }
        .svg-ring circle { fill: none; stroke-linecap: round; }
        .svg-ring .ring-bg { stroke: rgba(255,255,255,0.08); }
        .svg-ring .ring-progress { 
            transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 0 6px currentColor);
        }
        
        /* Session cards */
        .session-card {
            background: rgba(28, 28, 30, 0.6);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 16px;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .session-card:active {
            transform: scale(0.98);
            background: rgba(44, 44, 46, 0.8);
        }
        
        .session-card.is-today {
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(10, 132, 255, 0.15), inset 0 0 20px rgba(10, 132, 255, 0.05);
        }
        
        .session-card.is-complete {
            border-color: var(--accent-green);
            box-shadow: 0 0 20px rgba(48, 209, 88, 0.1);
        }
        
        /* Zone badges */
        .zone-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        
        .zone-1 { background: rgba(100, 210, 255, 0.15); color: var(--accent-cyan); }
        .zone-2 { background: rgba(48, 209, 88, 0.15); color: var(--accent-green); }
        .zone-3 { background: rgba(255, 214, 10, 0.15); color: #FFD60A; }
        .zone-4 { background: rgba(255, 159, 10, 0.15); color: var(--accent-orange); }
        .zone-5 { background: rgba(255, 69, 58, 0.15); color: var(--accent-red); }
        .zone-strength { background: rgba(191, 90, 242, 0.15); color: var(--accent-purple); }
        .zone-sim { background: rgba(255, 55, 95, 0.15); color: var(--accent-pink); }
        .zone-rest { background: rgba(255, 255, 255, 0.08); color: var(--text-secondary); }
        
        /* Progress bars */
        .progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Buttons */
        .btn-primary {
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px 24px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }
        
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px 24px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(20px);
            z-index: 100;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }
        
        .modal-content {
            background: #1c1c1e;
            border-radius: 20px 20px 0 0;
            width: 100%;
            max-width: 500px;
            max-height: 92vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }
        
        .modal-handle {
            width: 36px;
            height: 5px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            margin: 8px auto 16px;
        }
        
        /* Inputs */
        input, select {
            width: 100%;
            background: rgba(44, 44, 46, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 14px 16px;
            color: white;
            font-size: 17px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        
        input:focus, select:focus { border-color: var(--accent-blue); }
        input::placeholder { color: var(--text-tertiary); }
        
        /* Navigation */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 500px;
            background: rgba(28, 28, 30, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.08);
            padding: 8px 20px calc(8px + env(safe-area-inset-bottom));
            z-index: 50;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 20px;
            color: var(--text-tertiary);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            background: none;
            border: none;
            transition: color 0.2s;
        }
        
        .nav-item.active { color: var(--accent-blue); }
        .nav-item svg { width: 24px; height: 24px; }
        
        /* Typography helpers */
        .text-xs { font-size: 11px; }
        .text-sm { font-size: 13px; }
        .text-base { font-size: 15px; }
        .text-lg { font-size: 17px; }
        .text-xl { font-size: 20px; }
        .text-2xl { font-size: 24px; }
        .text-3xl { font-size: 28px; }
        .text-4xl { font-size: 34px; }
        .text-5xl { font-size: 48px; }
        
        .font-light { font-weight: 300; }
        .font-medium { font-weight: 500; }
        .font-semibold { font-weight: 600; }
        .font-bold { font-weight: 700; }
        
        .text-primary { color: var(--text-primary); }
        .text-secondary { color: var(--text-secondary); }
        .text-tertiary { color: var(--text-tertiary); }
        
        .uppercase { text-transform: uppercase; }
        .tracking-wide { letter-spacing: 0.5px; }
        .tracking-wider { letter-spacing: 1px; }
    </style>
</head>
<body>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo } = React;

        // ============================================
        // CONFIGURATION
        // ============================================
        const SHEETS_CONFIG = {
            sheetId: '1BlGGukORumWb7508lcu-SS0wF8lMwdOJEsOp-vGCKrc',
            sheets: { workouts: 'Workouts', daily: 'DailyMetrics' }
        };

        const TARGETS = {
            vo2max: 48,
            twoKmTime: 465,
            thresholdPace: 255,

        };

        const BASELINES = {

            thresholdPace: 285,
            twentyMinDist: 4.5,
            miniSimTotal: 1800,
        };

        // ============================================
        // PERIODIZATION - Research-backed 14-month plan
        // ============================================
        const PHASES = [
            {

                volStart: 25, volEnd: 35,

            },
            { 
                id: 'base2', name: 'Base 2', weeks: 6, focus: 'Volume + Threshold Intro',
                desc: 'Continue volume build while introducing threshold work.',
                volStart: 35, volEnd: 45,
                dist: { z2: 75, threshold: 10, vo2: 5, strength: 10, sim: 0 },
                keyWorkouts: ['Long run 90-100min', 'Weekly tempo/threshold session'],
                research: 'Threshold work begins after 6+ weeks of base. Lactate clearance improves, sustainable pace increases.',
            },
            { 
                id: 'build1', name: 'Build 1', weeks: 6, focus: 'VO2max Development',
                desc: 'Add VO2max intervals while maintaining volume.',
                volStart: 45, volEnd: 55,

                research: 'Billat research: VO2max intervals (90-100% vVO2max) are most potent stimulus for aerobic power. 2-3 week adaptation lag.',
            },
            { 
                id: 'brace', name: 'B-Race Block', weeks: 4, focus: 'Race Sharpening',
                desc: 'Prepare for B-race. Test current fitness.',
                volStart: 50, volEnd: 35,
                dist: { z2: 60, threshold: 15, vo2: 10, strength: 5, sim: 10 },
                keyWorkouts: ['Race simulation', 'Threshold sharpening', '10-14 day taper'],
                research: 'Mujika taper research: 40-60% volume reduction, maintain intensity, 8-14 days optimal for performance peak.',
            },
            { 
                id: 'recovery', name: 'Recovery', weeks: 2, focus: 'Post-Race Recovery',
                desc: 'Active recovery and mental reset.',
                volStart: 20, volEnd: 30,
                dist: { z2: 95, threshold: 0, vo2: 0, strength: 5, sim: 0 },

                research: 'Brownlee study: +100km monthly = -4.4min race time. This is the volume accumulation phase.',
            },
            { 
                id: 'specific', name: 'Specificity', weeks: 6, focus: 'HYROX-Specific',
                desc: 'Race-specific work. Running under fatigue.',
                volStart: 55, volEnd: 50,
                dist: { z2: 60, threshold: 10, vo2: 10, strength: 5, sim: 15 },
                keyWorkouts: ['Mini-sims 2x/week', 'Station practice', 'Threshold under fatigue'],
                research: 'Specificity principle: final 6-8 weeks should mimic race demands. Neural pacing adaptations, fatigue resistance.',
            },
            { 
                id: 'taper', name: 'Peak & Taper', weeks: 3, focus: 'Arrive Fresh',
                desc: 'Reduce volume, maintain intensity. Race ready.',
                volStart: 45, volEnd: 20,
                dist: { z2: 65, threshold: 10, vo2: 10, strength: 0, sim: 15 },
                keyWorkouts: ['Short sharp intervals', 'Race pace openers', 'Full rest before race'],
                research: 'Bosquet meta-analysis: optimal taper is 2-3 weeks, 41-60% volume reduction. Freshness + fitness = performance.',
            },
        ];

        const getPhaseForWeek = (week) => {
            let cumulative = 0;
            for (const phase of PHASES) {
                if (week <= cumulative + phase.weeks) {
                    return { ...phase, weekInPhase: week - cumulative, totalWeeks: phase.weeks };
                }
                cumulative += phase.weeks;
            }
            return { ...PHASES[PHASES.length - 1], weekInPhase: 1, totalWeeks: 3 };
        };

        const getVolumeForWeek = (week) => {
            const phase = getPhaseForWeek(week);
            const progress = (phase.weekInPhase - 1) / Math.max(1, phase.totalWeeks - 1);
            let volume = phase.volStart + (phase.volEnd - phase.volStart) * progress;
            if (week % 4 === 0) volume *= 0.7; // Deload week
            return Math.round(volume);
        };

        // SESSION TEMPLATES
        // ============================================

                threshold: {
                    name: `${params.reps || 4}×${params.repTime || 6}min Threshold`,
                    type: 'run',
                    zone: 4,
                    duration: (params.reps || 4) * ((params.repTime || 6) + (params.rest || 2)) + 20,
                    distance: null,
                    desc: 'Sustained hard effort at lactate threshold',
                    purpose: 'Raises lactate threshold - the pace you can sustain for ~60min. Key for HYROX run splits.',
                    structure: [
                        { name: 'Warm-up', time: '10 min', detail: 'Easy jog + 4×30s strides' },
                        { name: 'Main Set', time: `${(params.reps || 4) * ((params.repTime || 6) + (params.rest || 2))} min`, detail: `${params.reps || 4}×${params.repTime || 6}min @ threshold, ${params.rest || 2}min jog recovery` },

                    ],

                vo2max: {

                    structure: [

                        { name: 'Main Set', time: `${(params.reps || 5) * ((params.repTime || 4) + (params.rest || 3))} min`, detail: `${params.reps || 5}×${params.repTime || 4}min HARD, ${params.rest || 3}min easy jog` },

                twoKmTT: {

        // ============================================
        // UTILITIES
        // ============================================
        const formatTime = (sec) => `${Math.floor(sec/60)}:${(sec%60).toString().padStart(2,'0')}`;
        const formatPace = (sec) => `${Math.floor(sec/60)}:${(sec%60).toString().padStart(2,'0')}/km`;
        const formatDuration = (min) => min >= 60 ? `${Math.floor(min/60)}h ${min%60}m` : `${min}min`;
        const parseTime = (str) => {
            if (!str) return 0;
            const p = str.split(':');
            return p.length === 2 ? parseInt(p[0])*60 + parseInt(p[1]) : parseInt(str) || 0;
        };

        const storage = {
            get: (k, d) => { try { const v = localStorage.getItem('hyrox8_'+k); return v ? JSON.parse(v) : d; } catch { return d; } },
            set: (k, v) => localStorage.setItem('hyrox8_'+k, JSON.stringify(v))
        };

        const fetchSheet = async (name) => {
            const url = `https://docs.google.com/spreadsheets/d/${SHEETS_CONFIG.sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}`;
            try {
                const res = await fetch(url);
                const txt = await res.text();
                const json = JSON.parse(txt.substring(47).slice(0,-2));
                if (!json.table?.rows) return [];
                const headers = json.table.cols.map(c => c.label || '');
                return json.table.rows.map(r => {
                    const o = {};
                    r.c?.forEach((c,i) => { if(headers[i]) o[headers[i]] = c?.v ?? c?.f ?? null; });
                    return o;
                });
            } catch { return []; }
        };

        // ============================================
        // COMPONENTS
        // ============================================
        
        // Performance Ring
        const Ring = ({ progress, color, size, strokeWidth = 8 }) => {
            const r = (size - strokeWidth) / 2;
            const circ = 2 * Math.PI * r;
            const offset = circ - (Math.min(100, Math.max(0, progress)) / 100) * circ;
            return (
                <svg width={size} height={size} className="svg-ring">
                    <circle className="ring-bg" cx={size/2} cy={size/2} r={r} strokeWidth={strokeWidth} />
                    <circle className="ring-progress" cx={size/2} cy={size/2} r={r} strokeWidth={strokeWidth} 
                        stroke={color} strokeDasharray={circ} strokeDashoffset={offset} />
                </svg>
            );
        };

        // Four-ring display (Oura style)
        const PerformanceRings = ({ scores }) => (
            <div className="ring-container" style={{ width: 240, height: 240 }}>

                <div style={{ position: 'absolute', top: 20, left: 40 }}>

        // Session Card

                    </div>
                </div>
            );

        // Test Modal
        const TestModal = ({ type, onClose, onSave }) => {
            const [time, setTime] = useState('');
            const [distance, setDistance] = useState('');
            const [station, setStation] = useState('Row 500m');
            const [rounds, setRounds] = useState([{run:'',st:''},{run:'',st:''},{run:'',st:''},{run:'',st:''}]);

            const handleSave = () => {
                const date = new Date().toISOString().split('T')[0];
                if (type === 'twoKm' && parseTime(time) > 0) {
                    onSave({ type: 'twoKm', date, time: parseTime(time) });
                } else if (type === 'threshold' && parseFloat(distance) > 0) {
                    const d = parseFloat(distance);
                    onSave({ type: 'threshold', date, distance: d, avgPace: Math.round(1200 / d) });
                } else if (type === 'miniSim') {
                    const parsed = rounds.map(r => ({ run: parseTime(r.run), st: parseTime(r.st) }));
                    const total = parsed.reduce((s, r) => s + r.run + r.st, 0);
                    if (total > 0) onSave({ type: 'miniSim', date, station, rounds: parsed, total });
                }
                onClose();
            };

            return (
                <div className="modal-overlay" onClick={onClose}>

            useEffect(() => { storage.set('tests', tests); }, [tests]);
            useEffect(() => { storage.set('profile', profile); }, [profile]);

            const sync = useCallback(async () => {

                const [w, d] = await Promise.all([fetchSheet('Workouts'), fetchSheet('DailyMetrics')]);
                setWorkouts(w.filter(x => x['Date']));

                setLastSync(new Date());

            useEffect(() => { sync(); }, [sync]);

            const now = Date.now();
            const currentWeek = useMemo(() => {

                return Math.max(1, Math.floor((now - start) / (7*24*60*60*1000)) + 1);
            }, [profile.startDate, now]);

            const phase = useMemo(() => getPhaseForWeek(currentWeek), [currentWeek]);
            const targetVol = useMemo(() => getVolumeForWeek(currentWeek), [currentWeek]);
            const daysToA = Math.max(0, Math.floor((new Date(profile.aRaceDate) - now) / 86400000));
            const daysToB = Math.max(0, Math.floor((new Date(profile.bRaceDate) - now) / 86400000));

            const weeklyVol = useMemo(() => {
                const weekAgo = now - 7*24*60*60*1000;
                return workouts.filter(w => new Date(w['Date']) >= weekAgo)
                    .reduce((s, w) => s + (parseFloat(w['Distance (km)']) || 0), 0);
            }, [workouts, now]);

            const latestVo2 = useMemo(() => {
                const sorted = [...dailyMetrics].sort((a,b) => new Date(b['Date']) - new Date(a['Date']));

                const sim = tests.miniSim[tests.miniSim.length-1]?.total || BASELINES.miniSimTotal;
                return {
                    aerobic: Math.min(100, Math.max(0, (latestVo2 - BASELINES.vo2max) / (TARGETS.vo2max - BASELINES.vo2max) * 100)),

                        </div>
                        <button onClick={() => setShowSettings(true)} style={{ padding: 8, background: 'none', border: 'none', color: 'white', cursor: 'pointer' }}>
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                        </button>
                    </div>
                    <div className="fade-in-up" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '20px 0 30px' }}>
                        <PerformanceRings scores={scores} />
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 12, marginTop: 24, width: '100%', padding: '0 20px' }}>
                            {[{ label: 'Aerobic', color: 'var(--accent-green)', val: scores.aerobic },{ label: 'Threshold', color: 'var(--accent-orange)', val: scores.threshold },{ label: 'Speed', color: 'var(--accent-red)', val: scores.speed },{ label: 'Stations', color: 'var(--accent-purple)', val: scores.functional }].map((s, i) => (
                                <div key={i} style={{ textAlign: 'center' }}>
                                    <div style={{ width: 10, height: 10, borderRadius: 5, background: s.color, margin: '0 auto 4px' }} />
                                    <p className="text-xs text-secondary">{s.label}</p>
                                    <p className="text-sm font-semibold">{Math.round(s.val)}%</p>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="fade-in-up delay-1" style={{ padding: '0 20px', marginBottom: 20 }}>
                        <div className="glass-card" style={{ padding: 20 }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                                <div>
                                    <p className="text-xs text-secondary uppercase tracking-wider">A-Race: Malaga 2027</p>
                                    <p className="text-4xl font-bold" style={{ marginTop: 4 }}>{daysToA}</p>
                                    <p className="text-secondary">days to go</p>
                                </div>
                                <div style={{ textAlign: 'right' }}>
                                    <p className="text-xs text-secondary">Target</p>
                                    <p className="text-2xl font-bold" style={{ color: 'var(--accent-green)' }}>{profile.targetTime}</p>
                                    <p className="text-xs text-secondary" style={{ marginTop: 8 }}>PB: {profile.currentPB}</p>
                                </div>
                            </div>
                            {daysToB > 0 && daysToB < daysToA && (
                                <div style={{ marginTop: 16, paddingTop: 16, borderTop: '1px solid rgba(255,255,255,0.1)' }}>
                                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                        <div><p className="text-xs text-secondary">B-Race</p><p className="font-semibold">{daysToB} days</p></div>
                                        <p className="text-sm" style={{ color: 'var(--accent-orange)' }}>Target: 1:10-1:12</p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                    <div className="fade-in-up delay-2" style={{ padding: '0 20px', marginBottom: 20 }}>
                        <div className="glass-card-subtle" style={{ padding: 16 }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 12 }}>
                                <div>
                                    <p className="text-xs text-secondary uppercase tracking-wider">Current Phase</p>
                                    <p className="text-lg font-bold">{phase.name}</p>
                                    <p className="text-sm text-secondary">{phase.focus}</p>
                                </div>
                                <div style={{ textAlign: 'right' }}>
                                    <p className="text-xs text-secondary">Week</p>
                                    <p className="text-xl font-bold">{phase.weekInPhase}<span className="text-secondary">/{phase.totalWeeks}</span></p>
                                </div>
                            </div>
                            <div className="progress-bar"><div className="progress-fill" style={{ width: `${(phase.weekInPhase/phase.totalWeeks)*100}%`, background: 'var(--accent-blue)' }} /></div>
                        </div>
                    </div>
                    <div className="fade-in-up delay-3" style={{ padding: '0 20px', marginBottom: 20 }}>
                        <div className="glass-card-subtle" style={{ padding: 16 }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 12 }}>
                                <p className="text-xs text-secondary uppercase tracking-wider">Weekly Volume</p>
                                <p className="font-bold">{weeklyVol.toFixed(1)} <span className="text-secondary font-normal">/ {targetVol}km</span></p>
                            </div>
                            <div className="progress-bar" style={{ height: 8 }}><div className="progress-fill" style={{ width: `${Math.min(100, weeklyVol/targetVol*100)}%`, background: weeklyVol >= targetVol ? 'var(--accent-green)' : 'var(--accent-blue)' }} /></div>
                        </div>
                    </div>
                    <div className="fade-in-up delay-4" style={{ padding: '0 20px', marginBottom: 20 }}>
                        <p className="text-xs text-secondary uppercase tracking-wider" style={{ marginBottom: 12 }}>Today's Session</p>
                        {todaySession && <SessionCard session={todaySession} day={todayName} isToday onClick={() => setSelectedSession(todaySession)} />}
                    </div>
                    <div className="fade-in-up delay-5" style={{ padding: '0 20px' }}>
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 12 }}>
                            <div className="glass-card-subtle" style={{ padding: 16, textAlign: 'center' }}><p className="text-2xl font-bold">{latestVo2.toFixed(1)}</p><p className="text-xs text-secondary">VO₂max</p></div>
                            <div className="glass-card-subtle" style={{ padding: 16, textAlign: 'center' }}><p className="text-2xl font-bold">{latestHR}</p><p className="text-xs text-secondary">Resting HR</p></div>
                            <div className="glass-card-subtle" style={{ padding: 16, textAlign: 'center' }}><p className="text-2xl font-bold">{workouts.filter(w => new Date(w['Date']) >= now - 7*24*60*60*1000).length}</p><p className="text-xs text-secondary">Sessions</p></div>
                        </div>
                    </div>
                </div>
            );

            // RENDER: PLAN
            const renderPlan = () => (
                <div className="hide-scrollbar" style={{ paddingBottom: 100 }}>
                    <div style={{ padding: '16px 20px' }}><h1 className="text-2xl font-bold">This Week</h1><p className="text-secondary">Week {currentWeek} · {phase.name}</p></div>
                    <div style={{ padding: '0 20px', marginBottom: 20 }}>
                        <div className="glass-card-subtle" style={{ padding: 16, borderLeft: '3px solid var(--accent-blue)' }}>
                            <p className="font-semibold" style={{ color: 'var(--accent-blue)' }}>{phase.focus}</p>
                            <p className="text-sm text-secondary" style={{ marginTop: 4 }}>{phase.desc}</p>
                        </div>
                    </div>
                    <div style={{ padding: '0 20px', display: 'flex', flexDirection: 'column', gap: 12 }}>
                        {weekPlan.map((item, i) => <SessionCard key={i} session={item.session} day={item.day} isToday={item.day === todayName} onClick={() => setSelectedSession(item.session)} />)}
                    </div>
                    <div style={{ padding: '20px' }}>
                        <p className="text-xs text-secondary uppercase tracking-wider" style={{ marginBottom: 12 }}>Target Distribution</p>
                        <div className="glass-card-subtle" style={{ padding: 16 }}>
                            <div style={{ display: 'flex', height: 12, borderRadius: 6, overflow: 'hidden', marginBottom: 12 }}>
                                <div style={{ width: `${phase.dist.z2}%`, background: 'var(--accent-green)' }} />
                                <div style={{ width: `${phase.dist.threshold}%`, background: 'var(--accent-orange)' }} />
                                <div style={{ width: `${phase.dist.vo2}%`, background: 'var(--accent-red)' }} />
                                <div style={{ width: `${phase.dist.strength}%`, background: 'var(--accent-purple)' }} />
                                <div style={{ width: `${phase.dist.sim}%`, background: 'var(--accent-pink)' }} />
                            </div>
                            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 8, textAlign: 'center', fontSize: 12 }}>
                                <div><span style={{ color: 'var(--accent-green)' }}>{phase.dist.z2}%</span><br/><span className="text-secondary">Z2</span></div>
                                <div><span style={{ color: 'var(--accent-orange)' }}>{phase.dist.threshold}%</span><br/><span className="text-secondary">Thresh</span></div>
                                <div><span style={{ color: 'var(--accent-red)' }}>{phase.dist.vo2}%</span><br/><span className="text-secondary">VO₂</span></div>
                                <div><span style={{ color: 'var(--accent-purple)' }}>{phase.dist.strength}%</span><br/><span className="text-secondary">Str</span></div>
                                <div><span style={{ color: 'var(--accent-pink)' }}>{phase.dist.sim}%</span><br/><span className="text-secondary">Sim</span></div>
                            </div>
                        </div>
                    </div>
                    <div style={{ padding: '0 20px' }}>
                        <div className="glass-card-subtle" style={{ padding: 16, background: 'rgba(10,132,255,0.08)', borderColor: 'rgba(10,132,255,0.2)' }}>
                            <p className="text-xs uppercase tracking-wider" style={{ color: 'var(--accent-blue)', marginBottom: 8 }}>📚 Why This Week?</p>
                            <p className="text-sm">{phase.research}</p>
                        </div>
                    </div>
                </div>
            );

            // RENDER: PROGRESS
            const renderProgress = () => (
                <div className="hide-scrollbar" style={{ paddingBottom: 100 }}>
                    <div style={{ padding: '16px 20px' }}><h1 className="text-2xl font-bold">Progress</h1><p className="text-secondary">Track your improvements</p></div>
                    <div style={{ padding: '0 20px', marginBottom: 20 }}>
                        <p className="text-xs text-secondary uppercase tracking-wider" style={{ marginBottom: 12 }}>Log a Test</p>
                        <div style={{ display: 'flex', gap: 8, overflowX: 'auto' }} className="hide-scrollbar">
                            <button className="glass-card-subtle" style={{ padding: '12px 16px', whiteSpace: 'nowrap', border: 'none', color: 'white', cursor: 'pointer' }} onClick={() => setTestModal('twoKm')}>🔥 2km TT</button>
                            <button className="glass-card-subtle" style={{ padding: '12px 16px', whiteSpace: 'nowrap', border: 'none', color: 'white', cursor: 'pointer' }} onClick={() => setTestModal('threshold')}>⚡ 20-min Test</button>
                            <button className="glass-card-subtle" style={{ padding: '12px 16px', whiteSpace: 'nowrap', border: 'none', color: 'white', cursor: 'pointer' }} onClick={() => setTestModal('miniSim')}>🏋️ Mini-Sim</button>
                        </div>
                    </div>
                    <div style={{ padding: '0 20px', display: 'flex', flexDirection: 'column', gap: 12 }}>
                        <div className="glass-card-subtle" style={{ padding: 16 }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}><div><p className="text-xs text-secondary">VO₂max</p><p className="text-2xl font-bold">{latestVo2.toFixed(1)}</p></div><div style={{ textAlign: 'right' }}><p className="text-xs text-secondary">Target</p><p className="font-bold" style={{ color: 'var(--accent-green)' }}>{TARGETS.vo2max}</p></div></div>
                            <div className="progress-bar"><div className="progress-fill" style={{ width: `${scores.aerobic}%`, background: 'var(--accent-green)' }} /></div>
                        </div>
                        <div className="glass-card-subtle" style={{ padding: 16 }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}><div><p className="text-xs text-secondary">2km Time Trial</p><p className="text-2xl font-bold">{tests.twoKm.length > 0 ? formatTime(tests.twoKm[tests.twoKm.length-1].time) : '—'}</p></div><div style={{ textAlign: 'right' }}><p className="text-xs text-secondary">Target</p><p className="font-bold" style={{ color: 'var(--accent-red)' }}>{formatTime(TARGETS.twoKmTime)}</p></div></div>
                            <div className="progress-bar"><div className="progress-fill" style={{ width: `${scores.speed}%`, background: 'var(--accent-red)' }} /></div>
                        </div>
                        <div className="glass-card-subtle" style={{ padding: 16 }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}><div><p className="text-xs text-secondary">Threshold Pace</p><p className="text-2xl font-bold">{tests.threshold.length > 0 ? formatPace(tests.threshold[tests.threshold.length-1].avgPace) : '—'}</p></div><div style={{ textAlign: 'right' }}><p className="text-xs text-secondary">Target</p><p className="font-bold" style={{ color: 'var(--accent-orange)' }}>{formatPace(TARGETS.thresholdPace)}</p></div></div>
                            <div className="progress-bar"><div className="progress-fill" style={{ width: `${scores.threshold}%`, background: 'var(--accent-orange)' }} /></div>
                        </div>
                        <div className="glass-card-subtle" style={{ padding: 16 }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}><div><p className="text-xs text-secondary">Mini-Sim Total</p><p className="text-2xl font-bold">{tests.miniSim.length > 0 ? formatTime(tests.miniSim[tests.miniSim.length-1].total) : '—'}</p></div><div style={{ textAlign: 'right' }}><p className="text-xs text-secondary">Target</p><p className="font-bold" style={{ color: 'var(--accent-purple)' }}>{formatTime(TARGETS.miniSimTotal)}</p></div></div>
                            <div className="progress-bar"><div className="progress-fill" style={{ width: `${scores.functional}%`, background: 'var(--accent-purple)' }} /></div>
                        </div>
                    </div>
                    <div style={{ padding: '20px' }}>
                        <p className="text-xs text-secondary uppercase tracking-wider" style={{ marginBottom: 12 }}>Recent Tests</p>
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                            {[...tests.twoKm.map(t => ({...t, label: '2km TT', val: formatTime(t.time)})),...tests.threshold.map(t => ({...t, label: '20-min', val: formatPace(t.avgPace)})),...tests.miniSim.map(t => ({...t, label: 'Mini-Sim', val: formatTime(t.total)}))].sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 5).map((t, i) => (
                                <div key={i} className="glass-card-subtle" style={{ padding: 12, display: 'flex', justifyContent: 'space-between' }}><div><p className="font-medium">{t.label}</p><p className="text-xs text-secondary">{t.date}</p></div><p className="font-bold">{t.val}</p></div>
                            ))}
                            {tests.twoKm.length + tests.threshold.length + tests.miniSim.length === 0 && <p className="text-secondary text-center" style={{ padding: 20 }}>No tests logged yet</p>}
                        </div>
                    </div>
                </div>
            );

            const SettingsModal = () => showSettings ? (
                <div className="modal-overlay" onClick={() => setShowSettings(false)}>
                    <div className="modal-content" onClick={e => e.stopPropagation()}>
                        <div className="modal-handle" />
                        <div style={{ padding: 20 }}>
                            <h2 className="text-xl font-bold" style={{ marginBottom: 20 }}>Settings</h2>
                            <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                                <div><label className="text-xs text-secondary uppercase">Name</label><input type="text" value={profile.name} onChange={e => setProfile(p => ({...p, name: e.target.value}))} style={{ marginTop: 8 }} /></div>
                                <div><label className="text-xs text-secondary uppercase">Training Start Date</label><input type="date" value={profile.startDate} onChange={e => setProfile(p => ({...p, startDate: e.target.value}))} style={{ marginTop: 8 }} /></div>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                                    <div><label className="text-xs text-secondary uppercase">B-Race Date</label><input type="date" value={profile.bRaceDate} onChange={e => setProfile(p => ({...p, bRaceDate: e.target.value}))} style={{ marginTop: 8 }} /></div>
                                    <div><label className="text-xs text-secondary uppercase">A-Race Date</label><input type="date" value={profile.aRaceDate} onChange={e => setProfile(p => ({...p, aRaceDate: e.target.value}))} style={{ marginTop: 8 }} /></div>
                                </div>
                                <div><label className="text-xs text-secondary uppercase">Target Time</label><input type="text" value={profile.targetTime} onChange={e => setProfile(p => ({...p, targetTime: e.target.value}))} style={{ marginTop: 8 }} /></div>
                            </div>
                            <button className="btn-primary" style={{ marginTop: 24 }} onClick={() => setShowSettings(false)}>Done</button>
                        </div>
                    </div>
                </div>
            ) : null;

            return (
                <div style={{ minHeight: '100vh', maxWidth: 500, margin: '0 auto' }}>
                    <main style={{ height: 'calc(100vh - 70px)', overflowY: 'auto' }}>
                        {tab === 'today' && renderToday()}
                        {tab === 'plan' && renderPlan()}
                        {tab === 'progress' && renderProgress()}
                    </main>
                    <nav className="nav-bar">
                        <div style={{ display: 'flex', justifyContent: 'space-around' }}>
                            {[
                                { id: 'today', label: 'Today', icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> },
                                { id: 'plan', label: 'Plan', icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> },
                                { id: 'progress', label: 'Progress', icon: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> },
                            ].map(item => (
                                <button key={item.id} onClick={() => setTab(item.id)} className={`nav-item ${tab === item.id ? 'active' : ''}`}>{item.icon}<span>{item.label}</span></button>
                            ))}
                        </div>
                    </nav>
                    {selectedSession && <SessionModal session={selectedSession} onClose={() => setSelectedSession(null)} />}
                    {testModal && <TestModal type={testModal} onClose={() => setTestModal(null)} onSave={handleTestSave} />}
                    <SettingsModal />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(<App />);
    </script>
</body>
</html>
