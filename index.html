<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HYROX ENGINE</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --bg: #000000;
            --card: #111111;
            --card-elevated: #1a1a1a;
            --border: rgba(255,255,255,0.08);
            --text: #ffffff;
            --text-secondary: rgba(255,255,255,0.6);
            --text-tertiary: rgba(255,255,255,0.35);
            --green: #30D158;
            --green-dim: rgba(48,209,88,0.15);
            --blue: #0A84FF;
            --blue-dim: rgba(10,132,255,0.15);
            --orange: #FF9F0A;
            --orange-dim: rgba(255,159,10,0.15);
            --red: #FF453A;
            --red-dim: rgba(255,69,58,0.15);
            --purple: #BF5AF2;
            --purple-dim: rgba(191,90,242,0.15);
            --cyan: #64D2FF;
            --cyan-dim: rgba(100,210,255,0.15);
            --yellow: #FFD60A;
            --yellow-dim: rgba(255,214,10,0.15);
        }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }
        
        /* Beautiful Gradients */
        .grad-readiness {
            background: linear-gradient(135deg, #1e3a5f 0%, #0f1f35 60%, #0a141f 100%);
        }
        .grad-aerobic {
            background: linear-gradient(135deg, #1a4d3a 0%, #0f2d22 60%, #091a14 100%);
        }
        .grad-race {
            background: linear-gradient(135deg, #4a3519 0%, #2a1f0f 60%, #1a140a 100%);
        }
        .grad-hyrox {
            background: linear-gradient(135deg, #3d1a5c 0%, #231035 60%, #150a20 100%);
        }
        .grad-session {
            background: linear-gradient(160deg, #1a2a3a 0%, #0f1a25 50%, #080d12 100%);
        }
        
        /* Aurora Glow Effect */
        .aurora {
            position: relative;
            overflow: hidden;
        }
        .aurora::before {
            content: '';
            position: absolute;
            top: -100%;
            left: -50%;
            width: 200%;
            height: 300%;
            background: 
                radial-gradient(ellipse at 30% 30%, rgba(100, 210, 255, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 70%, rgba(48, 209, 88, 0.08) 0%, transparent 50%);
            animation: auroraMove 20s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes auroraMove {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(5%, -5%) rotate(2deg); }
            66% { transform: translate(-5%, 5%) rotate(-2deg); }
        }
        
        /* Cards */
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.2s ease;
        }
        .card:active {
            transform: scale(0.98);
        }
        
        /* Metric Card */
        .metric-card {
            position: relative;
            padding: 20px;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }
        .metric-card .chevron {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: rgba(255,255,255,0.5);
        }
        
        /* Typography */
        .label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-secondary);
        }
        .value-hero {
            font-size: 48px;
            font-weight: 300;
            letter-spacing: -2px;
            line-height: 1;
        }
        .value-large {
            font-size: 36px;
            font-weight: 400;
            letter-spacing: -1px;
        }
        .value-medium {
            font-size: 24px;
            font-weight: 500;
        }
        .unit {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-secondary);
            margin-left: 4px;
        }
        .insight {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        
        /* Trend Badges */
        .trend {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 20px;
            margin-top: 8px;
        }
        .trend-up { background: var(--green-dim); color: var(--green); }
        .trend-down { background: var(--red-dim); color: var(--red); }
        .trend-stable { background: var(--yellow-dim); color: var(--yellow); }
        .trend-neutral { background: rgba(255,255,255,0.08); color: var(--text-secondary); }
        
        /* Progress Ring */
        .ring-container {
            position: relative;
            width: 80px;
            height: 80px;
        }
        .ring-svg {
            transform: rotate(-90deg);
        }
        .ring-bg {
            fill: none;
            stroke: rgba(255,255,255,0.1);
        }
        .ring-progress {
            fill: none;
            stroke-linecap: round;
            transition: stroke-dashoffset 1s ease-out;
        }
        .ring-value {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 22px;
            font-weight: 600;
        }
        
        /* Progress Bar */
        .progress-bar {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.8s ease-out;
        }
        
        /* Charts */
        .chart-container {
            width: 100%;
            height: 180px;
            position: relative;
        }
        .chart-svg {
            width: 100%;
            height: 100%;
        }
        .chart-line {
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .chart-area {
            opacity: 0.2;
        }
        .chart-dot {
            stroke-width: 2;
        }
        .chart-grid-line {
            stroke: rgba(255,255,255,0.06);
            stroke-width: 1;
        }
        .chart-label {
            font-size: 10px;
            fill: var(--text-tertiary);
        }
        
        /* Bar Chart */
        .bar-chart {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 100px;
            padding: 0 4px;
            gap: 6px;
        }
        .bar {
            flex: 1;
            border-radius: 4px 4px 0 0;
            min-width: 12px;
            max-width: 24px;
            transition: height 0.5s ease-out;
            position: relative;
        }
        .bar-label {
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            color: var(--text-tertiary);
            white-space: nowrap;
        }
        
        /* Data Row */
        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }
        .data-row:last-child {
            border-bottom: none;
        }
        .data-label {
            font-size: 15px;
            color: var(--text);
        }
        .data-sublabel {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }
        .data-value {
            font-size: 17px;
            font-weight: 600;
            text-align: right;
        }
        
        /* Contributor Row (Oura style) */
        .contributor {
            padding: 16px 0;
            border-bottom: 1px solid var(--border);
        }
        .contributor:last-child {
            border-bottom: none;
        }
        .contributor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .contributor-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }
        .contributor-fill {
            height: 100%;
            border-radius: 3px;
        }
        
        /* Stat Grid */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .stat-box {
            background: var(--card-elevated);
            border-radius: 16px;
            padding: 16px;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 600;
            margin: 6px 0;
        }
        .stat-change {
            font-size: 13px;
            font-weight: 500;
        }
        .stat-change.positive { color: var(--green); }
        .stat-change.negative { color: var(--red); }
        
        /* Insight Box */
        .insight-box {
            padding: 16px;
            border-radius: 14px;
            margin: 16px 0;
        }
        .insight-box.green { background: var(--green-dim); border: 1px solid rgba(48,209,88,0.2); }
        .insight-box.blue { background: var(--blue-dim); border: 1px solid rgba(10,132,255,0.2); }
        .insight-box.orange { background: var(--orange-dim); border: 1px solid rgba(255,159,10,0.2); }
        .insight-box.purple { background: var(--purple-dim); border: 1px solid rgba(191,90,242,0.2); }
        .insight-box.red { background: var(--red-dim); border: 1px solid rgba(255,69,58,0.2); }
        .insight-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
        }
        .insight-box.green .insight-title { color: var(--green); }
        .insight-box.blue .insight-title { color: var(--blue); }
        .insight-box.orange .insight-title { color: var(--orange); }
        .insight-box.purple .insight-title { color: var(--purple); }
        
        /* Time Toggle */
        .time-toggle {
            display: flex;
            background: var(--card-elevated);
            border-radius: 12px;
            padding: 4px;
        }
        .time-toggle button {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text-tertiary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .time-toggle button.active {
            background: var(--card);
            color: var(--text);
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }
        .modal-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            max-height: 94vh;
            background: #0c0c0c;
            border-radius: 24px 24px 0 0;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
        }
        .modal-overlay.open .modal-sheet {
            transform: translateY(0);
        }
        .modal-handle {
            width: 36px;
            height: 5px;
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
            margin: 8px auto 0;
        }
        .modal-hero {
            position: relative;
            padding: 50px 24px 30px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .modal-back {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-body {
            padding: 24px;
        }
        .modal-section {
            margin-bottom: 32px;
        }
        .modal-section:last-child {
            margin-bottom: 0;
        }
        
        /* Session Card */
        .session-card {
            position: relative;
            padding: 20px;
            cursor: pointer;
        }
        .session-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .session-badge.z2 { background: var(--green-dim); color: var(--green); }
        .session-badge.z4 { background: var(--orange-dim); color: var(--orange); }
        .session-badge.z5 { background: var(--red-dim); color: var(--red); }
        .session-badge.str { background: var(--purple-dim); color: var(--purple); }
        .session-badge.sim { background: var(--cyan-dim); color: var(--cyan); }
        .session-badge.rest { background: rgba(255,255,255,0.08); color: var(--text-secondary); }
        
        /* Navigation */
        .nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(12,12,12,0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 8px 16px calc(8px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: space-around;
            z-index: 50;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 8px 20px;
            background: none;
            border: none;
            color: var(--text-tertiary);
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-item.active {
            color: var(--blue);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
        }
        
        /* Utilities */
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 100px;
        }
        .px-5 { padding-left: 20px; padding-right: 20px; }
        .py-4 { padding-top: 16px; padding-bottom: 16px; }
        .mb-3 { margin-bottom: 12px; }
        .mb-4 { margin-bottom: 16px; }
        .mb-5 { margin-bottom: 20px; }
        .mt-4 { margin-top: 16px; }
        .mt-5 { margin-top: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .flex { display: flex; }
        .flex-between { justify-content: space-between; }
        .flex-center { align-items: center; }
        .gap-3 { gap: 12px; }
        .text-center { text-align: center; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-up {
            animation: fadeUp 0.5s ease-out forwards;
        }
        .delay-1 { animation-delay: 0.05s; opacity: 0; }
        .delay-2 { animation-delay: 0.1s; opacity: 0; }
        .delay-3 { animation-delay: 0.15s; opacity: 0; }
        .delay-4 { animation-delay: 0.2s; opacity: 0; }
        .delay-5 { animation-delay: 0.25s; opacity: 0; }
        
        @keyframes countUp {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ============================================
// CONFIGURATION
// ============================================
const CONFIG = {
    sheetId: '1BlGGukORumWb7508lcu-SS0wF8lMwdOJEsOp-vGCKrc',
    sheets: { workouts: 'Workouts', daily: 'DailyMetrics' },
    targets: { vo2max: 48, twoKm: 465, threshold: 255, weeklyKm: 50, raceTime: 3900 },
    baselines: { vo2max: 43.5, twoKm: 540, threshold: 285 },
    profile: { name: 'Lad', hrBaseline: 55, raceDate: '2027-04-15', raceName: 'Malaga' }
};

// ============================================
// UTILITIES
// ============================================
const storage = {
    get: (k, d) => { try { return JSON.parse(localStorage.getItem('hyrox12_' + k)) || d; } catch { return d; } },
    set: (k, v) => localStorage.setItem('hyrox12_' + k, JSON.stringify(v))
};

const fmt = {
    time: (s) => s > 0 ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}` : '—',
    pace: (s) => s > 0 ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}/km` : '—',
    duration: (m) => m >= 60 ? `${Math.floor(m / 60)}h ${Math.round(m % 60)}m` : `${Math.round(m)}min`,
    decimal: (n, d = 1) => n != null ? n.toFixed(d) : '—',
    percent: (n) => n != null ? `${Math.round(n)}%` : '—'
};

const parseTime = (str) => {
    if (!str) return 0;
    const p = str.toString().split(':');
    return p.length === 2 ? parseInt(p[0]) * 60 + parseInt(p[1]) : 0;
};

const math = {
    mean: (arr) => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0,
    sum: (arr) => arr.reduce((a, b) => a + b, 0),
    std: (arr) => {
        const m = math.mean(arr);
        return Math.sqrt(arr.reduce((s, v) => s + Math.pow(v - m, 2), 0) / arr.length);
    },
    clamp: (n, min, max) => Math.min(Math.max(n, min), max)
};

// ============================================
// DATA FETCHING
// ============================================
const fetchSheet = async (name) => {
    try {
        const url = `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(name)}`;
        const res = await fetch(url);
        const txt = await res.text();
        const json = JSON.parse(txt.substring(47).slice(0, -2));
        const headers = json.table.cols.map(c => c.label || '');
        
        let rawData = json.table.rows?.map(row => {
            const obj = {};
            row.c?.forEach((cell, i) => {
                if (headers[i]) {
                    if (headers[i] === 'Date') {
                        obj[headers[i]] = cell?.f || cell?.v || null;
                    } else {
                        obj[headers[i]] = cell?.v ?? cell?.f ?? null;
                    }
                }
            });
            return obj;
        }).filter(o => o['Date']) || [];
        
        // Aggregate rows by date — Health Auto Export writes fragments across multiple rows
        if (name === CONFIG.sheets.daily) {
            const byDate = {};
            const sleepCols = new Set(['Sleep Duration (hr)', 'Deep Sleep (hr)', 'REM Sleep (hr)']);
            // Bounds for physiological sanity — discard values outside these ranges
            const metricBounds = {
                'Resting HR': { min: 30, max: 120 },
                'HRV (ms)': { min: 1, max: 250 },
                'Walking HR': { min: 40, max: 200 },
                'VO2 Max': { min: 20, max: 80 },
                'Sleep Duration (hr)': { min: 0.5, max: 16 },
                'Deep Sleep (hr)': { min: 0, max: 8 },
                'REM Sleep (hr)': { min: 0, max: 8 },
            };
            rawData.forEach(row => {
                const d = row['Date'];
                if (!byDate[d]) byDate[d] = { Date: d };
                headers.forEach(h => {
                    if (h && h !== 'Date') {
                        const val = parseFloat(row[h]);
                        if (!isNaN(val) && val > 0) {
                            // Bounds check: discard physiologically impossible values
                            const bounds = metricBounds[h];
                            if (bounds && (val < bounds.min || val > bounds.max)) {
                                console.log(`[DailyMetrics] Discarding ${h}=${val} on ${d} (bounds: ${bounds.min}-${bounds.max})`);
                                return;
                            }
                            if (h === 'Steps' || h === 'Active Calories') {
                                // Sum accumulative metrics
                                byDate[d][h] = (byDate[d][h] || 0) + val;
                            } else if (sleepCols.has(h)) {
                                // Sleep: take MAX value (HAE sends running fragments, highest = most complete)
                                byDate[d][h] = Math.max(byDate[d][h] || 0, val);
                            } else {
                                // Everything else: take latest non-null
                                byDate[d][h] = val;
                            }
                        }
                    }
                });
            });
            const merged = Object.values(byDate);
            const sleepRows = merged.filter(r => r['Sleep Duration (hr)'] > 0);
            console.log(`[${name}] ${rawData.length} raw rows → ${merged.length} days, ${sleepRows.length} with sleep data`);
            return merged;
        }
        
        console.log(`[${name}] Loaded ${rawData.length} rows`);
        
        // Clean up workout durations — Health Auto Export sometimes sends seconds instead of minutes
        if (name === CONFIG.sheets.workouts) {
            rawData.forEach(w => {
                let dur = parseFloat(w['Duration (min)']) || 0;
                const dist = parseFloat(w['Distance (km)']) || 0;

                if (dur <= 0) return;

                // Method 1: If we have distance, check if pace is impossible (>30 min/km means dur is in seconds)
                if (dist > 0) {
                    const paceMinPerKm = dur / dist;
                    if (paceMinPerKm > 30) {
                        w['Duration (min)'] = (dur / 60).toFixed(1);
                        return;
                    }
                }

                // Method 2: No distance — use calorie rate as sanity check
                // A reasonable workout burns 5-20 cal/min. If cal/min < 1, dur is likely in seconds
                const cal = parseFloat(w['Calories']) || 0;
                if (cal > 0) {
                    const calPerMin = cal / dur;
                    const calPerMinConverted = cal / (dur / 60);
                    // If current rate is unrealistically low AND converting to minutes gives a realistic rate
                    if (calPerMin < 1.0 && calPerMinConverted >= 3 && calPerMinConverted <= 25) {
                        w['Duration (min)'] = (dur / 60).toFixed(1);
                        return;
                    }
                }

                // Method 3: Duration > 300 with no distance and no calories — almost certainly seconds
                if (dur > 300 && dist === 0 && cal === 0) {
                    w['Duration (min)'] = (dur / 60).toFixed(1);
                }
            });

            // Zero out distance for non-distance workout types
            const nonDistanceTypes = new Set([
                'Traditional Strength Training', 'Functional Strength Training',
                'Rowing', 'Stair Climbing', 'Elliptical', 'Indoor Cycling',
                'Yoga', 'Core Training', 'Flexibility', 'Cooldown',
                'High Intensity Interval Training'
            ]);
            rawData.forEach(w => {
                const wType = w['Workout Type'] || '';
                if (nonDistanceTypes.has(wType)) {
                    w['Distance (km)'] = 0;
                }
            });

            // Deduplicate workouts client-side (date + type + similar duration)
            const seen = new Set();
            rawData = rawData.filter(w => {
                const dur = Math.round(parseFloat(w['Duration (min)']) || 0);
                const key = `${w['Date']}|${w['Workout Type']}|${dur}`;
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
            });

            // Cross-date dedup: remove workouts with identical fingerprint on different dates
            // (HAE re-sync can copy the same workout to an adjacent date)
            const fingerprints = new Set();
            rawData = rawData.filter(w => {
                const dur = Math.round(parseFloat(w['Duration (min)']) || 0);
                const cal = Math.round(parseFloat(w['Calories']) || 0);
                const hr = Math.round(parseFloat(w['Avg HR']) || 0);
                const dist = Math.round((parseFloat(w['Distance (km)']) || 0) * 10); // 1 decimal precision
                const fp = `${w['Workout Type']}|${dur}|${cal}|${hr}|${dist}`;
                if (fingerprints.has(fp)) {
                    console.log(`[Workouts] Cross-date duplicate removed: ${w['Date']} ${w['Workout Type']} ${dur}min`);
                    return false;
                }
                fingerprints.add(fp);
                return true;
            });

            console.log(`[Workouts] After cleanup: ${rawData.length} workouts`);
        }
        
        return rawData;
    } catch (e) {
        console.error(`[${name}] Error:`, e);
        return [];
    }
};

// INSIGHT ENGINE
// ============================================
const InsightEngine = {
    // Calculate Readiness Score (0-100) — Oura/WHOOP-inspired
    readiness: (data) => {
        const { restingHR, hrv, sleep, hrAvg7, hrvAvg7, 
                hrvAvg14, hrvBaseline60, hrvTrend3d, 
                trimpYesterday, trimpAvg7 } = data;
        
        // Track which components have real data
        const hasHR = restingHR != null && restingHR > 0;
        const hasHRV = hrv != null && hrv > 0;
        // Sanitize sleep: HAE fragments can sum to 35+ hours in the sheet.
        // Valid human sleep is 0.5-16 hours. Anything outside = bad data.
        let cleanSleep = sleep;
        if (cleanSleep != null && (cleanSleep > 16 || cleanSleep < 0.5)) {
            console.log(`[Sleep] Discarding invalid sleep value: ${cleanSleep}h`);
            cleanSleep = null;
        }
        const hasSleep = cleanSleep != null && cleanSleep > 0.5;
        const hasHRVBalance = hrvAvg14 > 0 && hrvBaseline60 > 0;
        
        // ═══════════════════════════════════════
        // HR Component (0-25) — lower is better vs 7-day avg
        // ═══════════════════════════════════════
        let hrScore = 12, hrStatus = 'no data', hrDiff = 0;
        if (hasHR && hrAvg7 > 0) {
            hrDiff = ((restingHR - hrAvg7) / hrAvg7) * 100;
            hrScore = hrDiff <= -3 ? 25 : hrDiff <= 0 ? 22 : hrDiff <= 3 ? 18 : hrDiff <= 6 ? 12 : 6;
            hrStatus = hrDiff <= 0 ? 'optimal' : hrDiff <= 3 ? 'normal' : hrDiff <= 6 ? 'elevated' : 'high';
        }
        
        // ═══════════════════════════════════════
        // HRV Component (0-30) — Oura-style HRV Balance
        // Compares 14-day weighted avg to 60-day baseline
        // Only flags "depleted" if trend declining 3+ days
        // ═══════════════════════════════════════
        let hrvScore = 15, hrvStatus = 'no data', hrvBalancePct = 0;
        if (hasHRVBalance) {
            // HRV Balance: how does recent (14d weighted) compare to baseline (60d)?
            hrvBalancePct = ((hrvAvg14 - hrvBaseline60) / hrvBaseline60) * 100;
            
            // Trend matters: is HRV declining over last 3 days?
            const isTrendingDown = hrvTrend3d < -5; // 3-day slope negative >5%
            
            if (hrvBalancePct >= 5) {
                hrvScore = 30;
                hrvStatus = 'strong';
            } else if (hrvBalancePct >= -5) {
                hrvScore = isTrendingDown ? 20 : 25;
                hrvStatus = isTrendingDown ? 'declining' : 'normal';
            } else if (hrvBalancePct >= -15) {
                hrvScore = isTrendingDown ? 12 : 16;
                hrvStatus = isTrendingDown ? 'low' : 'below avg';
            } else {
                hrvScore = isTrendingDown ? 6 : 10;
                hrvStatus = 'depleted';
            }
        } else if (hasHRV && hrvAvg7 > 0) {
            // Fallback: simple comparison to 7-day avg (less than 14 days of data)
            hrvBalancePct = ((hrv - hrvAvg7) / hrvAvg7) * 100;
            hrvScore = hrvBalancePct >= 5 ? 28 : hrvBalancePct >= -5 ? 22 : hrvBalancePct >= -15 ? 14 : 8;
            hrvStatus = hrvBalancePct >= 5 ? 'strong' : hrvBalancePct >= -5 ? 'normal' : hrvBalancePct >= -15 ? 'low' : 'depleted';
        }
        
        // ═══════════════════════════════════════
        // Sleep Component (0-25)
        // No phantom credit: if no data, score = 0 and excluded from max
        // ═══════════════════════════════════════
        let sleepScore = 0, sleepStatus = 'no data';
        if (hasSleep) {
            sleepScore = cleanSleep >= 8 ? 25 : cleanSleep >= 7 ? 22 : cleanSleep >= 6 ? 16 : cleanSleep >= 5 ? 10 : 5;
            sleepStatus = cleanSleep >= 7.5 ? 'optimal' : cleanSleep >= 6.5 ? 'good' : cleanSleep >= 5.5 ? 'fair' : 'poor';
        }
        
        // ═══════════════════════════════════════
        // Training Load (0-20) — TRIMP-based
        // TRIMP = Duration × (Avg HR / Max HR)
        // Compare yesterday's TRIMP to 7-day rolling avg
        // ═══════════════════════════════════════
        let loadScore = 10, loadRatio = 1, loadStatus = 'no data';
        if (trimpAvg7 > 0) {
            loadRatio = trimpYesterday / trimpAvg7;
            if (loadRatio <= 0.3) {
                loadScore = 18; loadStatus = 'rest day';
            } else if (loadRatio <= 0.8) {
                loadScore = 20; loadStatus = 'light';
            } else if (loadRatio <= 1.2) {
                loadScore = 16; loadStatus = 'normal';
            } else if (loadRatio <= 1.5) {
                loadScore = 12; loadStatus = 'moderate';
            } else if (loadRatio <= 2.0) {
                loadScore = 8; loadStatus = 'heavy';
            } else {
                loadScore = 4; loadStatus = 'overreaching';
            }
        } else if (trimpYesterday === 0) {
            loadScore = 18; loadStatus = 'rest day';
        }
        
        // Score with dynamic max: exclude missing components rather than giving phantom credit
        const rawTotal = hrScore + hrvScore + sleepScore + loadScore;
        const maxAvailable = (hasHR && hrAvg7 > 0 ? 25 : 0)
            + (hasHRV || hasHRVBalance ? 30 : 0)
            + (hasSleep ? 25 : 0)
            + 20; // load always has a calculation path
        const total = maxAvailable > 0 ? Math.round((rawTotal / maxAvailable) * 100) : 50;

        // Track what data is missing for UI warnings
        const missingData = [];
        if (!hasSleep) missingData.push('sleep');
        if (!hasHR || hrAvg7 <= 0) missingData.push('heart rate');
        if (!hasHRV && !hasHRVBalance) missingData.push('HRV');

        const getMessage = (score) => {
            if (score >= 85) return { text: "You're primed. Great day for intensity.", status: 'peak' };
            if (score >= 70) return { text: "Good recovery. Train as planned.", status: 'good' };
            if (score >= 55) return { text: "Moderate recovery. Listen to your body.", status: 'moderate' };
            if (score >= 40) return { text: "Recovery incomplete. Consider going easy.", status: 'low' };
            return { text: "Rest recommended. Your body needs recovery.", status: 'rest' };
        };

        return {
            score: total,
            message: getMessage(total),
            missingData,
            components: {
                hr: { score: hrScore, max: 25, value: restingHR, avg: hrAvg7, diff: hrDiff, status: hrStatus },
                hrv: { score: hrvScore, max: 30, value: hrv, avg7: hrvAvg7, avg14: hrvAvg14, baseline60: hrvBaseline60, balance: hrvBalancePct, trend3d: hrvTrend3d, status: hrvStatus },
                sleep: { score: sleepScore, max: 25, value: cleanSleep, status: sleepStatus, hasSleep },
                load: { score: loadScore, max: 20, ratio: loadRatio, trimp: trimpYesterday, avg: trimpAvg7, status: loadStatus }
            }
        };
    },
    
    // Calculate Aerobic Score
    aerobic: (data) => {
        const { vo2max, weeklyKm, weeklyMins, vo2History, volHistory } = data;
        
        // VO2max progress (0-50)
        const vo2Progress = ((vo2max - CONFIG.baselines.vo2max) / (CONFIG.targets.vo2max - CONFIG.baselines.vo2max)) * 50;
        const vo2Score = math.clamp(vo2Progress, 0, 50);
        
        // Volume progress (0-30)
        const volProgress = (weeklyKm / CONFIG.targets.weeklyKm) * 30;
        const volScore = math.clamp(volProgress, 0, 30);
        
        // Consistency (0-20) - based on training days
        const consistencyScore = weeklyMins > 0 ? 20 : 5;
        
        const total = Math.round(vo2Score + volScore + consistencyScore);
        
        // Trend calculation
        const vo2Trend = vo2History.length >= 4
            ? vo2History[vo2History.length - 1] - vo2History[Math.max(0, vo2History.length - 5)]
            : 0;
        
        // Time to target
        const weeklyGain = vo2Trend / 4;
        const weeksToTarget = weeklyGain > 0 ? Math.round((CONFIG.targets.vo2max - vo2max) / weeklyGain) : null;
        
        return {
            score: total,
            vo2max,
            weeklyKm,
            weeklyMins,
            vo2Trend,
            trend: vo2Trend > 0.3 ? 'improving' : vo2Trend < -0.3 ? 'declining' : 'stable',
            weeksToTarget,
            insight: vo2Trend > 0 
                ? { title: 'Engine growing', text: `VO₂max up ${vo2Trend.toFixed(1)} recently`, color: 'green' }
                : vo2Trend < -0.3
                ? { title: 'VO₂max declining', text: 'May need more aerobic work', color: 'orange' }
                : { title: 'Holding steady', text: 'Consistent base maintenance', color: 'blue' }
        };
    },
    
    // Predict Race Time
    racePrediction: (data) => {
        const { twoKm, threshold, weeklyKm, paceDecay, vo2max } = data;
        
        // Base from threshold or estimate
        const effectiveThreshold = threshold || (twoKm ? twoKm / 2 * 1.12 : CONFIG.baselines.threshold);
        
        // Run time: 8km at threshold + 8% fatigue factor
        const racePace = effectiveThreshold * 1.08;
        const runTime = 8 * racePace;
        
        // Station time: base 30min, adjust for fitness
        const stationBase = 30 * 60;
        const vo2Adjust = (CONFIG.targets.vo2max - (vo2max || CONFIG.baselines.vo2max)) * 12;
        const stationTime = stationBase + vo2Adjust;
        
        // Adjustments
        const volumeBonus = Math.max(0, (weeklyKm - 25) * 2);
        const speedBonus = twoKm ? Math.max(0, (CONFIG.baselines.twoKm - twoKm) * 0.6) : 0;
        const fatiguePenalty = paceDecay ? Math.max(0, (paceDecay - 5) * 20) : 0;
        
        const predicted = Math.round(runTime + stationTime - volumeBonus - speedBonus + fatiguePenalty);
        const gap = predicted - CONFIG.targets.raceTime;
        
        // Confidence based on test data
        const tests = [twoKm, threshold, paceDecay].filter(Boolean).length;
        const confidence = tests >= 3 ? 'high' : tests >= 2 ? 'medium' : 'low';
        
        return {
            predicted,
            formatted: fmt.time(predicted),
            gap,
            confidence,
            breakdown: { runTime, stationTime, volumeBonus, speedBonus, fatiguePenalty },
            insight: gap <= 0
                ? { title: 'On track for 1:05!', text: 'Maintain consistency', color: 'green' }
                : gap <= 300
                ? { title: `${Math.round(gap / 60)} min to find`, text: 'You\'re close to target', color: 'blue' }
                : { title: 'Building toward goal', text: 'Focus on consistency', color: 'orange' }
        };
    },
    
    // HYROX Readiness (fatigue resistance)
    hyroxReady: (data) => {
        const { latestSim, simHistory } = data;
        
        if (!latestSim) {
            return {
                score: null,
                hasSim: false,
                insight: { title: 'No data yet', text: 'Log a mini-sim to track', color: 'blue' }
            };
        }
        
        const decay = parseFloat(latestSim.decay) || 0;
        const total = latestSim.total || 0;
        
        // Decay score (0-50) - lower is better
        const decayScore = decay <= 3 ? 50 : decay <= 5 ? 42 : decay <= 8 ? 30 : decay <= 12 ? 18 : 8;
        
        // Time score (0-50) - target ~25:40 (1540s)
        const timeScore = math.clamp(((1800 - total) / (1800 - 1400)) * 50, 0, 50);
        
        const score = Math.round(decayScore + timeScore);
        
        // Trend
        const trend = simHistory.length >= 2
            ? simHistory[simHistory.length - 1].total < simHistory[simHistory.length - 2].total ? 'improving' : 'stable'
            : 'stable';
        
        return {
            score,
            hasSim: true,
            total,
            decay,
            trend,
            latestSim,
            insight: decay > 8
                ? { title: 'Fatigue resistance is limiting', text: `${decay}% decay — target <5%`, color: 'orange' }
                : decay > 5
                ? { title: 'Room to improve', text: 'More running after strength work', color: 'blue' }
                : { title: 'Strong fatigue resistance', text: 'Pacing is solid', color: 'green' }
        };
    }
};

// Beautiful Line Chart with gradient fill
const LineChart = ({ data, color = 'var(--green)', height = 160 }) => {
    if (!data || data.length < 2) {
        return (
            <div style={{ height, display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'var(--text-tertiary)' }}>
                Not enough data yet
            </div>
        );
    }
    
    const values = data.filter(v => v != null && !isNaN(v));
    if (values.length < 2) return null;
    
    const min = Math.min(...values);
    const max = Math.max(...values);
    const range = max - min || 1;
    const padding = range * 0.1;
    const yMin = min - padding;
    const yMax = max + padding;
    const yRange = yMax - yMin;
    
    const width = 300;
    const h = height - 30;
    
    const points = values.map((v, i) => ({
        x: (i / (values.length - 1)) * width,
        y: h - ((v - yMin) / yRange) * h
    }));
    
    // Create smooth curve
    const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
    const areaD = pathD + ` L ${width} ${h} L 0 ${h} Z`;
    
    const gradientId = `grad-${Math.random().toString(36).substr(2, 9)}`;
    
    return (
        <div className="chart-container" style={{ height }}>
            <svg viewBox={`0 0 ${width} ${height}`} className="chart-svg" preserveAspectRatio="none">
                <defs>
                    <linearGradient id={gradientId} x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stopColor={color} stopOpacity="0.4" />
                        <stop offset="100%" stopColor={color} stopOpacity="0" />
                    </linearGradient>
                </defs>
                
                {/* Grid lines */}
                {[0.25, 0.5, 0.75].map((p, i) => (
                    <line key={i} x1="0" y1={h * p} x2={width} y2={h * p} className="chart-grid-line" />
                ))}
                
                {/* Area fill */}
                <path d={areaD} fill={`url(#${gradientId})`} />
                
                {/* Line */}
                <path d={pathD} className="chart-line" stroke={color} />
                
                {/* Dots - show fewer for cleaner look */}
                {values.length <= 15 && points.map((p, i) => (
                    <circle key={i} cx={p.x} cy={p.y} r={i === points.length - 1 ? 5 : 3} 
                        fill={i === points.length - 1 ? color : 'var(--bg)'} 
                        stroke={color} className="chart-dot" />
                ))}
                
                {/* Y-axis labels */}
                <text x="4" y="14" className="chart-label">{max.toFixed(1)}</text>
                <text x="4" y={h - 4} className="chart-label">{min.toFixed(1)}</text>
            </svg>
        </div>
    );
};

// Progress Ring (Oura style)
const ProgressRing = ({ value, max = 100, size = 80, strokeWidth = 6, color = 'var(--green)' }) => {
    const radius = (size - strokeWidth) / 2;
    const circumference = 2 * Math.PI * radius;
    const progress = math.clamp(value / max, 0, 1);
    const offset = circumference - progress * circumference;
    
    return (
        <div className="ring-container" style={{ width: size, height: size }}>
            <svg width={size} height={size} className="ring-svg">
                <circle cx={size/2} cy={size/2} r={radius} strokeWidth={strokeWidth} className="ring-bg" />
                <circle 
                    cx={size/2} cy={size/2} r={radius} 
                    strokeWidth={strokeWidth} 
                    stroke={color}
                    strokeDasharray={circumference}
                    strokeDashoffset={offset}
                    className="ring-progress"
                />
            </svg>
            <div className="ring-value" style={{ color }}>{Math.round(value)}</div>
        </div>
    );
};

// Volume Detail Modal - shows breakdown of all workouts this week
const VolumeModal = ({ stats, targetVol, onClose }) => {
    const { weeklyKm, weeklyMins, weekWorkouts } = stats;
    
    // Sort workouts by date
    const sorted = [...weekWorkouts].sort((a, b) => new Date(a['Date']) - new Date(b['Date']));
    
    // Group by date
    const byDate = {};
    sorted.forEach(w => {
        const d = w['Date'];
        if (!byDate[d]) byDate[d] = [];
        byDate[d].push(w);
    });
    
    // Calculate totals by workout type
    const byType = {};
    sorted.forEach(w => {
        const type = w['Workout Type'] || 'Unknown';
        if (!byType[type]) byType[type] = { count: 0, km: 0, mins: 0, cal: 0 };
        byType[type].count++;
        byType[type].km += parseFloat(w['Distance (km)']) || 0;
        byType[type].mins += parseFloat(w['Duration (min)']) || 0;
        byType[type].cal += parseFloat(w['Calories']) || 0;
    });
    
    const runKm = sorted.reduce((s, w) => s + (parseFloat(w['Distance (km)']) || 0), 0);
    const totalSessions = sorted.length;
    
    // Day name helper
    const getDayName = (dateStr) => {
        const d = new Date(dateStr);
        return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()];
    };
    
    return (
        <div className="modal-overlay open" onClick={onClose}>
            <div className="modal-sheet hide-scrollbar" onClick={e => e.stopPropagation()}>
                <div className="modal-handle" />
                <div className="modal-hero" style={{ background: 'linear-gradient(135deg, #0a2a4a 0%, #0a1525 60%, #080d12 100%)' }}>
                    <button className="modal-back" onClick={onClose}>‹</button>
                    <p className="label" style={{ marginBottom: 12 }}>THIS WEEK</p>
                    <div style={{ display: 'flex', alignItems: 'baseline', gap: 12 }}>
                        <span className="value-hero" style={{ color: 'var(--blue)' }}>{runKm.toFixed(1)}</span>
                        <span style={{ fontSize: 20, color: 'var(--text-secondary)' }}>km</span>
                    </div>
                    <div style={{ display: 'flex', gap: 20, marginTop: 12 }}>
                        <span style={{ fontSize: 14, color: 'var(--text-secondary)' }}>{totalSessions} sessions</span>
                        <span style={{ fontSize: 14, color: 'var(--text-secondary)' }}>{fmt.duration(weeklyMins)} total</span>
                    </div>
                    <div className="progress-bar" style={{ marginTop: 16 }}>
                        <div className="progress-fill" style={{ 
                            width: `${Math.min(100, (runKm / targetVol) * 100)}%`,
                            background: runKm >= targetVol ? 'var(--green)' : 'var(--blue)'
                        }} />
                    </div>
                    <p style={{ fontSize: 12, color: 'var(--text-tertiary)', marginTop: 6 }}>
                        {runKm >= targetVol ? '✓ Phase target met' : `${(targetVol - runKm).toFixed(1)}km to phase target (${Math.round(targetVol)}km)`}
                    </p>
                </div>
                
                <div className="modal-body">
                    {/* By Type */}
                    <div className="modal-section">
                        <p className="label" style={{ marginBottom: 12 }}>BY TYPE</p>
                        {Object.entries(byType).map(([type, data]) => (
                            <DataRow 
                                key={type} 
                                label={type} 
                                sublabel={`${data.count} session${data.count > 1 ? 's' : ''}${data.cal > 0 ? ' · ' + data.cal + ' cal' : ''}`}
                                value={data.km > 0 ? `${data.km.toFixed(1)} km` : fmt.duration(data.mins)}
                            />
                        ))}
                    </div>
                    
                    {/* Day by Day */}
                    <div className="modal-section">
                        <p className="label" style={{ marginBottom: 12 }}>DAY BY DAY</p>
                        {Object.entries(byDate).map(([date, sessions]) => (
                            <div key={date} style={{ marginBottom: 16 }}>
                                <p style={{ fontSize: 13, fontWeight: 600, color: 'var(--text-secondary)', marginBottom: 8 }}>
                                    {getDayName(date)} · {new Date(date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}
                                </p>
                                {sessions.map((w, i) => {
                                    const dist = parseFloat(w['Distance (km)']) || 0;
                                    const dur = parseFloat(w['Duration (min)']) || 0;
                                    const hr = parseFloat(w['Avg HR']) || 0;
                                    const pace = parseFloat(w['Avg Pace (sec/km)']) || 0;
                                    
                                    return (
                                        <div key={i} style={{ 
                                            padding: '12px 16px', 
                                            background: 'var(--card-elevated)', 
                                            borderRadius: 12, 
                                            marginBottom: 6 
                                        }}>
                                            <div className="flex flex-between flex-center">
                                                <p style={{ fontWeight: 500, fontSize: 15 }}>{w['Workout Type']}</p>
                                                <p style={{ fontWeight: 600, color: dist > 0 ? 'var(--blue)' : 'var(--cyan)' }}>
                                                    {dist > 0 ? `${dist.toFixed(1)} km` : fmt.duration(dur)}
                                                </p>
                                            </div>
                                            <div style={{ display: 'flex', gap: 16, marginTop: 6 }}>
                                                {dur > 0 && dist > 0 && <span style={{ fontSize: 12, color: 'var(--text-tertiary)' }}>{fmt.duration(dur)}</span>}
                                                {pace > 0 && pace < 600 && <span style={{ fontSize: 12, color: 'var(--text-tertiary)' }}>{fmt.pace(pace)}</span>}
                                                {hr > 0 && <span style={{ fontSize: 12, color: 'var(--text-tertiary)' }}>❤️ {hr} bpm</span>}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        ))}
                    </div>
                    
                    {totalSessions === 0 && (
                        <div style={{ textAlign: 'center', padding: '40px 20px', color: 'var(--text-tertiary)' }}>
                            <p style={{ fontSize: 48, marginBottom: 16 }}>🏃</p>
                            <p>No workouts recorded this week yet</p>
                        </div>
                    )}
                </div>
            </div>
        </div>
    );
};

// Test Input Modal
const TestModal = ({ type, onClose, onSave }) => {
    const [value, setValue] = useState('');
    const [station, setStation] = useState('Row 500m');
    const [rounds, setRounds] = useState([{r:'',s:''},{r:'',s:''},{r:'',s:''},{r:'',s:''}]);
    
    const handleSave = () => {
        const date = new Date().toISOString().split('T')[0];
        if (type === 'twoKm' && parseTime(value) > 0) {
            onSave({ type: 'twoKm', date, time: parseTime(value) });
        } else if (type === 'threshold' && parseFloat(value) > 0) {
            const d = parseFloat(value);
            onSave({ type: 'threshold', date, distance: d, pace: Math.round(1200 / d) });
        } else if (type === 'miniSim') {
            const parsed = rounds.map(r => ({ run: parseTime(r.r), st: parseTime(r.s) }));
            const total = parsed.reduce((s, r) => s + r.run + r.st, 0);
            const decay = parsed[0].run > 0 ? (((parsed[3].run - parsed[0].run) / parsed[0].run) * 100).toFixed(1) : '0';
            if (total > 0) onSave({ type: 'miniSim', date, station, rounds: parsed, total, decay });
        }
        onClose();
    };
    
    const inputStyle = { width: '100%', padding: 14, background: 'var(--card-elevated)', border: '1px solid var(--border)', borderRadius: 12, color: 'white', fontSize: 17 };
    
    return (
        <div className="modal-overlay open" onClick={onClose}>
            <div className="modal-sheet" onClick={e => e.stopPropagation()}>
                <div className="modal-handle" />
                <div style={{ padding: 24 }}>
                    <h2 style={{ fontSize: 22, fontWeight: 600, marginBottom: 24 }}>
                        {type === 'twoKm' ? 'Log 2km Time Trial' : type === 'threshold' ? 'Log 20-min Test' : 'Log Mini-Sim'}
                    </h2>
                    
                    {type === 'twoKm' && (
                        <div>
                            <p className="label" style={{ marginBottom: 8 }}>Time (m:ss)</p>
                            <input type="text" placeholder="9:00" value={value} onChange={e => setValue(e.target.value)} style={inputStyle} />
                        </div>
                    )}
                    
                    {type === 'threshold' && (
                        <div>
                            <p className="label" style={{ marginBottom: 8 }}>Distance in 20 min (km)</p>
                            <input type="number" step="0.01" placeholder="4.50" value={value} onChange={e => setValue(e.target.value)} style={inputStyle} />
                        </div>
                    )}
                    
                    {type === 'miniSim' && (
                        <div>
                            <p className="label" style={{ marginBottom: 8 }}>Station</p>
                            <select value={station} onChange={e => setStation(e.target.value)} style={{ ...inputStyle, marginBottom: 16 }}>
                                <option>Row 500m</option>
                                <option>Ski Erg 500m</option>
                                <option>Wall Balls ×30</option>
                                <option>Burpees ×15</option>
                            </select>
                            {rounds.map((r, i) => (

                                        onChange={e => { const n = [...rounds]; n[i].r = e.target.value; setRounds(n); }} 
                                        style={{ ...inputStyle, padding: 12, fontSize: 15 }} />
                                    <input type="text" placeholder="Station (m:ss)" value={r.s}
                                        onChange={e => { const n = [...rounds]; n[i].s = e.target.value; setRounds(n); }}
                                        style={{ ...inputStyle, padding: 12, fontSize: 15 }} />
                                </div>
                            ))}
                        </div>
                    )}
                    
                    <div className="grid-2 mt-5">
                        <button onClick={onClose} style={{ padding: 16, background: 'var(--card-elevated)', border: '1px solid var(--border)', borderRadius: 14, color: 'white', fontWeight: 500, cursor: 'pointer' }}>Cancel</button>
                        <button onClick={handleSave} style={{ padding: 16, background: 'var(--blue)', border: 'none', borderRadius: 14, color: 'white', fontWeight: 600, cursor: 'pointer' }}>Save</button>
                    </div>
                </div>
            </div>
        </div>
    );
};

            .map(d => ({ date: new Date(d['Date']), hrv: parseFloat(d['HRV (ms)']) }))

                const weight = d.date >= fiveDaysAgo ? 2 : 1;
                weightedSum += d.hrv * weight;
                totalWeight += weight;
            });
            hrvAvg14 = weightedSum / totalWeight;
        }
        
        // 60-day baseline
        const hrv60 = allHRVWithDates.filter(d => d.date >= last60);
        const hrvBaseline60 = hrv60.length >= 7 ? math.mean(hrv60.map(d => d.hrv)) : 0;
        
        // 3-day trend: are last 3 readings declining?

        // ═══ TRIMP-based Training Load ═══
        // TRIMP = duration_mins × (avgHR / maxHR)
        // maxHR estimated as 220 - age (42) = 178

            const dur = parseFloat(workout['Duration (min)']) || 0;
            const avgHR = parseFloat(workout['Avg HR']) || 0;

            if (avgHR <= 0) return dur * 0.5; // No HR data: assume moderate effort

                                text={`+${vo2Change.toFixed(1)} increase. Your aerobic base is developing well.`}
                                color="green"
                            />
                        )}

                        {totalKm / (days / 7) >= 30 ? (
                            <InsightBox
                                title="Strong volume consistency"
                                text={`Averaging ${(totalKm / (days / 7)).toFixed(0)}km/week. This consistency drives adaptation.`}
                                color="green"
                            />
                        ) : (
                            <InsightBox
                                title="Volume opportunity"
                                text={`Averaging ${(totalKm / (days / 7)).toFixed(0)}km/week. Building to 40-50km would accelerate progress.`}
                                color="orange"
                            />
                        )}
                    </div>
                )}
            </div>
        );
    };
    
    // ============================================
    // RENDER
    // ============================================
    return (
        <>
            {tab === 'home' && renderHome()}
            {tab === 'plan' && renderPlan()}
            {tab === 'history' && renderHistory()}
            
            {/* Navigation */}
            <nav className="nav">
                <button className={`nav-item ${tab === 'home' ? 'active' : ''}`} onClick={() => setTab('home')}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    <span>Home</span>
                </button>
                <button className={`nav-item ${tab === 'plan' ? 'active' : ''}`} onClick={() => setTab('plan')}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                        <rect x="3" y="4" width="18" height="18" rx="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <span>Plan</span>
                </button>
                <button className={`nav-item ${tab === 'history' ? 'active' : ''}`} onClick={() => setTab('history')}>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
                    </svg>
                    <span>History</span>
                </button>
            </nav>
            
            {/* Modals */}
            {modal?.type === 'readiness' && (
                <ReadinessModal data={readiness} onClose={() => setModal(null)} />
            )}
            {modal?.type === 'aerobic' && (
                <AerobicModal data={aerobic} history={{ vo2: historyData.vo2History }} onClose={() => setModal(null)} />
            )}
            {modal?.type === 'raceFitness' && (
                <RaceFitnessModal 
                    data={racePrediction} 
                    tests={latestTests}
                    onClose={() => setModal(null)}
                    onLogTest={(t) => { setModal(null); setTestModal(t); }}
                />
            )}
            {modal?.type === 'hyroxReady' && (
                <HyroxReadyModal 
                    data={hyroxReady}
                    history={tests.miniSim || []}
                    onClose={() => setModal(null)}
                    onLogTest={(t) => { setModal(null); setTestModal(t); }}
                />
            )}
            {modal?.type === 'session' && (
                <SessionModal session={modal.data} onClose={() => setModal(null)} />
            )}
            {modal?.type === 'volume' && (
                <VolumeModal stats={workoutStats} targetVol={currentTargetVol} onClose={() => setModal(null)} />
            )}
            {testModal && (
                <TestModal type={testModal} onClose={() => setTestModal(null)} onSave={handleTestSave} />
            )}
        </>
    );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
    </script>
</body>
</html>
