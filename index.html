// Volume Detail Modal - shows breakdown of all workouts this week
const VolumeModal = ({ stats, targetVol, onClose }) => {
    const { weeklyKm, weeklyMins, weekWorkouts } = stats;
    
    // Sort workouts by date
    const sorted = [...weekWorkouts].sort((a, b) => new Date(a['Date']) - new Date(b['Date']));
    
    // Group by date
    const byDate = {};
    sorted.forEach(w => {
        const d = w['Date'];
        if (!byDate[d]) byDate[d] = [];
        byDate[d].push(w);
    });
    
    // Calculate totals by workout type
    const byType = {};
    sorted.forEach(w => {
        const type = w['Workout Type'] || 'Unknown';
        if (!byType[type]) byType[type] = { count: 0, km: 0, mins: 0, cal: 0 };
        byType[type].count++;
        byType[type].km += parseFloat(w['Distance (km)']) || 0;
        byType[type].mins += parseFloat(w['Duration (min)']) || 0;
        byType[type].cal += parseFloat(w['Calories']) || 0;
    });
    
    const runKm = sorted.reduce((s, w) => s + (parseFloat(w['Distance (km)']) || 0), 0);
    const totalSessions = sorted.length;
    
    // Day name helper
    const getDayName = (dateStr) => {
        const d = new Date(dateStr);
        return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()];
    };
    
    return (
        <div className="modal-overlay open" onClick={onClose}>
            <div className="modal-sheet hide-scrollbar" onClick={e => e.stopPropagation()}>
                <div className="modal-handle" />
                <div className="modal-hero" style={{ background: 'linear-gradient(135deg, #E8F0FE 0%, #F0EDE8 100%)' }}>
                    <button className="modal-back" onClick={onClose}>‹</button>
                    <p className="label" style={{ marginBottom: 12 }}>THIS WEEK</p>
                    <div style={{ display: 'flex', alignItems: 'baseline', gap: 12 }}>
                        <span className="value-hero" style={{ color: 'var(--blue)' }}>{runKm.toFixed(1)}</span>
                        <span style={{ fontSize: 20, color: 'var(--text-secondary)' }}>km</span>
                    </div>
                    <div style={{ display: 'flex', gap: 20, marginTop: 12 }}>
                        <span style={{ fontSize: 14, color: 'var(--text-secondary)' }}>{totalSessions} sessions</span>
                        <span style={{ fontSize: 14, color: 'var(--text-secondary)' }}>{fmt.duration(weeklyMins)} total</span>
                    </div>
                    <div className="progress-bar" style={{ marginTop: 16 }}>
                        <div className="progress-fill" style={{ 
                            width: `${Math.min(100, (runKm / targetVol) * 100)}%`,
                            background: runKm >= targetVol ? 'var(--green)' : 'var(--blue)'
                        }} />
                    </div>
                    <p style={{ fontSize: 12, color: 'var(--text-tertiary)', marginTop: 6 }}>
                        {runKm >= targetVol ? '✓ Phase target met' : `${(targetVol - runKm).toFixed(1)}km to phase target (${Math.round(targetVol)}km)`}
                    </p>
                </div>
                
                <div className="modal-body">
                    {/* By Type */}
                    <div className="modal-section">
                        <p className="label" style={{ marginBottom: 12 }}>BY TYPE</p>
                        {Object.entries(byType).map(([type, data]) => (
                            <DataRow 
                                key={type} 
                                label={type} 
                                sublabel={`${data.count} session${data.count > 1 ? 's' : ''}${data.cal > 0 ? ' · ' + data.cal + ' cal' : ''}`}
                                value={data.km > 0 ? `${data.km.toFixed(1)} km` : fmt.duration(data.mins)}
                            />
                        ))}
                    </div>
                    
                    {/* Day by Day */}
                    <div className="modal-section">
                        <p className="label" style={{ marginBottom: 12 }}>DAY BY DAY</p>
                        {Object.entries(byDate).map(([date, sessions]) => (
                            <div key={date} style={{ marginBottom: 16 }}>
                                <p style={{ fontSize: 13, fontWeight: 600, color: 'var(--text-secondary)', marginBottom: 8 }}>
                                    {getDayName(date)} · {new Date(date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}
                                </p>
                                {sessions.map((w, i) => {
                                    const dist = parseFloat(w['Distance (km)']) || 0;
                                    const dur = parseFloat(w['Duration (min)']) || 0;
                                    const hr = parseFloat(w['Avg HR']) || 0;
                                    const pace = parseFloat(w['Avg Pace (sec/km)']) || 0;
                                    
                                    return (
                                        <div key={i} style={{ 
                                            padding: '12px 16px', 
                                            background: 'var(--card-elevated)', 
                                            borderRadius: 12, 
                                            marginBottom: 6 
                                        }}>
                                            <div className="flex flex-between flex-center">
                                                <p style={{ fontWeight: 500, fontSize: 15 }}>{w['Workout Type']}</p>

// Test Input Modal
const TestModal = ({ type, onClose, onSave }) => {
    const [value, setValue] = useState('');
    const [station, setStation] = useState('Row 500m');
    const [rounds, setRounds] = useState([{r:'',s:''},{r:'',s:''},{r:'',s:''},{r:'',s:''}]);
    
    const handleSave = () => {
        const date = localDateStr(new Date());
        if (type === 'twoKm' && parseTime(value) > 0) {
            onSave({ type: 'twoKm', date, time: parseTime(value) });
        } else if (type === 'threshold' && parseFloat(value) > 0) {
            const d = parseFloat(value);
            onSave({ type: 'threshold', date, distance: d, pace: Math.round(1200 / d) });
        } else if (type === 'miniSim') {
            const parsed = rounds.map(r => ({ run: parseTime(r.r), st: parseTime(r.s) }));
            const total = parsed.reduce((s, r) => s + r.run + r.st, 0);
            const decay = parsed[0].run > 0 ? (((parsed[3].run - parsed[0].run) / parsed[0].run) * 100).toFixed(1) : '0';
            if (total > 0) onSave({ type: 'miniSim', date, station, rounds: parsed, total, decay });
        }
        onClose();
    };
    
    const inputStyle = { width: '100%', padding: 14, background: 'var(--card-elevated)', border: '1px solid var(--border)', borderRadius: 12, color: 'var(--text)', fontSize: 17 };
    
    return (
        <div className="modal-overlay open" onClick={onClose}>
            <div className="modal-sheet" onClick={e => e.stopPropagation()}>
                <div className="modal-handle" />
                <div style={{ padding: 24 }}>
                    <h2 style={{ fontSize: 22, fontWeight: 600, marginBottom: 24 }}>

                    {type === 'twoKm' && (

                        </div>
                    )}
                    
                    {type === 'miniSim' && (
                        <div>
                            <p className="label" style={{ marginBottom: 8 }}>Station</p>
                            <select value={station} onChange={e => setStation(e.target.value)} style={{ ...inputStyle, marginBottom: 16 }}>

                                        onChange={e => { const n = [...rounds]; n[i].r = e.target.value; setRounds(n); }} 
                                        style={{ ...inputStyle, padding: 12, fontSize: 15 }} />

                            ))}

                    )}
                    
                    <div className="grid-2 mt-5">

                        <button onClick={handleSave} style={{ padding: 16, background: 'var(--blue)', border: 'none', borderRadius: 14, color: '#ffffff', fontWeight: 600, cursor: 'pointer' }}>Save</button>

};

    const daysToRace = Math.ceil((new Date(CONFIG.profile.raceDate) - today) / 86400000);
    
    // ============================================
    // 14-MONTH PERIODIZATION (Feb 2026 → Apr 2027)
    // ============================================
    const phases = [
        { name: 'Base 2', start: '2026-02-24', weeks: 8, focus: 'Volume + Threshold',
          volStart: 30, volEnd: 45, color: 'var(--green)',
          distribution: '70% Z2 · 10% Threshold/Compromised · 5% VO₂ · 5% Stations · 10% Strength',
          description: 'Build volume with quality. Alternating threshold and compromised running. VO₂max every Sunday.',
          keyWorkouts: ['Wk A: Running threshold · Wk B: Compromised (1km+station)', 'VO₂max Sunday', 'Long run 75→100min', 'Deload/test wk 4 & 8'] },
        { name: 'Build 1', start: '2026-04-21', weeks: 8, focus: 'VO₂max + Threshold',
          volStart: 45, volEnd: 55, color: 'var(--orange)',
          distribution: '65% Z2 · 12% Threshold/Compromised · 10% VO₂ · 5% Stations · 8% Strength',
          description: 'Push VO₂max ceiling. Threshold continues alternating with compromised running. Peak volume building.',
          keyWorkouts: ['5×4min VO₂max', 'Alternating threshold/compromised', 'Long run 100-110min', 'Deload/test wk 4 & 8'] },

          volStart: 50, volEnd: 60, color: 'var(--orange)',
          distribution: '65% Z2 · 12% Threshold/Compromised · 12% VO₂ · 3% Stations · 8% Strength',

          keyWorkouts: ['Long run 110-120min', '2 quality sessions/week', 'Compromised running focus', 'Deload/test wk 4 & 8'] },
        { name: 'Build 3', start: '2026-08-11', weeks: 8, focus: 'Sustained Peak + Race Prep',
          volStart: 55, volEnd: 60, color: 'var(--orange)',
          distribution: '62% Z2 · 12% Threshold/Compromised · 12% VO₂ · 6% Stations · 8% Strength',
          description: 'Sustain peak volume. Second block at 55-60km. This is where the aerobic ceiling really shifts.',
          keyWorkouts: ['Long run 110-120min', 'Compromised running weekly', '2 quality sessions/week', 'Deload/test wk 4 & 8'] },
        { name: 'Race Specific', start: '2026-10-06', weeks: 8, focus: 'HYROX-Specific',
          volStart: 50, volEnd: 50, color: 'var(--red)',
          distribution: '55% Z2 · 10% Threshold · 10% VO₂ · 10% Compromised · 5% Str · 10% Sim',
          description: 'Running under fatigue = focus. Simulations increase. Compromised running every week. Dial in pacing.',
          keyWorkouts: ['Full sim every 2 weeks', 'Compromised running weekly', 'Race-pace 1km repeats', 'Deload/test wk 4 & 8'] },
        { name: 'Peak + Taper', start: '2026-12-01', weeks: 4, focus: 'Taper to A-Race',
          volStart: 45, volEnd: 25, color: 'var(--purple)',
          distribution: 'Reduce volume 40-50%, maintain intensity',
          description: 'Trust your training. Cut volume but keep 1-2 sharp sessions. Prioritize sleep, nutrition, recovery.',
          keyWorkouts: ['Half simulation (week 1)', 'Short sharp intervals (week 2)', 'Easy running only (week 3-4)'] }
    ];
    
    // Determine current phase
    const getCurrentPhase = () => {
        const now = today.getTime();
        for (let i = phases.length - 1; i >= 0; i--) {
            if (now >= new Date(phases[i].start).getTime()) return i;
        }
        return 0;
    };
    const currentPhaseIdx = getCurrentPhase();
    const currentPhase = phases[currentPhaseIdx];
    
    // Weeks into current phase
    const weeksIntoPhase = Math.floor((today - new Date(currentPhase.start)) / (7 * 86400000));
    const phaseProgress = Math.min(1, weeksIntoPhase / currentPhase.weeks);
    const currentTargetVol = currentPhase.volStart + (currentPhase.volEnd - currentPhase.volStart) * phaseProgress;
    
    // 4-week training cycle: Wk 1-3 normal, Wk 4 deload/test
    const cycleWeek = (weeksIntoPhase % 4) + 1;
    const isDeload = cycleWeek === 4;
    const isWeekA = weeksIntoPhase % 2 === 0; // Alternates threshold (A) vs compromised (B)
    
    // ============================================
    // WEEKLY PLAN (Phase-dependent)
    // ============================================
    const getWeekPlan = () => {
        const phase = currentPhase.name;
        
        // Try to build plan from Google Sheet data
        if (planData.weekly.length > 0) {
            const phaseRows = planData.weekly.filter(r => r['Phase'] === phase);
            if (phaseRows.length > 0) {
                return phaseRows.map(r => {
                    const zoneMap = { 'Z2': 2, 'Threshold': 4, 'VO₂max': 5, 'Strength': 'str', 'Simulation': 'sim', 'Rest': 'rest' };
                    const zone = zoneMap[r['Zone']] || 'rest';
                    
                    // Parse exercises from pipe-separated string
                    const exercises = r['Details / Structure'] && r['Details / Structure'].includes('|') 
                        ? r['Details / Structure'].split('|').map(s => s.trim())
                        : null;
                    
                    // Parse structure from pipe-separated "block:time:note" format
                    const structure = r['Details / Structure'] && r['Details / Structure'].includes('→')
                        ? r['Details / Structure'].split('→').map(s => {
                            const parts = s.trim().split(':');
                            return { block: parts[0]?.trim(), time: parts[1]?.trim() || '', note: parts[2]?.trim() || '' };
                        })
                        : null;
                    
                    // Parse targets from pipe-separated "key:value" format  
                    const targets = {};
                    if (r['Targets'] && r['Targets'] !== '—') {
                        r['Targets'].split('·').forEach(t => {
                            const [k, v] = t.trim().split(/:\s*(.+)/);
                            if (k && v) targets[k.trim()] = v.trim();
                            else if (k) targets['Target'] = k.trim();
                        });
                    }
                    
                    // For strength days, get exercises from StrengthA/B sheets
                    let strengthExercises = null;
                    if (zone === 'str' && r['Session Type']?.includes('A')) {
                        const weekType = (weeksIntoPhase % 2 === 0) ? 'WEEK A' : 'WEEK B';
                        strengthExercises = getStrengthExercises(planData.strengthA, weekType, phase);
                    } else if (zone === 'str' && r['Session Type']?.includes('B')) {
                        const weekType = (weeksIntoPhase % 2 === 0) ? 'WEEK A' : 'WEEK B';
                        strengthExercises = getStrengthExercises(planData.strengthB, weekType, phase);
                    }
                    
                    return {
                        day: r['Day'],
                        type: r['Session Type'],
                        zone,
                        duration: parseFloat(r['Duration']?.replace(/[^\d.]/g, '')) || 0,
                        distance: parseFloat(r['Distance']?.replace(/[^\d.]/g, '')) || 0,
                        purpose: r['Main Focus'] || '',
                        targets: Object.keys(targets).length > 0 ? targets : undefined,
                        structure: structure || undefined,
                        exercises: strengthExercises || exercises || undefined
                    };
                });
            }
        }
        
        // ═══ FALLBACK: Hardcoded plans (used if sheet not available) ═══
        // 4-week cycle: Wk 1-3 normal, Wk 4 deload/test (60% volume)
        
        if (phase === 'Base 2') {
            if (isDeload) return [
                { day: 'Monday', type: 'Z2 Stepper', zone: 2, duration: 30, distance: 0, modality: 'stepper', purpose: 'DELOAD WEEK — 60% volume.' },
                { day: 'Tuesday', type: 'Strength A (light)', zone: 'str', duration: 45, distance: 0, modality: 'gym', purpose: 'Reduced sets (2 per exercise). Movement quality.', exercises: ['2 sets per exercise.'] },

        console.log('[HRV Balance Debug]', { hrvAvg14: hrvAvg14.toFixed(1), hrvBaseline60: hrvBaseline60.toFixed(1), hrvTrend3d: hrvTrend3d.toFixed(1), hrv14Count: hrv14.length, hrv60Count: hrv60.length });
        
        // VO2 and volume history

            for (let w = 0; w < Math.min(weeks, 12); w++) {

                const wKm = allWorkoutsSorted
                    .filter(wo => { const d = new Date(wo['Date']); return d >= wStart && d < wEnd; })
                    .reduce((s, wo) => s + (parseFloat(wo['Distance (km)']) || 0), 0);

        }
        
        // Test data
        const latestTests = {
            twoKm: tests.twoKm?.length > 0 ? tests.twoKm[tests.twoKm.length - 1] : null,

        };
        
        return {

                    onClose={() => setModal(null)}
                    onLogTest={(t) => { setModal(null); setTestModal(t); }}
                />
            )}
            {modal?.type === 'session' && (
                <SessionModal session={modal.data} onClose={() => setModal(null)} />
            )}
            {modal?.type === 'volume' && (
                <VolumeModal stats={workoutStats} targetVol={currentTargetVol} onClose={() => setModal(null)} />
            )}
            {modal?.type === 'zones' && modal.data && (
                <ZoneEntryModal 
                    workout={modal.data} 
                    onClose={() => setModal(null)} 
                    onSave={() => setZoneVersion(v => v + 1)}
                />
            )}
            {testModal && (
                <TestModal type={testModal} onClose={() => setTestModal(null)} onSave={handleTestSave} />
            )}
        </>
    );
}

// Error boundary to catch render crashes
class ErrorBoundary extends React.Component {
    constructor(props) { super(props); this.state = { error: null }; }
    static getDerivedStateFromError(error) { return { error }; }
    render() {
        if (this.state.error) return (
            <div style={{ padding: 40, fontFamily: 'monospace', fontSize: 14, color: '#D93025', background: '#FFF', minHeight: '100vh' }}>
                <h2 style={{ marginBottom: 16 }}>HYROX ENGINE — Render Error</h2>
                <pre style={{ whiteSpace: 'pre-wrap', wordBreak: 'break-word' }}>{this.state.error.message}{'\n'}{this.state.error.stack}</pre>
            </div>
        );
        return this.props.children;
    }
}

ReactDOM.createRoot(document.getElementById('app')).render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
